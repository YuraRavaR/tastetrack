<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>An album's and a song's artists as links</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.tt{--bg:oklch(0.18 0.01 60);--fg:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--pri:oklch(0.84 0.16 90);--prif:oklch(0.17 0.006 50);--strong:oklch(0.84 0.16 90);--soft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--mf:oklch(0.74 0.02 70);--bd:oklch(1 0 0 / 11%);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.tt.light{--bg:oklch(0.97 0.012 80);--fg:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--pri:oklch(0.82 0.16 88);--prif:oklch(0.22 0.02 60);--strong:oklch(0.52 0.11 80);--soft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--mf:oklch(0.47 0.02 60);--bd:oklch(0.88 0.015 75)}
.tt *{box-sizing:border-box}
.col{width:1290px;display:flex;flex-wrap:wrap;gap:40px 60px;align-items:flex-start}
.cap{font:600 15px ui-sans-serif,system-ui,sans-serif;color:#8a8378;min-height:26px;max-width:390px}
.scr{background:var(--bg);border:1px solid var(--bd);border-radius:20px;overflow:hidden;padding-bottom:20px}
.phone{width:390px}.web{width:960px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pic{aspect-ratio:1;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent);mask-image:linear-gradient(to bottom,#000 70%,transparent)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.facts{position:relative;margin-top:-36px;padding:0 16px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.facts h1{margin:0;font-size:26px;font-weight:700;line-height:1.15}
.line{font-size:14px;line-height:1.35;color:var(--mf)}
.al{color:var(--fg);font-weight:600;text-decoration:underline;text-decoration-color:var(--strong);text-underline-offset:3px;text-decoration-thickness:2px}
.src{min-height:44px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--strong);text-decoration:none}
.src svg{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{min-height:44px;padding:0 12px 0 5px;border:1px solid var(--bd);border-radius:999px;background:var(--card);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;text-decoration:none}
.chip .av{width:34px;height:34px;border-radius:50%;background:var(--muted);color:var(--mf);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;object-fit:cover}
.chip svg{width:16px;height:16px;color:var(--mf)}
.body{padding:14px 16px 0;display:flex;flex-direction:column;gap:18px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:48px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:inherit;font:inherit;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 14px}
.btn.primary{background:var(--pri);color:var(--prif);border-color:transparent}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{margin:0;font-size:18px;font-weight:600}
.card{margin:0;padding:0;list-style:none;border:1px solid var(--bd);border-radius:14px;background:var(--card)}
.card li+li{border-top:1px solid var(--bd)}
.go{min-height:64px;padding:8px 12px;display:flex;align-items:center;gap:12px;text-decoration:none}
.go .av{width:44px;height:44px;border-radius:50%;background:var(--muted);color:var(--mf);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none;object-fit:cover}
.nm{flex:1;display:flex;flex-direction:column;gap:2px;font-size:15px;font-weight:600}
.nm small{font-size:13px;font-weight:400;color:var(--mf)}
.next{color:var(--mf);transform:rotate(180deg)}
.web .wtop{position:relative}
.web .ban{aspect-ratio:21/9;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 45%,transparent);mask-image:linear-gradient(to bottom,#000 45%,transparent)}
.web .ban img{width:100%;height:100%;object-fit:cover;transform:scale(1.3);filter:blur(30px) saturate(1.3)}
.web .lead{position:relative;margin-top:-180px;padding:0 24px;display:flex;align-items:flex-end;gap:28px}
.web .lead img.cv{width:176px;height:176px;border-radius:14px;box-shadow:0 10px 24px oklch(0 0 0 / 30%)}
.web .facts{margin:0;padding:0 0 6px}
.web .facts h1{font-size:34px}
.web .line{font-size:16px}
.web .body{padding:20px 24px 0}
.web .btn{height:40px;font-size:14px}
.web .sec{max-width:560px}
.va .bc,.va .b,.va .c,.vb .a,.vb .c,.vc .a,.vc .b{display:none}
</style>
</helmet>
<div style="width: 2660px; display: flex; gap: 80px; align-items: flex-start">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="{{th.cls}}">
<div class="col">
<sc-for list="{{phones}}" as="s" hint-placeholder-count="6">
<div>
<div class="cap">{{s.cap}}</div>
<div class="{{s.box}}">
<div class="pic"><img src="{{s.cover}}" alt=""></div>
<div class="facts">
<h1>{{s.title}}</h1>
<span class="line a">{{s.year}} · <sc-for list="{{s.artists}}" as="ar" hint-placeholder-count="1"><a class="al" href="#">{{ar.name}}</a>{{ar.sep}}</sc-for></span>
<span class="line bc">{{s.year}}</span>
<span class="b chips"><sc-for list="{{s.artists}}" as="ar" hint-placeholder-count="1"><a class="chip" href="#"><span class="av">{{ar.ini}}</span>{{ar.name}}<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></sc-for></span>
<a class="src" href="#">On MusicBrainz<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></a>
</div>
<div class="body">
<div class="acts">
<sc-if value="{{s.album}}" hint-placeholder-val="{{true}}"><button class="btn primary"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Listened</button><button class="btn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>Want to listen</button></sc-if>
<button class="btn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 12H3M16 6H3M16 18H3M18 9v6M21 12h-6"></path></svg>Add to collection</button>
</div>
<section class="sec c">
<h2>{{s.byHead}}</h2>
<ul class="card"><sc-for list="{{s.artists}}" as="ar" hint-placeholder-count="1"><li><a class="go" href="#"><span class="av">{{ar.ini}}</span><span class="nm">{{ar.name}}<small>Artist</small></span><svg class="ic next" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a></li></sc-for></ul>
</section>
</div>
</div>
</div>
</sc-for>
<sc-for list="{{webs}}" as="s" hint-placeholder-count="3">
<div>
<div class="cap">{{s.cap}}</div>
<div class="{{s.box}}">
<div class="ban"><img src="/_blob/557f520ac23d97e1fe1b576ca42ca4d4" alt=""></div>
<div class="lead">
<img class="cv" src="/_blob/557f520ac23d97e1fe1b576ca42ca4d4" alt="">
<div class="facts">
<h1>Земля</h1>
<span class="line a">2013 · <a class="al" href="#">Океан Ельзи</a></span>
<span class="line bc">2013</span>
<span class="b chips"><a class="chip" href="#"><span class="av">ОЕ</span>Океан Ельзи<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></span>
<a class="src" href="#">On MusicBrainz<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></a>
</div>
</div>
<div class="body">
<div class="acts"><button class="btn primary"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Listened</button><button class="btn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>Want to listen</button><button class="btn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 12H3M16 6H3M16 18H3M18 9v6M21 12h-6"></path></svg>Add to collection</button></div>
<section class="sec c"><h2>Artist</h2><ul class="card"><li><a class="go" href="#"><span class="av">ОЕ</span><span class="nm">Океан Ельзи<small>Artist</small></span><svg class="ic next" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a></li></ul></section>
</div>
</div>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2660,"height":2900}}'>
class Component extends DCLogic {
renderVals() {
const okean = [{ name: 'Океан Ельзи', ini: 'ОЕ', sep: '' }];
const duo = [{ name: 'alyona alyona', ini: 'AA', sep: ' & ' }, { name: 'Jerry Heil', ini: 'JH', sep: '' }];
const album = { album: true, title: 'Земля', year: '2013', cover: '/_blob/557f520ac23d97e1fe1b576ca42ca4d4', artists: okean, byHead: 'Artist' };
const song = { album: false, title: 'Teresa & Maria', year: '2023', cover: '/_blob/c84c984020a7420cbf0282635387f0ee', artists: duo, byHead: 'Artists' };
return {
themes: [{ cls: 'tt dark' }, { cls: 'tt light' }],
phones: [
{ ...album, cap: 'a · the name in the facts line, underlined', box: 'scr phone va' },
{ ...album, cap: 'b · a chip for each artist under the title', box: 'scr phone vb' },
{ ...album, cap: 'c · an Artist row under the actions', box: 'scr phone vc' },
{ ...song, cap: 'a · a song with two artists', box: 'scr phone va' },
{ ...song, cap: 'b · two chips', box: 'scr phone vb' },
{ ...song, cap: 'c · two rows', box: 'scr phone vc' }
],
webs: [
{ cap: 'a on the web, an album’s page', box: 'scr web va' },
{ cap: 'b on the web', box: 'scr web vb' },
{ cap: 'c on the web', box: 'scr web vc' }
]
};
}
}
</script>
</body>
</html>
