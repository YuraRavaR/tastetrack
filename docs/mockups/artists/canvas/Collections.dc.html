<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collections on Artists</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.tt{--bg:oklch(0.18 0.01 60);--fg:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--pri:oklch(0.84 0.16 90);--prif:oklch(0.17 0.006 50);--strong:oklch(0.84 0.16 90);--soft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--mf:oklch(0.74 0.02 70);--bd:oklch(1 0 0 / 11%);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.tt.light{--bg:oklch(0.97 0.012 80);--fg:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--pri:oklch(0.82 0.16 88);--prif:oklch(0.22 0.02 60);--strong:oklch(0.52 0.11 80);--soft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--mf:oklch(0.47 0.02 60);--bd:oklch(0.88 0.015 75)}
.tt *{box-sizing:border-box}
.col{width:1290px;display:flex;flex-wrap:wrap;gap:40px 60px;align-items:flex-start}
.cap{font:600 15px ui-sans-serif,system-ui,sans-serif;color:#8a8378;min-height:26px;max-width:390px}
.scr{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.phone{width:390px}.web{width:960px;padding:24px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fill{fill:currentColor}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.h1{margin:0;font-size:28px;font-weight:700}
.new{height:44px;border:0;border-radius:999px;background:var(--pri);color:var(--prif);font:inherit;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;padding:0 16px}
.seg{background:var(--muted);border-radius:14px;padding:4px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.sg{height:56px;border:0;border-radius:11px;background:transparent;color:var(--fg);font:inherit;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;min-width:0}
.sg.on{background:var(--card);color:var(--strong);font-weight:600;box-shadow:0 1px 3px oklch(0 0 0 / 14%)}
.web .sg{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px;margin:0;padding:0;list-style:none}
.web .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px}
.cc{display:flex;flex-direction:column;gap:4px;text-decoration:none}
.col4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;border-radius:14px;overflow:hidden;aspect-ratio:1;margin-bottom:6px}
.col4 img,.col4 span{width:100%;height:100%;object-fit:cover;display:block;background:var(--muted)}
.cc b{font-size:17px;line-height:1.25}
.meta{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mf)}
.meta svg{width:16px;height:16px}
.fav .meta{color:var(--strong)}
.wide{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--bd);border-radius:16px;background:var(--card);text-decoration:none}
.wide .top{display:flex;align-items:center;justify-content:space-between}
.wide b{font-size:18px}
.faces{display:flex}
.face{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;margin-right:-8px;position:relative}
.face img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--card)}
.face i{font-style:normal;font-size:12px;font-weight:700;color:var(--mf)}
.web .face{width:84px;margin-right:-6px}
.web .face img{width:84px;height:84px}
.rowh{display:flex;align-items:baseline;justify-content:space-between}
.rowh h2{margin:0;font-size:18px;font-weight:600;display:flex;align-items:center;gap:6px}
.rowh h2 svg{color:var(--strong)}
.rowh a{font-size:14px;font-weight:600;color:var(--strong);text-decoration:none;min-height:44px;display:flex;align-items:center}
.ranks{display:flex;gap:12px;overflow:hidden;margin:-6px -16px 0;padding:0 16px;list-style:none}
.web .ranks{margin:-6px 0 0;padding:0}
.ranks li{flex:none;width:76px}
.ranks a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;text-align:center;font-size:13px;font-weight:600;line-height:1.2}
.ranks .pic{position:relative}
.ranks img{width:76px;height:76px;border-radius:50%;object-fit:cover;display:block}
.ranks .n{position:absolute;left:-2px;top:-2px;width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--prif);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.sub{margin:4px 0 0;font-size:18px;font-weight:600}
.va .b,.va .c,.vb .a,.vb .c,.vc .a,.vc .b{display:none}
</style>
</helmet>
<div style="width: 2660px; display: flex; gap: 80px; align-items: flex-start">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="{{th.cls}}">
<div class="col">
<sc-for list="{{screens}}" as="s" hint-placeholder-count="6">
<div>
<div class="cap">{{s.cap}}</div>
<div class="{{s.box}}">
<div class="head"><h1 class="h1">Collections</h1><button class="new"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>New collection</button></div>
<div class="seg" role="group" aria-label="Media Type">
<button class="sg"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3ZM6.2 5.3l3.1 3.9M12.4 3.4l3.1 4M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path></svg>Films</button>
<button class="sg"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg>Books</button>
<button class="sg"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"></rect><path d="M17 2l-5 5-5-5"></path></svg>Series</button>
<button class="sg"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01M17.32 5H6.68a4 4 0 0 0-3.978 3.59C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258A4 4 0 0 0 17.32 5z"></path></svg>Games</button>
<button class="sg"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M6 12c0-1.7.7-3.2 1.8-4.2M18 12c0 1.7-.7 3.2-1.8 4.2"></path><circle cx="12" cy="12" r="2"></circle></svg>Albums</button>
<button class="sg"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>Songs</button>
<button class="sg on" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m11 7.601-5.994 8.19a1 1 0 0 0 .1 1.298l.817.818a1 1 0 0 0 1.314.087L15.09 12M16.5 21.174C15.5 20.5 14.372 20 13 20c-2.058 0-3.928 2.356-6 2-2.072-.356-2.775-3.369-1.5-4.5"></path><circle cx="16" cy="7" r="5"></circle></svg>Artists</button>
</div>

<a class="b wide" href="#">
<span class="top"><b>Favourite artists</b><span class="meta" style="color: var(--strong)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>10 artists</span></span>
<span class="faces"><sc-for list="{{s.top}}" as="f" hint-placeholder-count="5"><span class="face"><img src="{{f.src}}" alt=""><i>{{f.n}}</i></span></sc-for></span>
</a>

<div class="c rowh"><h2><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>Favourite artists</h2><a href="#">All 10</a></div>
<ol class="c ranks">
<sc-for list="{{favs}}" as="f" hint-placeholder-count="5"><li><a href="#"><span class="pic"><img src="{{f.src}}" alt=""><span class="n">{{f.n}}</span></span>{{f.name}}</a></li></sc-for>
</ol>
<h2 class="c sub">Your Collections</h2>

<ul class="grid">
<li class="a"><a class="cc fav" href="#"><span class="col4"><img src="/_blob/1317496f4b7636e3141f303e3ab3ab68" alt=""><img src="/_blob/aabb6ee0bbc15365e92eff1ac8422d9b" alt=""><img src="/_blob/cdec6de6e6c5d7b105fd501cd34731cc" alt=""><img src="/_blob/ce7595dde80b7d3ff5fa8fd6efdff11d" alt=""></span><b>Favourite artists</b><span class="meta"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>10 artists · Ranked</span></a></li>
<li><a class="cc" href="#"><span class="col4"><img src="/_blob/aabb6ee0bbc15365e92eff1ac8422d9b" alt=""><img src="/_blob/9c94d0ee8b3b9e87ced510f180c6cda0" alt=""><img src="/_blob/e2a686d57980553cc9d90f935314ff12" alt=""><img src="/_blob/50aa9a471ba085c0dc1215514773865c" alt=""></span><b>Bands to show a friend</b><span class="meta"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m11 7.601-5.994 8.19a1 1 0 0 0 .1 1.298l.817.818a1 1 0 0 0 1.314.087L15.09 12M16.5 21.174C15.5 20.5 14.372 20 13 20c-2.058 0-3.928 2.356-6 2-2.072-.356-2.775-3.369-1.5-4.5"></path><circle cx="16" cy="7" r="5"></circle></svg>6 artists · <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17H7A5 5 0 0 1 7 7h2M15 7h2a5 5 0 1 1 0 10h-2M8 12h8"></path></svg>Shared</span></a></li>
<li><a class="cc" href="#"><span class="col4"><img src="/_blob/ce7595dde80b7d3ff5fa8fd6efdff11d" alt=""><img src="/_blob/9c94d0ee8b3b9e87ced510f180c6cda0" alt=""><img src="/_blob/cdec6de6e6c5d7b105fd501cd34731cc" alt=""><span></span></span><b>Ukraine at Eurovision</b><span class="meta"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m11 7.601-5.994 8.19a1 1 0 0 0 .1 1.298l.817.818a1 1 0 0 0 1.314.087L15.09 12M16.5 21.174C15.5 20.5 14.372 20 13 20c-2.058 0-3.928 2.356-6 2-2.072-.356-2.775-3.369-1.5-4.5"></path><circle cx="16" cy="7" r="5"></circle></svg>3 artists</span></a></li>
</ul>
</div>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2660,"height":2700}}'>
class Component extends DCLogic {
renderVals() {
const f = (n, name, id) => ({ n: String(n), name, src: '/_blob/' + id });
const favs = [
f(1, 'Океан Ельзи', '1317496f4b7636e3141f303e3ab3ab68'),
f(2, 'DakhaBrakha', 'aabb6ee0bbc15365e92eff1ac8422d9b'),
f(3, 'Jamala', 'cdec6de6e6c5d7b105fd501cd34731cc'),
f(4, 'Kalush Orchestra', 'ce7595dde80b7d3ff5fa8fd6efdff11d'),
f(5, 'Христина Соловій', '36444a6f4d042178f34ad1dd04aad017'),
f(6, 'Скрябін', 'be639675dd6440e84c505641613ee29e'),
f(7, 'Radiohead', 'edc9de62b9a995152e046dd1b137bf79'),
f(8, 'Björk', 'cde8d31d0fb8c5edc8c2b08ee31c51bb'),
f(9, 'Pink Floyd', '888d7b70c44a8acabf87ade95b073952'),
f(10, 'Бумбокс', '50aa9a471ba085c0dc1215514773865c')
];
return {
themes: [{ cls: 'tt dark' }, { cls: 'tt light' }],
favs,
screens: [
{ cap: 'A · Favourite artists as the first card, marked with ♥', box: 'scr phone va' },
{ cap: 'B · a wide card on top, the first five in a row', box: 'scr phone vb', top: favs.slice(0, 5) },
{ cap: 'C · a numbered strip, then the Collections', box: 'scr phone vc' },
{ cap: 'A on the web', box: 'scr web va' },
{ cap: 'B on the web', box: 'scr web vb', top: favs.slice(0, 8) },
{ cap: 'C on the web', box: 'scr web vc' }
]
};
}
}
</script>
</body>
</html>
