<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saved A, tiles and chips, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tt{--bg:oklch(0.97 0.012 80);--fg:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--muted:oklch(0.935 0.016 75);--mfg:oklch(0.47 0.02 60);--pri:oklch(0.82 0.16 88);--pfg:oklch(0.22 0.02 60);--pstrong:oklch(0.52 0.11 80);--psoft:oklch(0.96 0.037 87);--border:oklch(0.88 0.015 75);--shadow:oklch(0.2 0.01 50 / 14%)}
.tt.dark{--bg:oklch(0.18 0.01 60);--fg:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--muted:oklch(0.28 0.014 60);--mfg:oklch(0.74 0.02 70);--pri:oklch(0.84 0.16 90);--pfg:oklch(0.17 0.006 50);--pstrong:oklch(0.84 0.16 90);--psoft:oklch(0.31 0.034 85);--border:oklch(1 0 0 / 11%);--shadow:oklch(0 0 0 / 50%)}
.tt a{color:var(--fg)}
.tt button{font:inherit;cursor:pointer;color:inherit}
.tt button:disabled{cursor:not-allowed}
</style>
</helmet>
<div class="tt {{themeClass}}" style="width: 402px; height: 874px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased">

<header style="flex-shrink: 0; padding: 62px 16px 8px; display: flex; align-items: center; justify-content: space-between; background: var(--card); border-bottom: 1px solid var(--border)">
<a href="#" style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 600; font-size: 22px; text-decoration: none">TasteTrack</a>
<button type="button" aria-label="Account: Invites, Settings, Log out" style="width: 44px; height: 44px; margin-right: -4px; border: 0; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 34px; height: 34px; border-radius: 999px; background: var(--muted); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span></button>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column">

<sc-if value="{{onCats}}" hint-placeholder-val="{{true}}">
<div style="padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0 0 4px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Saved</h1>

<button type="button" onClick="{{openFilms}}" style="position: relative; height: 172px; padding: 18px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: stretch; border: 1px solid var(--border); border-radius: 18px; background: var(--card); text-align: left; overflow: hidden">
<span style="display: flex; flex-direction: column; justify-content: space-between; z-index: 1">
<span style="width: 40px; height: 40px; border-radius: 12px; background: var(--psoft); color: var(--pstrong); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="1.5"></rect><path d="M3 9l1.5-5h16L19 9M9 4l-1.5 5M14 4l-1.5 5M19 4l-1.5 5"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 24px; font-weight: 700; letter-spacing: -0.01em">Films</span>
<span style="font-size: 14px; color: var(--mfg)">12 to watch · 14 watched</span>
</span>
</span>
<span aria-hidden="true" style="position: relative; width: 150px; flex-shrink: 0">
<span style="position: absolute; right: 70px; top: 22px; width: 70px; height: 105px; border-radius: 8px; background: {{collage0}}; transform: rotate(-9deg); box-shadow: 0 6px 16px var(--shadow)"></span>
<span style="position: absolute; right: 8px; top: 22px; width: 70px; height: 105px; border-radius: 8px; background: {{collage2}}; transform: rotate(9deg); box-shadow: 0 6px 16px var(--shadow)"></span>
<span style="position: absolute; right: 36px; top: 6px; width: 78px; height: 117px; border-radius: 8px; background: {{collage1}}; box-shadow: 0 8px 20px var(--shadow)"></span>
</span>
</button>

<button type="button" disabled aria-describedby="books-soon" style="height: 120px; padding: 18px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start; border: 1.5px dashed var(--border); border-radius: 18px; background: transparent; text-align: left; color: var(--mfg)">
<span style="display: flex; flex-direction: column; gap: 14px">
<span style="width: 40px; height: 40px; border-radius: 12px; background: var(--muted); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg></span>
<span style="font-size: 20px; font-weight: 600">Books</span>
</span>
<span id="books-soon" style="padding: 4px 10px; border-radius: 999px; background: var(--muted); font-size: 12px; font-weight: 600">Coming soon</span>
</button>
</div>
</sc-if>

<sc-if value="{{onType}}" hint-placeholder-val="{{false}}">
<div style="padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 12px">
<div>
<button type="button" onClick="{{back}}" style="height: 36px; margin-left: -8px; padding: 0 8px; display: inline-flex; align-items: center; gap: 2px; border: 0; background: transparent; color: var(--mfg); font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Saved</button>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Films</h1>
</div>

<div role="tablist" aria-label="Status" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 12px; background: var(--muted)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{t.active}}" onClick="{{t.pick}}" style="height: 38px; border: 0; border-radius: 9px; font-size: 14px; font-weight: 600; background: {{t.bg}}; box-shadow: {{t.shadow}}">{{t.label}} <span style="color: var(--mfg); font-weight: 500">{{t.count}}</span></button>
</sc-for>
</div>

<div style="position: relative">
<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
<button type="button" aria-haspopup="menu" aria-expanded="{{c.open}}" onClick="{{c.toggle}}" style="flex-shrink: 0; height: 36px; padding: 0 10px 0 12px; display: flex; align-items: center; gap: 4px; border: 1px solid {{c.border}}; border-radius: 999px; background: {{c.bg}}; font-size: 14px; font-weight: 500; white-space: nowrap">
<sc-if value="{{c.isSort}}" hint-placeholder-val="{{false}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"></path></svg></sc-if>
{{c.label}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</sc-for>
</div>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<div role="menu" style="position: absolute; top: 42px; left: {{menuLeft}}px; z-index: 10; min-width: 190px; padding: 4px; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 28px var(--shadow)">
<sc-for list="{{menuItems}}" as="o" hint-placeholder-count="4">
<button type="button" role="menuitemradio" aria-checked="{{o.active}}" onClick="{{o.pick}}" style="height: 44px; padding: 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 0; border-radius: 8px; background: {{o.bg}}; font-size: 15px; text-align: left">{{o.label}}<sc-if value="{{o.active}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--pstrong)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></sc-if></button>
</sc-for>
</div>
</sc-if>
</div>

<sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
<ul style="margin: 4px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 12px">
<sc-for list="{{items}}" as="f" hint-placeholder-count="9">
<li style="min-width: 0">
<a href="#" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none">
<span style="position: relative; aspect-ratio: 2 / 3; border-radius: 8px; background: {{f.tone}}; overflow: hidden; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box">
<span aria-hidden="true" style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 600; font-size: 14px; line-height: 1.15; color: oklch(0.97 0.01 80)">{{f.t}}</span>
<sc-if value="{{f.seenBefore}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="Watched before" style="position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 999px; background: var(--pri); color: var(--pfg); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px oklch(0 0 0 / 30%)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></span></sc-if>
</span>
<span style="font-size: 13px; font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{f.t}}</span>
<span style="margin-top: -3px; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--mfg)">
<sc-if value="{{f.rated}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="var(--pstrong)" stroke="var(--pstrong)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"></polygon></svg></sc-if>{{f.meta}}</span>
</a>
</li>
</sc-for>
</ul>
</sc-if>
<sc-if value="{{noItems}}" hint-placeholder-val="{{false}}">
<div style="padding: 40px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; color: var(--mfg)">
<p style="margin: 0; font-size: 15px">No films match these filters.</p>
<button type="button" onClick="{{clear}}" style="height: 40px; padding: 0 16px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); font-size: 14px; font-weight: 600">Clear filters</button>
</div>
</sc-if>
</div>
</sc-if>
</main>

<nav aria-label="Main" style="flex-shrink: 0; padding: 6px 12px 34px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; background: var(--card); border-top: 1px solid var(--border)">
<a href="#" aria-current="page" onClick="{{back}}" style="padding: 5px 0; display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 12px; background: var(--psoft); text-decoration: none; color: var(--pstrong); font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Saved</a>
<a href="#" style="padding: 5px 0; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--mfg); font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Collections</a>
<a href="#" style="padding: 5px 0; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--mfg); font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"startOn":{"editor":"enum","options":["categories","watchlist","watched"],"default":"categories"},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const start = this.props.startOn || 'categories';
const screen = st.screen || (start === 'categories' ? 'cats' : 'type');
const tab = st.tab || (start === 'watched' ? 'watched' : 'watchlist');
const menu = st.menu || null;
const sortW = st.sortW || 'added';
const sortD = st.sortD || 'last';
const genre = st.genre || null;
const decade = st.decade || null;
const minR = st.minR || 0;
const tone = (h, l) => 'oklch(' + (l || 0.42) + ' 0.075 ' + h + ')';
const WL = [
['Past Lives', 2023, ['Drama', 'Romance'], 250], ['Perfect Days', 2023, ['Drama'], 150],
['Anatomy of a Fall', 2023, ['Drama', 'Thriller'], 30], ['Parasite', 2019, ['Thriller', 'Comedy'], 95, true],
['Aftersun', 2022, ['Drama'], 210], ['Drive My Car', 2021, ['Drama'], 15],
['The Zone of Interest', 2023, ['Drama', 'History'], 125], ['Poor Things', 2023, ['Comedy', 'Sci-Fi'], 335],
['Decision to Leave', 2022, ['Thriller', 'Romance'], 185], ['Fallen Leaves', 2023, ['Comedy', 'Romance'], 5],
['Paris, 13th District', 2021, ['Drama', 'Romance'], 280], ['Close', 2022, ['Drama'], 65]
].map((r, i) => ({ t: r[0], y: r[1], g: r[2], tone: tone(r[3]), seenBefore: !!r[4], added: i }));
const WD = [
['Dune: Part Two', 2024, ['Sci-Fi'], 4.5, 60], ['Parasite', 2019, ['Thriller', 'Comedy'], 5, 95],
['Oppenheimer', 2023, ['Drama', 'History'], 4, 40], ['In the Mood for Love', 2000, ['Romance', 'Drama'], 5, 20],
['Spirited Away', 2001, ['Animation'], 4.5, 175], ['Arrival', 2016, ['Sci-Fi', 'Drama'], 4, 230],
['Whiplash', 2014, ['Drama'], 4.5, 30], ['Portrait of a Lady on Fire', 2019, ['Romance', 'Drama'], 5, 140],
['Her', 2013, ['Romance', 'Sci-Fi'], 3.5, 10], ['La La Land', 2016, ['Romance', 'Comedy'], 3.5, 265],
['Prisoners', 2013, ['Thriller'], 4, 200], ['Amélie', 2001, ['Comedy', 'Romance'], 4, 115],
['Before Sunrise', 1995, ['Romance'], 4.5, 300], ['Heat', 1995, ['Thriller'], 4, 50]
].map((r, i) => ({ t: r[0], y: r[1], g: r[2], r: r[3], tone: tone(r[4]), last: i }));
const isW = tab === 'watchlist';
const sort = isW ? sortW : sortD;
const SORTS = isW ? [['added', 'Date added'], ['title', 'Title'], ['year', 'Release year']] : [['last', 'Last watched'], ['rating', 'Rating'], ['title', 'Title'], ['year', 'Release year']];
let list = (isW ? WL : WD).filter((f) => (!genre || f.g.indexOf(genre) >= 0) && (!decade || Math.floor(f.y / 10) * 10 === decade) && (isW || !minR || f.r >= minR));
const by = { added: (a, b) => a.added - b.added, last: (a, b) => a.last - b.last, rating: (a, b) => b.r - a.r || a.last - b.last, title: (a, b) => a.t.localeCompare(b.t), year: (a, b) => b.y - a.y };
list = list.slice().sort(by[sort]);
const items = list.map((f) => Object.assign({}, f, { rated: !isW, meta: isW ? String(f.y) : f.r.toFixed(1) }));
const sortLabel = SORTS.filter((s) => s[0] === sort)[0][1];
const toggle = (m) => () => this.setState({ menu: menu === m ? null : m });
const chips = [{ id: 'sort', label: sortLabel, on: false, isSort: true }, { id: 'genre', label: genre || 'Genre', on: !!genre }, { id: 'decade', label: decade ? decade + 's' : 'Decade', on: !!decade }];
if (!isW) chips.push({ id: 'rating', label: minR ? (minR === 5 ? '5★ only' : minR + '★ and up') : 'Rating', on: !!minR });
const chipsOut = chips.map((c) => Object.assign({}, c, { open: menu === c.id, toggle: toggle(c.id), bg: c.on ? 'var(--psoft)' : 'var(--card)', border: c.on ? 'var(--pstrong)' : 'var(--border)' }));
const lefts = { sort: 0, genre: 120, decade: 160, rating: 160 };
let opts = [];
if (menu === 'sort') opts = SORTS.map((s) => ({ label: s[1], active: s[0] === sort, pick: () => this.setState(isW ? { sortW: s[0], menu: null } : { sortD: s[0], menu: null }) }));
if (menu === 'genre') opts = [null, 'Drama', 'Romance', 'Thriller', 'Comedy', 'Sci-Fi', 'Animation', 'History'].map((g) => ({ label: g || 'Any genre', active: genre === g, pick: () => this.setState({ genre: g, menu: null }) }));
if (menu === 'decade') opts = [null, 2020, 2010, 2000, 1990].map((d) => ({ label: d ? d + 's' : 'Any decade', active: decade === d, pick: () => this.setState({ decade: d, menu: null }) }));
if (menu === 'rating') opts = [[0, 'Any rating'], [4, '4★ and up'], [4.5, '4.5★ and up'], [5, '5★ only']].map((o) => ({ label: o[1], active: minR === o[0], pick: () => this.setState({ minR: o[0], menu: null }) }));
const menuItems = opts.map((o) => Object.assign({}, o, { bg: o.active ? 'var(--muted)' : 'transparent' }));
const tabs = [['watchlist', 'Watchlist', WL.length], ['watched', 'Watched', WD.length]].map((t) => ({ label: t[1], count: t[2], active: tab === t[0], bg: tab === t[0] ? 'var(--card)' : 'transparent', shadow: tab === t[0] ? '0 1px 3px var(--shadow)' : 'none', pick: () => this.setState({ tab: t[0], menu: null, screen: 'type' }) }));
return {
themeClass: this.props.dark ? 'dark' : '',
onCats: screen === 'cats', onType: screen === 'type',
openFilms: () => this.setState({ screen: 'type', tab: 'watchlist', menu: null }),
back: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ screen: 'cats', menu: null }); },
collage0: WL[0].tone, collage1: WL[1].tone, collage2: WL[2].tone,
tabs, chips: chipsOut, menuOpen: !!menu, menuItems, menuLeft: lefts[menu] || 0,
items, hasItems: items.length > 0, noItems: items.length === 0,
clear: () => this.setState({ genre: null, decade: null, minR: 0 })
};
}
}
</script>
</body>
</html>
