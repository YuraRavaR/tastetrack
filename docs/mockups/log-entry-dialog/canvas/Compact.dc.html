<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watched dialog B, stars first, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&amp;display=swap">
<style>
body{margin:0}
.tt{--bg:oklch(0.97 0.012 80);--fg:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--primary:oklch(0.82 0.16 88);--pfg:oklch(0.22 0.02 60);--pstrong:oklch(0.52 0.11 80);--psoft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--mfg:oklch(0.47 0.02 60);--destructive:oklch(0.46 0.18 25);--border:oklch(0.88 0.015 75);--input:oklch(0.85 0.015 75);--ring:oklch(0.55 0.012 55);--scrim:oklch(0.2 0.01 50 / 42%);--shadow:oklch(0.2 0.01 50 / 16%);--heading:'Fraunces',Georgia,serif;--sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.tt.dark{--bg:oklch(0.18 0.01 60);--fg:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--primary:oklch(0.84 0.16 90);--pfg:oklch(0.17 0.006 50);--pstrong:oklch(0.84 0.16 90);--psoft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--mfg:oklch(0.74 0.02 70);--destructive:oklch(0.66 0.2 22);--border:oklch(1 0 0 / 11%);--input:oklch(1 0 0 / 15%);--ring:oklch(0.66 0.012 60);--scrim:oklch(0 0 0 / 58%);--shadow:oklch(0 0 0 / 45%)}
.tt button{font:inherit;cursor:pointer;color:inherit}
.tt input,.tt textarea{font:inherit}
.tt :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
</style>
</helmet>
<div class="{{theme}}" style="position: relative; width: 402px; height: 874px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased">

<div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column">
<div style="padding: 62px 16px 10px; display: flex; align-items: center; justify-content: space-between; background: var(--card); border-bottom: 1px solid var(--border)">
<span style="font-family: var(--heading); font-size: 21px; font-weight: 700; letter-spacing: -0.01em">TasteTrack</span>
<span style="width: 34px; height: 34px; border-radius: 999px; background: var(--muted)"></span>
</div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="height: 46px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); font-size: 15px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color: var(--mfg)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>perfect days</div>
<div style="padding: 12px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: 14px; background: var(--card)">
<span style="width: 40px; height: 60px; flex-shrink: 0; border-radius: 4px; background: var(--muted)"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-family: var(--heading); font-size: 16px; font-weight: 600">Perfect Days</span><span style="font-size: 13px; color: var(--mfg)">2023 · 124 min</span><span style="align-self: flex-start; padding: 2px 8px; border-radius: 999px; background: var(--psoft); color: var(--pstrong); font-size: 12px; font-weight: 600">On your Watchlist</span></span>
<span style="height: 36px; padding: 0 14px; display: flex; align-items: center; border-radius: 10px; background: var(--primary); color: var(--pfg); font-size: 14px; font-weight: 600">Watched</span>
</div>
<span style="margin-top: 8px; font-family: var(--heading); font-size: 18px; font-weight: 600">Latest in your Log</span>
<div style="padding: 0 12px; border: 1px solid var(--border); border-radius: 14px; background: var(--card)">
<div style="padding: 10px 0; display: flex; gap: 12px; align-items: center"><span style="width: 40px; height: 60px; border-radius: 4px; background: var(--muted)"></span><span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: var(--heading); font-weight: 600">Amélie</span><span style="font-size: 12px; color: var(--mfg)">Watched Oct 11</span></span></div>
<div style="padding: 10px 0; display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--border)"><span style="width: 40px; height: 60px; border-radius: 4px; background: var(--muted)"></span><span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: var(--heading); font-weight: 600">Aftersun</span><span style="font-size: 12px; color: var(--mfg)">Watched Oct 3</span></span></div>
<div style="padding: 10px 0; display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--border)"><span style="width: 40px; height: 60px; border-radius: 4px; background: var(--muted)"></span><span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: var(--heading); font-weight: 600">Past Lives</span><span style="font-size: 12px; color: var(--mfg)">Watched Sep 27</span></span></div>
</div>
</div>
</div>

<sc-if value="{{open}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; inset: 0; background: var(--scrim)"></div>
<section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 812px; display: flex; flex-direction: column; background: var(--card); border-radius: 28px 28px 0 0; box-shadow: 0 -8px 32px var(--shadow)">
<div style="padding-top: 8px; display: flex; justify-content: center"><span style="width: 36px; height: 5px; border-radius: 999px; background: var(--input)"></span></div>

<header style="padding: 6px 10px 0 20px; display: flex; align-items: center; gap: 8px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<h2 id="sheet-title" style="margin: 0; font-family: var(--heading); font-size: 21px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Perfect Days</h2>
<p style="margin: 0; font-size: 13px; color: var(--mfg)">2023 · 124 min</p>
</div>
<button type="button" aria-label="Close" onClick="{{close}}" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 999px; background: transparent; color: var(--mfg); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</header>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 18px">

<fieldset style="margin: 0; padding: 12px 0 4px; border: 0; display: flex; flex-direction: column; align-items: center; gap: 8px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rating</legend>
<p style="margin: 0; font-size: 14px; color: var(--mfg)">How was it?</p>
<div style="display: flex; gap: 4px">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
<span style="position: relative; display: block; width: 54px; height: 54px">
<svg width="54" height="54" viewBox="0 0 24 24" aria-hidden="true" style="display: block; fill: none; stroke: var(--mfg); stroke-width: 1.2; stroke-linejoin: round"><polygon points="12 2.5 14.9 8.4 21.4 9.3 16.7 13.9 17.8 20.4 12 17.3 6.2 20.4 7.3 13.9 2.6 9.3 9.1 8.4"></polygon></svg>
<sc-if value="{{s.full}}" hint-placeholder-val="{{true}}"><svg width="54" height="54" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; top: 0; left: 0; fill: var(--primary); stroke: var(--pstrong); stroke-width: 1.2; stroke-linejoin: round"><polygon points="12 2.5 14.9 8.4 21.4 9.3 16.7 13.9 17.8 20.4 12 17.3 6.2 20.4 7.3 13.9 2.6 9.3 9.1 8.4"></polygon></svg></sc-if>
<sc-if value="{{s.half}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 0; left: 0; width: 27px; height: 54px; overflow: hidden"><svg width="54" height="54" viewBox="0 0 24 24" aria-hidden="true" style="fill: var(--primary); stroke: var(--pstrong); stroke-width: 1.2; stroke-linejoin: round"><polygon points="12 2.5 14.9 8.4 21.4 9.3 16.7 13.9 17.8 20.4 12 17.3 6.2 20.4 7.3 13.9 2.6 9.3 9.1 8.4"></polygon></svg></span></sc-if>
<input type="radio" name="rating" aria-label="{{s.leftLabel}}" checked="{{s.leftOn}}" onChange="{{s.pickLeft}}" style="position: absolute; top: 0; left: 0; width: 50%; height: 100%; margin: 0; appearance: none; cursor: pointer; border-radius: 4px">
<input type="radio" name="rating" aria-label="{{s.rightLabel}}" checked="{{s.rightOn}}" onChange="{{s.pickRight}}" style="position: absolute; top: 0; right: 0; width: 50%; height: 100%; margin: 0; appearance: none; cursor: pointer; border-radius: 4px">
</span>
</sc-for>
</div>
<p style="margin: 0; height: 24px; font-family: var(--heading); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums">{{ratingText}}</p>
<sc-if value="{{err}}" hint-placeholder-val="{{false}}"><p role="alert" style="margin: 0; font-size: 13px; color: var(--destructive)">Choose a Rating.</p></sc-if>
</fieldset>

<div style="border: 1px solid var(--border); border-radius: 14px; background: var(--card)">

<button type="button" aria-expanded="{{dateOpen}}" onClick="{{toggleDate}}" style="width: 100%; min-height: 54px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border: 0; background: transparent; text-align: left">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--mfg); flex-shrink: 0"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
<span style="flex: 1; font-size: 15px; font-weight: 500">Date</span>
<span style="font-size: 15px; color: var(--mfg)">{{dateText}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--mfg); transform: rotate({{dateTurn}}deg)"><path d="M9 6l6 6-6 6"></path></svg>
</button>
<sc-if value="{{dateOpen}}" hint-placeholder-val="{{false}}">
<div style="padding: 0 14px 14px 46px; display: flex; flex-direction: column; gap: 10px">
<div role="group" aria-label="Date" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{dates}}" as="d" hint-placeholder-count="4">
<button type="button" aria-pressed="{{d.on}}" onClick="{{d.pick}}" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{d.bd}}; background: {{d.bg}}; font-size: 14px; font-weight: {{d.fw}}">{{d.label}}</button>
</sc-for>
</div>
<sc-if value="{{pickOther}}" hint-placeholder-val="{{false}}">
<input type="date" aria-label="Date watched" min="1900-01-01" max="2026-10-29" value="{{otherDate}}" onChange="{{setOtherDate}}" style="align-self: flex-start; height: 44px; padding: 0 12px; border: 1px solid var(--input); border-radius: 10px; background: var(--card); color: var(--fg); font-size: 15px">
</sc-if>
</div>
</sc-if>

<div style="border-top: 1px solid var(--border)">
<button type="button" aria-expanded="{{reviewOpen}}" onClick="{{toggleReview}}" style="width: 100%; min-height: 54px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border: 0; background: transparent; text-align: left">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--mfg); flex-shrink: 0"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg>
<span style="font-size: 15px; font-weight: 500">Review</span>
<span style="flex: 1; min-width: 0; text-align: right; font-size: 15px; color: var(--mfg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{reviewText}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: var(--mfg); transform: rotate({{reviewTurn}}deg)"><path d="M9 6l6 6-6 6"></path></svg>
</button>
<sc-if value="{{reviewOpen}}" hint-placeholder-val="{{false}}">
<div style="padding: 0 14px 14px">
<textarea aria-label="Review" rows="4" maxlength="10000" placeholder="What stayed with you?" value="{{review}}" onChange="{{setReview}}" style="width: 100%; box-sizing: border-box; padding: 10px 12px; resize: none; border: 1px solid var(--input); border-radius: 10px; background: var(--card); color: var(--fg); font-size: 15px; line-height: 1.45"></textarea>
</div>
</sc-if>
</div>

<div style="min-height: 54px; padding: 0 8px 0 14px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--border)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--mfg); flex-shrink: 0"><path d="M17 2l4 4-4 4"></path><path d="M3 11V9a3 3 0 0 1 3-3h15"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v2a3 3 0 0 1-3 3H3"></path></svg>
<span id="rewatch-label" style="flex: 1; font-size: 15px; font-weight: 500">Rewatch</span>
<button type="button" role="switch" aria-checked="{{rewatch}}" aria-labelledby="rewatch-label" onClick="{{toggleRewatch}}" style="width: 60px; height: 44px; padding: 0 4px; flex-shrink: 0; border: 0; background: transparent; display: flex; align-items: center"><span style="width: 52px; height: 32px; padding: 3px; box-sizing: border-box; border-radius: 999px; background: {{switchBg}}; display: flex; justify-content: {{switchSide}}"><span style="width: 26px; height: 26px; border-radius: 999px; background: var(--card); box-shadow: 0 1px 3px var(--shadow)"></span></span></button>
</div>
</div>
</div>

<footer style="padding: 4px 16px 34px">
<button type="button" onClick="{{save}}" style="width: 100%; height: 50px; border: 0; border-radius: 10px; background: var(--primary); color: var(--pfg); font-size: 16px; font-weight: 600">Save to Log</button>
</footer>
</section>
</sc-if>

<sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 40px; padding: 4px 4px 4px 16px; display: flex; align-items: center; gap: 8px; border-radius: 14px; background: var(--fg); color: var(--bg); font-size: 14px; box-shadow: 0 8px 24px var(--shadow)">
<span style="flex: 1">{{toast}}</span>
<button type="button" onClick="{{reopen}}" style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--bg); font-weight: 600">Show again</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"rated":{"editor":"boolean","default":true},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const rated = this.props.rated ?? true;
const rating = 'rating' in st ? st.rating : (rated ? 4.5 : null);
const date = st.date || 'today';
const rewatch = !!st.rewatch;
const review = 'review' in st ? st.review : '';
const dateOpen = !!st.dateOpen;
const reviewOpen = !!st.reviewOpen;
const label = (r) => (r === 1 ? '1 star' : r + ' stars');
const stars = [1, 2, 3, 4, 5].map((n) => ({
full: rating !== null && rating >= n,
half: rating === n - 0.5,
leftOn: rating === n - 0.5,
rightOn: rating === n,
leftLabel: label(n - 0.5),
rightLabel: label(n),
pickLeft: () => this.setState({ rating: n - 0.5, err: false }),
pickRight: () => this.setState({ rating: n, err: false })
}));
const opts = [
{ id: 'today', label: 'Today', text: 'Today' },
{ id: 'yesterday', label: 'Yesterday', text: 'Yesterday' },
{ id: 'other', label: 'Other date', text: '' },
{ id: 'none', label: 'No date', text: 'No date' }
];
const otherDate = st.otherDate || '2026-10-24';
const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const p = otherDate.split('-');
const otherText = p.length === 3 ? months[Number(p[1]) - 1] + ' ' + Number(p[2]) + ', ' + p[0] : 'Pick a date';
return {
theme: this.props.dark ? 'tt dark' : 'tt',
open: !st.saved,
saved: !!st.saved,
stars: stars,
ratingText: rating === null ? '' : rating + ' of 5',
err: !!st.err,
dateOpen: dateOpen,
dateTurn: dateOpen ? 90 : 0,
toggleDate: () => this.setState({ dateOpen: !dateOpen }),
dateText: date === 'other' ? otherText : opts.find((o) => o.id === date).text,
dates: opts.map((o) => ({
label: o.label,
on: o.id === date,
bd: o.id === date ? 'var(--pstrong)' : 'var(--input)',
bg: o.id === date ? 'var(--psoft)' : 'transparent',
fw: o.id === date ? 600 : 400,
pick: () => this.setState({ date: o.id })
})),
pickOther: date === 'other',
otherDate: otherDate,
setOtherDate: (e) => this.setState({ otherDate: e.target.value }),
reviewOpen: reviewOpen,
reviewTurn: reviewOpen ? 90 : 0,
toggleReview: () => this.setState({ reviewOpen: !reviewOpen }),
reviewText: reviewOpen ? '' : (review.trim() ? review : 'Add'),
review: review,
setReview: (e) => this.setState({ review: e.target.value }),
rewatch: rewatch,
switchBg: rewatch ? 'var(--primary)' : 'var(--input)',
switchSide: rewatch ? 'flex-end' : 'flex-start',
toggleRewatch: () => this.setState({ rewatch: !rewatch }),
save: () => (rating === null ? this.setState({ err: true }) : this.setState({ saved: true })),
toast: st.closed ? 'Closed without saving.' : 'Added Perfect Days to your Log.',
close: () => this.setState({ saved: true, closed: true }),
reopen: () => this.setState({ saved: false, closed: false })
};
}
}
</script>
</body>
</html>
