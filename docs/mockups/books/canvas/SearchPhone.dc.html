<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search on Books · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.tt{--background:oklch(0.18 0.01 60);--foreground:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--primary:oklch(0.84 0.16 90);--primary-foreground:oklch(0.17 0.006 50);--primary-strong:oklch(0.84 0.16 90);--primary-soft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--muted-foreground:oklch(0.74 0.02 70);--border:oklch(1 0 0 / 11%);--ink:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--foreground)}
.tt[data-theme=light]{--background:oklch(0.97 0.012 80);--foreground:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--primary:oklch(0.82 0.16 88);--primary-foreground:oklch(0.22 0.02 60);--primary-strong:oklch(0.52 0.11 80);--primary-soft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--muted-foreground:oklch(0.47 0.02 60);--border:oklch(0.88 0.015 75);--ink:oklch(0.22 0.02 60)}
.cap{font-size:15px;font-weight:600;color:#8a8378;height:24px}
.ph{width:390px;background:var(--background);border:1px solid var(--border);border-radius:20px;overflow:hidden;position:relative;box-sizing:border-box}
.hd{height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px}
.wm{font-family:Sora,sans-serif;font-weight:700;font-size:16px;line-height:0.93;letter-spacing:-0.04em}
.av{margin-left:auto;width:36px;height:36px;border-radius:999px;background:var(--muted);display:grid;place-items:center}
.pc{padding:12px 16px 96px;display:flex;flex-direction:column;gap:14px}
.h1{margin:4px 0 0;font-size:28px;font-weight:700;letter-spacing:-0.01em}
.field{height:48px;border:1px solid var(--border);border-radius:14px;background:var(--card);display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;font-size:16px}
.clr{margin-left:auto;width:32px;height:32px;border-radius:999px;background:var(--muted);display:grid;place-items:center;border:0;color:var(--muted-foreground)}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic18{width:18px;height:18px}
.ic22{width:22px;height:22px}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;background:var(--muted);border-radius:14px;padding:4px;border:0;margin:0}
.sg{height:56px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:500;color:var(--foreground);border:0;background:none;font-family:inherit}
.sg.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px oklch(0 0 0 / 18%)}
.sg.on .ic{color:var(--primary-strong)}
.sg.off{color:var(--muted-foreground)}
.sn{font-size:11px;font-weight:600;line-height:1}
.h2{margin:6px 0 0;font-size:18px;font-weight:600;display:flex;gap:6px;align-items:baseline}
.h2 span{color:var(--muted-foreground);font-weight:500;font-size:16px}
.strip{display:flex;gap:12px;margin-right:-16px}
.si{width:104px;flex:none;display:flex;flex-direction:column;gap:4px;text-decoration:none}
.cv{width:104px;height:156px;border-radius:10px;object-fit:cover;display:block;border:1px solid var(--border);box-sizing:border-box}
.st{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ss{font-size:13px;display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gold{color:var(--primary-strong);font-weight:600}
.mut{color:var(--muted-foreground)}
.card{border:1px solid var(--border);background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;padding:12px;align-items:flex-start;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
.th{width:72px;height:108px;border-radius:8px;object-fit:cover;flex:none;display:block;border:1px solid var(--border);box-sizing:border-box}
.tp{width:72px;height:108px;border-radius:8px;flex:none;background:var(--primary-soft);border:1px solid var(--border);box-sizing:border-box;display:flex;flex-direction:column;padding:12px 9px 9px;position:relative;overflow:hidden}
.tp::before{content:"";position:absolute;inset:5px;border:1px solid var(--primary-strong);opacity:0.45;border-radius:4px}
.tpt{font-size:11px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.tpa{font-size:9px;color:var(--muted-foreground);margin-top:auto}
.rt{font-size:16px;font-weight:600;line-height:1.3}
.ra{font-size:14px;color:var(--muted-foreground);line-height:1.35}
.btn{height:44px;padding:0 14px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:15px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--foreground)}
.ib{width:44px;padding:0;justify-content:center}
.manual{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--muted-foreground)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px 10px;box-sizing:border-box;gap:6px}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--muted-foreground);border-radius:16px;text-decoration:none}
.tb.on{background:var(--primary-soft);color:var(--primary-strong);font-weight:600}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:28px 12px;color:var(--muted-foreground);font-size:15px}
</style>
</helmet>
<div class="tt" data-theme="{{theme}}" style="width: 1290px; display: flex; gap: 60px; align-items: flex-start">
<sc-for list="{{frames}}" as="f" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="cap">{{f.label}}</div>
<div class="ph">
<header class="hd"><svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" style="color: var(--ink)"><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(-14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" style="fill: var(--primary); stroke: currentColor; stroke-width: 1.75"></rect><path d="M16 11.5L16.94 14.21L19.8 14.26L17.52 15.99L18.35 18.74L16 17.1L13.65 18.74L14.48 15.99L12.2 14.26L15.06 14.21Z" style="fill: var(--primary-foreground)"></path></svg><span class="wm">Taste<br>Track</span><span class="av"><svg class="ic ic18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></span></header>
<div class="pc">
<h1 class="h1">Search</h1>
<div class="field"><svg class="ic ic18" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted-foreground)"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>{{f.query}}<button class="clr" aria-label="Clear search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
<fieldset aria-label="Media type" class="seg">
<button class="sg" aria-pressed="false"><svg class="ic ic18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"></path><path d="m6.2 5.3 3.1 3.9"></path><path d="m12.4 3.4 3.1 4"></path><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path></svg>Films</button>
<button class="sg on" aria-pressed="true"><svg class="ic ic18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg>Books</button>
<button class="sg off" disabled><svg class="ic ic18" viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2-5 5-5-5"></path><rect width="20" height="15" x="2" y="7" rx="2"></rect></svg>Series<span class="sn">Soon</span></button>
<button class="sg off" disabled><svg class="ic ic18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>Music<span class="sn">Soon</span></button>
<button class="sg off" disabled><svg class="ic ic18" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" x2="10" y1="11" y2="11"></line><line x1="8" x2="8" y1="9" y2="13"></line><line x1="15" x2="15.01" y1="12" y2="12"></line><line x1="18" x2="18.01" y1="10" y2="10"></line><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258A4 4 0 0 0 17.32 5z"></path></svg>Games<span class="sn">Soon</span></button>
</fieldset>

<sc-if value="{{f.hasSaved}}" hint-placeholder-val="{{true}}">
<h2 class="h2">In your Saved <span>{{f.savedCount}}</span></h2>
<div class="strip">
<sc-for list="{{f.saved}}" as="s" hint-placeholder-count="2">
<a href="#" class="si"><img class="cv" src="{{s.src}}" alt="{{s.title}} cover"><span class="st">{{s.title}}</span>
<sc-if value="{{s.rated}}" hint-placeholder-val="{{true}}"><span class="ss gold"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" style="fill: currentColor; flex: none"><path d="M11.5 2.3a.53.53 0 0 1 .95 0l2.3 4.7a2.1 2.1 0 0 0 1.6 1.16l5.17.75a.53.53 0 0 1 .3.9l-3.74 3.64a2.1 2.1 0 0 0-.61 1.88l.88 5.14a.53.53 0 0 1-.77.56l-4.62-2.43a2.1 2.1 0 0 0-1.97 0L6.4 21a.53.53 0 0 1-.77-.56l.88-5.14a2.1 2.1 0 0 0-.61-1.88L2.16 9.8a.53.53 0 0 1 .3-.9l5.16-.76A2.1 2.1 0 0 0 9.2 7z"></path></svg>{{s.status}}</span></sc-if>
<sc-if value="{{s.planned}}" hint-placeholder-val="{{false}}"><span class="ss mut"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" style="fill: currentColor; flex: none"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>{{s.status}}</span></sc-if>
<sc-if value="{{s.reading}}" hint-placeholder-val="{{false}}"><span class="ss mut"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 13px; height: 13px"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg>{{s.status}}</span></sc-if>
</a>
</sc-for>
</div>
</sc-if>

<sc-if value="{{f.hasRows}}" hint-placeholder-val="{{true}}">
<h2 class="h2">From Open Library <span>{{f.rowCount}}</span></h2>
<div class="card">
<sc-for list="{{f.rows}}" as="r" hint-placeholder-count="5">
<div class="row">
<sc-if value="{{r.src}}" hint-placeholder-val="{{true}}"><img class="th" src="{{r.src}}" alt=""></sc-if>
<sc-if value="{{r.noCover}}" hint-placeholder-val="{{false}}"><div class="tp" role="img" aria-label="No cover"><span class="tpt">{{r.title}}</span><span class="tpa">{{r.short}}</span></div></sc-if>
<div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
<div><div class="rt">{{r.title}}</div><div class="ra">{{r.byline}}</div></div>
<div style="display: flex; gap: 8px"><button class="btn">Mark read</button><button class="btn ib" aria-label="Want to read" aria-pressed="false"><svg class="ic ic18" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg></button><button class="btn ib" aria-label="Add to collection"><svg class="ic ic18" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 12H3"></path><path d="M16 6H3"></path><path d="M16 18H3"></path><path d="M18 9v6"></path><path d="M21 12h-6"></path></svg></button></div>
</div>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{f.noMatch}}" hint-placeholder-val="{{false}}">
<div class="empty"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 28px; height: 28px"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg>No books found for “{{f.query}}”.</div>
</sc-if>

<div class="manual">Can't find it?<button class="btn">Add manually</button></div>
</div>
<nav class="tabbar" aria-label="Sections">
<a href="#" class="tb"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>Saved</a>
<a href="#" class="tb"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg>Collections</a>
<a href="#" class="tb on" aria-current="page"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>Search</a>
</nav>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1290,"height":1640}}'>
class Component extends DCLogic {
renderVals() {
const nightRows = [
{ src: '/_blob/a6e2d6c2cce501729a54e92f1e34a22b', title: 'La Nuit', byline: 'Elie Wiesel · 1955' },
{ src: '/_blob/e15af465cd7274f1a4fd8a0c50256b1d', title: 'A Midsummer Night’s Dream', byline: 'William Shakespeare · 1600' },
{ src: '/_blob/302b60f59c1410df04aa2f9fa55f6788', title: 'Twelfth Night, or What You Will', byline: 'William Shakespeare · 1734' },
{ src: '/_blob/4bbbf2d38da3f7c74204e252f9560851', title: 'Tender Is the Night', byline: 'F. Scott Fitzgerald · 1933' },
{ src: '/_blob/45091fce10e19ed9a3852649afaef054', title: 'Night Shift', byline: 'Stephen King · 1960' },
{ src: '/_blob/6cdc04dced7aa06e5371555d53299cf7', title: 'White Nights', byline: 'Fiódor Dostoievski · 2016' }
];
const zhadanRows = [
{ src: '/_blob/0a7b10610295aed6e7a312575edd9be6', title: 'Internat', byline: 'Сергі́й Ві́кторович Жада́н · 2017' },
{ src: '', noCover: true, title: 'Depeche Mode', short: 'Жада́н', byline: 'Сергі́й Ві́кторович Жада́н · 2013' },
{ src: '', noCover: true, title: 'Himn demokratychnoï molodi', short: 'Жада́н', byline: 'Сергі́й Ві́кторович Жада́н · 2006' },
{ src: '', noCover: true, title: 'Pepsi', short: 'Жада́н', byline: 'Сергі́й Ві́кторович Жада́н · 1998' },
{ src: '', noCover: true, title: 'Kapital', short: 'Жада́н', byline: 'Сергі́й Ві́кторович Жада́н · 2006' }
];
return {
theme: this.props.theme ?? 'dark',
frames: [
{ label: 'Results for “night”: your Saved first, then Open Library', query: 'night', hasSaved: true, savedCount: '2', saved: [
{ src: '/_blob/99ab4c37456e8a781b9238c3c517e76e', title: 'The Curious Incident of the Dog in the Night-Time', planned: true, rated: false, reading: false, status: 'Reading list' },
{ src: '/_blob/03a90f014cfb48ca352c899ed3ae04b6', title: 'The Night Circus', rated: true, planned: false, reading: false, status: '4 · Read' }
], hasRows: true, rowCount: '6', rows: nightRows, noMatch: false },
{ label: 'A Cyrillic query: Open Library’s data as it comes, covers missing', query: 'жадан', hasSaved: true, savedCount: '2', saved: [
{ src: '/_blob/3e315e6fa8a630abbd41ef620834a0a2', title: 'Voroshilovgrad', rated: true, planned: false, reading: false, status: '4.5 · Read' },
{ src: '/_blob/c4a239feac4ab940bbd2dc5b76bc7221', title: 'Depeche Mode', reading: true, rated: false, planned: false, status: 'Reading' }
], hasRows: true, rowCount: '4', rows: zhadanRows.slice(0, 1).concat(zhadanRows.slice(2)), noMatch: false },
{ label: 'Nothing found: add the book by hand', query: 'Доця', hasSaved: false, savedCount: '', saved: [], hasRows: false, rowCount: '', rows: [], noMatch: true }
]
};
}
}
</script>
</body>
</html>
