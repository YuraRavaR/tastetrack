<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book covers · fitting odd shapes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.tt{--background:oklch(0.18 0.01 60);--foreground:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--primary:oklch(0.84 0.16 90);--primary-foreground:oklch(0.17 0.006 50);--primary-strong:oklch(0.84 0.16 90);--primary-soft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--muted-foreground:oklch(0.74 0.02 70);--border:oklch(1 0 0 / 11%);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--foreground)}
.tt[data-theme=light]{--background:oklch(0.97 0.012 80);--foreground:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--primary:oklch(0.82 0.16 88);--primary-foreground:oklch(0.22 0.02 60);--primary-strong:oklch(0.52 0.11 80);--primary-soft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--muted-foreground:oklch(0.47 0.02 60);--border:oklch(0.88 0.015 75)}
.cap{font-size:15px;font-weight:700;height:22px}
.sub{font-size:13px;color:var(--muted-foreground);line-height:1.4;min-height:56px}
.ph{width:390px;background:var(--background);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-sizing:border-box;padding:16px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:12px;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:0.06em}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px;align-items:end}
.it{display:flex;flex-direction:column;gap:6px;min-width:0}
.t{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:32px}
.r{font-size:12px;color:var(--primary-strong);font-weight:600;display:flex;gap:3px;align-items:center;margin-top:-2px}
.slot{position:relative;width:100%;aspect-ratio:2/3;border-radius:10px;overflow:hidden;box-sizing:border-box}
.slot .bg{display:none}
.slot .fg{display:block}
.a .fg{width:100%;height:100%;object-fit:cover;border:1px solid var(--border);border-radius:10px;box-sizing:border-box}
.b{border:1px solid var(--border)}
.b .bg{display:block;position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;filter:blur(12px) saturate(1.2);opacity:0.9}
.b .fg{position:relative;width:100%;height:100%;object-fit:contain}
.c{background:var(--muted);display:flex;align-items:flex-end;justify-content:center;border-radius:10px}
.c .fg{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 2px 8px oklch(0 0 0 / 25%)}
.d{aspect-ratio:auto;overflow:visible}
.d .fg{width:100%;height:auto;max-height:166px;object-fit:cover;border:1px solid var(--border);border-radius:10px;box-sizing:border-box}
.srow{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:12px}
.srow .slot{width:72px;flex:none;border-radius:8px}
.srow .d{height:108px;display:flex;align-items:flex-end}
.btn{height:44px;padding:0 14px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:15px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--foreground)}
.ib{width:44px;padding:0;justify-content:center}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ban{position:relative;margin:0 -16px;height:330px}
.pic{position:absolute;left:0;right:0;top:0;aspect-ratio:16/9;overflow:hidden}
.pic img{position:absolute;inset:-15%;width:130%;height:130%;object-fit:cover;filter:blur(24px) saturate(1.3)}
.pic::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,var(--background))}
.prow{position:absolute;left:16px;right:16px;top:147px;display:flex;align-items:flex-end;gap:14px}
.prow .slot{width:104px;flex:none;box-shadow:0 10px 24px oklch(0 0 0 / 40%)}
.prow .d{height:156px;display:flex;align-items:flex-end;box-shadow:none}
.prow .d .fg{max-height:156px;box-shadow:0 10px 24px oklch(0 0 0 / 40%)}
</style>
</helmet>
<div style="width: 1800px; display: flex; flex-direction: column; gap: 48px">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="tt" data-theme="{{th.theme}}" style="display: flex; gap: 60px; padding: 20px; background: var(--background); border-radius: 24px">
<sc-for list="{{variants}}" as="v" hint-placeholder-count="4">
<div style="width: 390px; display: flex; flex-direction: column; gap: 8px">
<div class="cap">{{v.name}} · {{th.theme}}</div>
<div class="sub">{{v.note}}</div>
<div class="ph">
<div class="lbl">Saved · Books · Read</div>
<div class="grid">
<sc-for list="{{books}}" as="b" hint-placeholder-count="6">
<a href="#" class="it" style="text-decoration: none">
<div class="slot {{v.cls}}"><img class="bg" src="{{b.src}}" alt=""><img class="fg" src="{{b.src}}" alt="{{b.alt}}"></div>
<span class="t">{{b.title}}</span>
<span class="r"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" style="fill: currentColor"><path d="M11.5 2.3a.53.53 0 0 1 .95 0l2.3 4.7a2.1 2.1 0 0 0 1.6 1.16l5.17.75a.53.53 0 0 1 .3.9l-3.74 3.64a2.1 2.1 0 0 0-.61 1.88l.88 5.14a.53.53 0 0 1-.77.56l-4.62-2.43a2.1 2.1 0 0 0-1.97 0L6.4 21a.53.53 0 0 1-.77-.56l.88-5.14a2.1 2.1 0 0 0-.61-1.88L2.16 9.8a.53.53 0 0 1 .3-.9l5.16-.76A2.1 2.1 0 0 0 9.2 7z"></path></svg>{{b.rating}}</span>
</a>
</sc-for>
</div>
<div class="lbl" style="margin-top: 6px">Search · a row</div>
<div class="srow">
<div class="slot {{v.cls}}"><img class="bg" src="/_blob/f9497ac2ddc6f3eaf860b97640197c3a" alt=""><img class="fg" src="/_blob/f9497ac2ddc6f3eaf860b97640197c3a" alt="The Very Hungry Caterpillar cover"></div>
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<div><div style="font-size: 16px; font-weight: 600">The Very Hungry Caterpillar</div><div style="font-size: 14px; color: var(--muted-foreground)">Eric Carle · 1969</div></div>
<div style="display: flex; gap: 8px"><button class="btn">Mark read</button><button class="btn ib" aria-label="Want to read"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg></button><button class="btn ib" aria-label="Add to collection"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 12H3"></path><path d="M16 6H3"></path><path d="M16 18H3"></path><path d="M18 9v6"></path><path d="M21 12h-6"></path></svg></button></div>
</div>
</div>
<div class="lbl" style="margin-top: 6px">A book's page · the top</div>
<div class="ban">
<div class="pic"><img src="/_blob/e4057023b7a6da43a8d0eb1384cf2760" alt=""></div>
<div class="prow">
<div class="slot {{v.cls}}"><img class="bg" src="/_blob/e4057023b7a6da43a8d0eb1384cf2760" alt=""><img class="fg" src="/_blob/e4057023b7a6da43a8d0eb1384cf2760" alt="Тигролови cover"></div>
<div style="display: flex; flex-direction: column; gap: 3px; padding-bottom: 2px">
<h1 style="margin: 0; font-size: 21px; font-weight: 700">Тигролови</h1>
<p style="margin: 0; font-size: 13px; color: var(--muted-foreground)">Іван Багряний · 1946</p>
</div>
</div>
</div>
</div>
</div>
</sc-for>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1800,"height":2400}}'>
class Component extends DCLogic {
renderVals() {
return {
themes: [{ theme: 'dark' }, { theme: 'light' }],
variants: [
{ cls: 'a', name: 'A · Crop to 2:3, like films', note: 'Every cover fills a 2:3 box. Square and wide covers lose their sides: the Caterpillar loses its head.' },
{ cls: 'b', name: 'B · Whole cover on a blurred copy', note: 'The whole cover, centred in the 2:3 box; the space around it is the same cover, blurred. The grid stays even.' },
{ cls: 'c', name: 'C · Whole cover on a shelf', note: 'The whole cover stands at the bottom of a muted 2:3 box, like a book on a shelf. Short covers leave a plain gap above.' },
{ cls: 'd', name: 'D · Natural height', note: 'Each cover keeps its own shape, up to 2:3, and the row lines up on the bottom edge. Titles line up; tops do not.' }
],
books: [
{ src: '/_blob/e4057023b7a6da43a8d0eb1384cf2760', alt: 'Тигролови cover', title: 'Тигролови', rating: '5' },
{ src: '/_blob/3e315e6fa8a630abbd41ef620834a0a2', alt: 'Voroshilovgrad cover', title: 'Voroshilovgrad', rating: '4.5' },
{ src: '/_blob/f9497ac2ddc6f3eaf860b97640197c3a', alt: 'The Very Hungry Caterpillar cover', title: 'The Very Hungry Caterpillar', rating: '4' },
{ src: '/_blob/125bb0a6295c483e75255706bc95cd81', alt: 'Piranesi cover', title: 'Piranesi', rating: '4.5' },
{ src: '/_blob/00f654f67e52d3f7d42fe0856e0df42e', alt: 'Солодка Даруся cover', title: 'Солодка Даруся', rating: '5' },
{ src: '/_blob/268513c376f3d0277d0f6ed95c071732', alt: 'Where the Wild Things Are cover', title: 'Where the Wild Things Are', rating: '3.5' }
]
};
}
}
</script>
</body>
</html>
