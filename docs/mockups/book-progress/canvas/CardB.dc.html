<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A book's Reading card · phone · B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.tt{--background:oklch(0.18 0.01 60);--foreground:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--primary:oklch(0.84 0.16 90);--primary-foreground:oklch(0.17 0.006 50);--primary-strong:oklch(0.84 0.16 90);--primary-soft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--muted-foreground:oklch(0.74 0.02 70);--border:oklch(1 0 0 / 11%);--input:oklch(1 0 0 / 15%);--ring:oklch(0.66 0.012 60);--destructive:oklch(0.66 0.2 22);--overlay:oklch(0 0 0 / 60%);--ink:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--foreground)}
.tt[data-theme=light]{--background:oklch(0.97 0.012 80);--foreground:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--primary:oklch(0.82 0.16 88);--primary-foreground:oklch(0.22 0.02 60);--primary-strong:oklch(0.52 0.11 80);--primary-soft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--muted-foreground:oklch(0.47 0.02 60);--border:oklch(0.88 0.015 75);--input:oklch(0.85 0.015 75);--ring:oklch(0.55 0.012 55);--destructive:oklch(0.46 0.18 25);--overlay:oklch(0.2 0.01 50 / 50%);--ink:oklch(0.22 0.02 60)}
.cap{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:600;color:#8a8378;height:24px}
.ph{width:390px;height:844px;background:var(--background);border:1px solid var(--border);border-radius:20px;overflow:hidden;position:relative;box-sizing:border-box}
.hd{height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px;box-sizing:border-box}
.wm{font-family:Sora,sans-serif;font-weight:700;font-size:16px;line-height:0.93;letter-spacing:-0.04em}
.av{margin-left:auto;width:36px;height:36px;border-radius:999px;background:var(--muted);display:grid;place-items:center}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic16{width:16px;height:16px}
.ic20{width:20px;height:20px}
.ic22{width:22px;height:22px}
.pic{position:relative;height:219px;overflow:hidden}
.pic img{position:absolute;left:-15%;top:-15%;width:130%;height:130%;object-fit:cover;filter:blur(24px) saturate(1.3)}
.pic::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,var(--background) 100%)}
.head{position:relative;display:flex;align-items:flex-end;gap:14px;margin-top:-72px;padding:0 16px}
.art{width:104px;height:156px;border-radius:10px;object-fit:cover;border:1px solid var(--border);box-shadow:0 8px 24px oklch(0 0 0 / 35%);flex:none;box-sizing:border-box}
.titles{display:flex;flex-direction:column;gap:3px;min-width:0;padding-bottom:2px}
.h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-0.01em;line-height:1.15}
.uk{margin:0;font-size:14px;font-weight:600;color:var(--muted-foreground)}
.facts{margin:2px 0 0;font-size:13px;color:var(--muted-foreground)}
.body{display:flex;flex-direction:column;gap:18px;padding:18px 16px 0}
.btn{height:48px;padding:0 14px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:15px;font-weight:600;border:1px solid var(--border);background:var(--card);color:inherit;white-space:nowrap;box-sizing:border-box;cursor:pointer}
.btn.pr{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.btn.pl{background:transparent;height:44px}
.btn.dis{opacity:0.5}
.inp{border:1px solid var(--primary-strong);background:var(--primary-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;gap:12px;align-items:center}
.mark{width:40px;height:40px;border-radius:12px;background:var(--card);color:var(--primary-strong);display:grid;place-items:center;flex:none}
.ib{width:44px;height:44px;border:0;border-radius:10px;background:none;color:var(--muted-foreground);display:grid;place-items:center;margin-left:auto;cursor:pointer}
.sm{font-size:14px;color:var(--muted-foreground)}
.lbl{font-size:13px;font-weight:600;color:var(--muted-foreground)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;width:100%;box-sizing:border-box;font:inherit;color:inherit;text-align:left;cursor:pointer}
.nx{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;min-width:0}
.big{font-size:19px;font-weight:700;letter-spacing:-0.01em}
.go{width:44px;height:44px;border-radius:999px;border:1px solid var(--border);background:var(--background);color:var(--muted-foreground);display:grid;place-items:center;flex:none;margin-left:auto;box-sizing:border-box}
.br{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted-foreground);white-space:nowrap}
.bar{flex:1;height:6px;border-radius:999px;background:var(--muted);overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--primary-strong);border-radius:999px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.num{height:48px;border:1px solid var(--input);border-radius:12px;background:var(--background);color:inherit;font:inherit;font-size:18px;font-weight:700;padding:0 12px;width:100%;box-sizing:border-box}
.num::placeholder{color:var(--muted-foreground);font-weight:400;font-size:16px}
.num.foc{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklch,var(--ring) 45%,transparent)}
.num.bad{border-color:var(--destructive);box-shadow:0 0 0 3px color-mix(in oklch,var(--destructive) 25%,transparent)}
.err{display:flex;gap:6px;align-items:flex-start;font-size:14px;color:var(--destructive);margin:0}
.bs{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:8px}
.bs button{height:56px;border-radius:14px;border:1px solid var(--border);background:var(--background);color:inherit;display:grid;place-items:center;cursor:pointer}
.bs .num{height:56px;font-size:26px;text-align:center}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.h2{font-size:18px;font-weight:600;margin:6px 0 -6px}
.empty{border:1px dashed var(--border);border-radius:14px;padding:20px 16px;font-size:14px;color:var(--muted-foreground);text-align:center}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px 10px;box-sizing:border-box;gap:6px}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--muted-foreground);border-radius:16px;text-decoration:none}
.tb.on{background:var(--primary-soft);color:var(--primary-strong);font-weight:600}
.ov{position:absolute;inset:0;background:var(--overlay)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:28px 28px 0 0;display:flex;flex-direction:column}
.shd{display:flex;align-items:center;gap:12px;padding:16px 10px 4px 20px}
.x{width:44px;height:44px;border-radius:999px;border:0;background:none;color:var(--muted-foreground);display:grid;place-items:center;margin-left:auto;align-self:flex-start;cursor:pointer}
.sbody{display:flex;flex-direction:column;gap:18px;padding:14px 20px 20px}
.sft{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px;padding:12px 20px 34px;border-top:1px solid var(--border)}
.sft .btn{height:50px;font-size:16px}
</style>
</helmet>
<div style="width: 2110px; display: flex; gap: 40px; align-items: flex-start">
<sc-for list="{{states}}" as="s" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="cap">{{s.cap}}</div>
<div class="tt ph" data-theme="{{theme}}">
<header class="hd"><svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" style="color: var(--ink)"><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(-14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" style="fill: var(--primary); stroke: currentColor; stroke-width: 1.75"></rect><path d="M16 11.5L16.94 14.21L19.8 14.26L17.52 15.99L18.35 18.74L16 17.1L13.65 18.74L14.48 15.99L12.2 14.26L15.06 14.21Z" style="fill: var(--primary-foreground)"></path></svg><span class="wm">Taste<br>Track</span><span class="av"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></span></header>
<div class="pic"><img src="/_blob/9628d7d4054da40370045c9ffb743b77" alt=""></div>
<div class="head"><img class="art" src="/_blob/9628d7d4054da40370045c9ffb743b77" alt="Piranesi cover"><div class="titles"><h1 class="h1">Piranesi (2020)</h1><p class="uk">Піранезі</p><p class="facts">Susanna Clarke</p></div></div>
<div class="body">
<section class="inp" aria-label="Reading">
<div class="top"><span class="mark"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><div><div style="font-size: 16px; font-weight: 700">Reading</div><div class="sm">Since 12 October 2026</div></div><button class="ib" aria-label="Change the start date"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"></path></svg></button></div>

<sc-if value="{{s.none}}" hint-placeholder-val="{{false}}">
<button class="panel"><span class="nx"><span class="col"><span class="lbl">Page</span><span class="sm">Note the page you're on</span></span><span class="go" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></span></span></button>
</sc-if>

<sc-if value="{{s.only}}" hint-placeholder-val="{{false}}">
<button class="panel" aria-label="Page 142. Change your page"><span class="nx"><span class="col"><span class="lbl">Page</span><span class="big">142</span></span><span class="go" aria-hidden="true"><svg class="ic ic16" viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"></path></svg></span></span></button>

<sc-if value="{{s.both}}" hint-placeholder-val="{{true}}">
<button class="panel" aria-label="Page 142 of 272. Change your page"><span class="nx"><span class="col"><span class="lbl">Page</span><span class="big">142</span><span class="sm">130 pages to go</span></span><span class="go" aria-hidden="true"><svg class="ic ic16" viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"></path></svg></span></span>

</section>
<div class="acts"><button class="btn pl"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 12H3"></path><path d="M16 6H3"></path><path d="M16 18H3"></path><path d="M18 9v6"></path><path d="M21 12h-6"></path></svg>Add to collection</button></div>

</div>

<sc-if value="{{s.sheet}}" hint-placeholder-val="{{false}}">
<div class="ov"></div>
<form class="sheet" role="dialog" aria-label="Your page">

<div class="sbody">
<div class="fld"><span class="lbl">Page</span><div class="bs"><button type="button" aria-label="Previous page"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button><input class="{{s.pageClass}}" inputmode="numeric" aria-label="Page" value="{{s.page}}"><button type="button" aria-label="Next page"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button></div>
<sc-if value="{{s.bad}}" hint-placeholder-val="{{false}}"><p class="err" role="alert"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>Page 312 is past the last page, 272.</p></sc-if>
</div>
<label class="fld"><span class="lbl">Pages in your edition <span style="font-weight: 400">· optional</span></span><input class="num" inputmode="numeric" value="272"></label>

</form>
</sc-if>
</div>
</div>
</sc-for>
</div>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":2110,"height":880}}'>
