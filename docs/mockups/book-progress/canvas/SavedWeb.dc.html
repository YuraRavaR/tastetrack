<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reading now on Saved · web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.tt{--background:oklch(0.18 0.01 60);--foreground:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--primary:oklch(0.84 0.16 90);--primary-foreground:oklch(0.17 0.006 50);--primary-strong:oklch(0.84 0.16 90);--primary-soft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--muted-foreground:oklch(0.74 0.02 70);--border:oklch(1 0 0 / 11%);--ink:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--foreground)}
.tt[data-theme=light]{--background:oklch(0.97 0.012 80);--foreground:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--primary:oklch(0.82 0.16 88);--primary-foreground:oklch(0.22 0.02 60);--primary-strong:oklch(0.52 0.11 80);--primary-soft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--muted-foreground:oklch(0.47 0.02 60);--border:oklch(0.88 0.015 75);--ink:oklch(0.22 0.02 60)}
.cap{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:600;color:#8a8378;height:24px}
.web{width:1440px;height:580px;background:var(--background);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-sizing:border-box}
.hd{background:var(--card);border-bottom:1px solid var(--border)}
.hb{max-width:1152px;margin:0 auto;height:64px;display:flex;align-items:center;gap:28px;padding:0 24px;box-sizing:border-box}
.logo{display:flex;align-items:center;gap:7px}
.wm{font-family:Sora,sans-serif;font-weight:700;font-size:17px;line-height:0.95;letter-spacing:-0.035em}
.nav{display:flex;gap:4px}
.nav a{height:36px;display:flex;align-items:center;padding:0 14px;border-radius:14px;color:var(--muted-foreground);font-weight:500;font-size:15px;text-decoration:none}
.nav a[aria-current]{background:var(--primary-soft);color:var(--foreground)}
.av{margin-left:auto;width:40px;height:40px;border-radius:999px;background:var(--muted);display:grid;place-items:center}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic22{width:22px;height:22px}
.pc{max-width:1152px;margin:0 auto;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-0.015em}
.h2{font-size:20px;font-weight:600;margin-top:8px}
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.now{display:flex;align-items:stretch;border:1px solid var(--border);background:var(--card);border-radius:16px;position:relative;overflow:hidden}
.nl{display:flex;gap:14px;align-items:center;padding:10px 6px 10px 10px;flex:1;min-width:0;text-decoration:none}
.po{width:48px;height:72px;border-radius:6px;object-fit:cover;border:1px solid var(--border);flex:none;box-sizing:border-box}
.tx{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ti{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{font-size:14px;line-height:1.3;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me b{color:var(--foreground);font-weight:600}
.br{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted-foreground);white-space:nowrap;max-width:340px}
.bar{flex:1;height:5px;border-radius:999px;background:var(--muted);overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--primary-strong);border-radius:999px}
.pg{font-size:13px;color:var(--muted-foreground)}
.act{flex:none;display:flex;align-items:center;justify-content:center;background:none;border:0;color:inherit;font:inherit;min-width:68px;padding:0 10px;cursor:pointer;border-left:1px solid var(--border)}
.ck{width:40px;height:40px;border-radius:999px;border:1.5px solid var(--primary-strong);color:var(--primary-strong);display:grid;place-items:center;box-sizing:border-box}
.chev{flex:none;display:grid;place-items:center;width:44px;color:var(--muted-foreground)}
</style>
</helmet>
<div style="width: 1440px; display: flex; flex-direction: column; gap: 50px">
<sc-for list="{{variants}}" as="v" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="cap">{{v.cap}}</div>
<div class="tt web" data-theme="{{theme}}">
<header class="hd"><div class="hb"><a href="#" class="logo" aria-label="TasteTrack" style="text-decoration: none"><svg viewBox="0 0 32 32" width="36" height="36" aria-hidden="true" style="color: var(--ink)"><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(-14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" style="fill: var(--primary); stroke: currentColor; stroke-width: 1.75"></rect><path d="M16 11.5L16.94 14.21L19.8 14.26L17.52 15.99L18.35 18.74L16 17.1L13.65 18.74L14.48 15.99L12.2 14.26L15.06 14.21Z" style="fill: var(--primary-foreground)"></path></svg><span class="wm">Taste<br>Track</span></a><nav class="nav" aria-label="Sections"><a href="#" aria-current="page">Saved</a><a href="#">Collections</a><a href="#">Search</a></nav><span class="av"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></span></div></header>
<div class="pc">
<h1 class="h1">Saved</h1>
<div class="h2">Reading now</div>
<div class="rows">
<sc-for list="{{v.books}}" as="b" hint-placeholder-count="3">
<div class="now"><a href="#" class="nl"><img class="po" src="{{b.src}}" alt=""><span class="tx"><span class="ti">{{b.title}}</span>
<sc-if value="{{b.metaPage}}" hint-placeholder-val="{{false}}"><span class="me">{{b.author}} · <b>{{b.page}}</b></span></sc-if>
<sc-if value="{{b.metaPlain}}" hint-placeholder-val="{{true}}"><span class="me">{{b.meta}}</span></sc-if>
<sc-if value="{{b.pageLine}}" hint-placeholder-val="{{false}}"><span class="pg">{{b.page}}</span></sc-if>
<sc-if value="{{b.bar}}" hint-placeholder-val="{{false}}"><span class="br"><span class="bar" role="img" aria-label="{{b.barLabel}}"><i style="width: {{b.pct}}"></i></span><span aria-hidden="true">{{b.count}}</span></span></sc-if>
</span></a><span class="chev"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></div>
</sc-for>
</div>
<div class="h2">Watching now</div>
<div class="rows">
<div class="now"><a href="#" class="nl"><img class="po" src="/_blob/220b17e9a6468b4a3ba7cb3dae42c652" alt=""><span class="tx"><span class="ti">Breaking Bad</span><span class="me">Next: <b>S2 · E9</b></span><span class="br"><span class="bar" role="img" aria-label="15 of 62 episodes watched"><i style="width: 24%"></i></span><span aria-hidden="true">15 of 62</span></span></span></a><button class="act" aria-label="Mark S2 · E9 of Breaking Bad watched"><span class="ck"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></button></div>
<div class="now"><a href="#" class="nl"><img class="po" src="/_blob/70bc753463ed95a7a1daf6a163ac8e0d" alt=""><span class="tx"><span class="ti">Severance</span><span class="me">Next: <b>S1 · E1</b></span><span class="br"><span class="bar" role="img" aria-label="0 of 19 episodes watched"><i style="width: 0%"></i></span><span aria-hidden="true">0 of 19</span></span></span></a><button class="act" aria-label="Mark S1 · E1 of Severance watched"><span class="ck"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></button></div>
</div>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
renderVals() {
const vor = { title: 'Ворошиловград', src: '/_blob/45b5c169dfafd60f0d9f7c6d5295271b', author: 'Сергій Жадан', metaPlain: true, meta: 'Сергій Жадан · since 14 November' };
const kafka = { title: 'Kafka on the Shore', src: '/_blob/1bd38b25a2b4a0ab44415d81fb50746e', author: 'Haruki Murakami', page: 'p. 88' };

return {
theme: this.props.theme ?? 'dark',
variants: [
{ cap: 'A · Author and since when stay; the page is a third line', books: [
vor,
{ ...kafka, metaPlain: true, meta: 'Haruki Murakami · since 2 November', pageLine: true },
{ ...pir, metaPlain: true, meta: 'Susanna Clarke · since 12 October' }
] },
{ cap: 'B · The page takes the start date’s place', books: [
vor,
{ ...kafka, metaPage: true },
{ ...pir, metaPlain: true, meta: 'Susanna Clarke' }
] }
]
};
}
}
</script>
</body>
</html>
