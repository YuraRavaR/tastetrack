<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search results, variant C</title>
<!--
  Static mockup of home with a film search, variant C "icon actions", issue #62.
  Colours are the Gold · Paper tokens from docs/mockups/accent/README.md; type follows Gold · Cinema:
  Fraunces italic for the app name only, the system sans for everything else.
  Below 768px: a bottom tab bar, and each result's actions sit under its title.
  From 768px: sections in the header, and the actions sit at the end of the row.
  Dark mode follows the system setting. Watched, the bookmark and the clear button work;
  "Paris, 13th District" links to film-page-unwatched-a.html.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500..700&display=swap">
<style>
:root {
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-brand: "Fraunces", Georgia, serif;
  --radius: 14px;
  --radius-md: 10px;
  --background: oklch(0.97 0.012 80);
  --foreground: oklch(0.2 0.01 50);
  --card: oklch(0.995 0.006 85);
  --primary: oklch(0.82 0.16 88);
  --primary-foreground: oklch(0.22 0.02 60);
  --primary-strong: oklch(0.52 0.11 80);
  --primary-soft: oklch(0.96 0.037 87);
  --muted: oklch(0.935 0.016 75);
  --muted-foreground: oklch(0.47 0.02 60);
  --border: oklch(0.88 0.015 75);
  --input: oklch(0.85 0.015 75);
  --ring: oklch(0.55 0.012 55);
  --shadow: oklch(0.2 0.01 50 / 16%);
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: oklch(0.18 0.01 60);
    --foreground: oklch(0.96 0.004 75);
    --card: oklch(0.22 0.012 60);
    --primary: oklch(0.84 0.16 90);
    --primary-foreground: oklch(0.17 0.006 50);
    --primary-strong: oklch(0.84 0.16 90);
    --primary-soft: oklch(0.31 0.034 85);
    --muted: oklch(0.28 0.014 60);
    --muted-foreground: oklch(0.74 0.02 70);
    --border: oklch(1 0 0 / 11%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.66 0.012 60);
    --shadow: oklch(0 0 0 / 45%);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100svh; display: flex; flex-direction: column;
  background: var(--background); color: var(--foreground); font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
p, h1, ul { margin: 0; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.muted { color: var(--muted-foreground); }
.col { width: 100%; max-width: 48rem; margin: 0 auto; padding: 0 16px; }

/* Header: app name and account; the sections join it from md */
.top { background: var(--card); border-bottom: 1px solid var(--border); }
.top .col { min-height: 56px; display: flex; align-items: center; gap: 24px; }
.brand { font-family: var(--font-brand); font-style: italic; font-weight: 600; font-size: 21px; letter-spacing: -0.01em; }
.sections { display: none; flex: 1; gap: 4px; font-size: 14px; font-weight: 500; }
.sections a { padding: 8px 12px; border-radius: 8px; color: var(--muted-foreground); }
.sections a[aria-current] { background: var(--muted); color: var(--foreground); }
.account { width: 44px; height: 44px; margin-left: auto; margin-right: -4px; padding: 0; border: 0; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500; }
.account .avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--muted); display: flex; align-items: center; justify-content: center; }
.account .name { display: none; }

main { flex: 1; }
main .col { padding-block: 16px 24px; display: flex; flex-direction: column; gap: 12px; }

/* Search field, focused, with the theme-coloured clear button */
.search { height: 48px; padding: 0 4px 0 14px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--ring); border-radius: var(--radius-md); background: var(--card); box-shadow: 0 0 0 3px var(--muted); }
.search > svg { color: var(--muted-foreground); }
.search input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; background: transparent; font-size: 16px; outline: none; }
.search input::-webkit-search-cancel-button { display: none; }
.clear { width: 40px; height: 40px; flex-shrink: 0; padding: 0; border: 0; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center; }
.clear span { width: 24px; height: 24px; border-radius: 999px; background: var(--muted); color: var(--muted-foreground); display: flex; align-items: center; justify-content: center; }

/* Results */
.results { padding: 0; list-style: none; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
.result {
  padding: 12px; display: grid; gap: 3px 12px;
  grid-template-columns: 72px minmax(0, 1fr);
  grid-template-areas: "poster info" "poster actions";
  align-items: start;
}
.result + .result { border-top: 1px solid var(--border); }
.poster { grid-area: poster; width: 72px; height: 108px; border-radius: 6px; background: var(--muted); color: var(--muted-foreground); display: flex; align-items: center; justify-content: center; }
.info { grid-area: info; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.title { font-size: 16px; font-weight: 600; line-height: 1.3; }
a.title:hover { text-decoration: underline; text-underline-offset: 4px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 13px; color: var(--muted-foreground); }
.mark { font-size: 12px; font-weight: 600; color: var(--primary-strong); }
.mark[hidden], .meta[hidden], .lists[hidden] { display: none; }
.mark.rating { display: flex; align-items: center; gap: 4px; }
.mark.rating[hidden] { display: none; }
.mark.manual { font-weight: 500; color: var(--muted-foreground); }
.lists { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
.lists a { padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; }
.actions { grid-area: actions; margin-top: 6px; display: flex; gap: 6px; }
.btn { height: 44px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; }
.btn-watch { padding: 0 8px; font-size: 14px; white-space: nowrap; border: 1px solid var(--border); background: var(--card); font-weight: 600; }
.btn-watch.done { border-color: var(--primary-strong); background: var(--primary-soft); color: var(--primary-strong); }
.btn-watch svg { display: none; }
.btn-watch.done svg { display: block; }
@media (max-width: 379.98px) { .btn-watch.done svg { display: none; } }
.btn-icon { width: 44px; flex-shrink: 0; padding: 0; border: 1px solid var(--border); background: var(--card); }
.btn-icon[aria-pressed="true"] { border-color: var(--primary-strong); background: var(--primary-soft); color: var(--primary-strong); }
.btn-icon[aria-pressed="true"] svg { fill: currentColor; }
.manual-add { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
.btn-sm { height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); font-size: 14px; font-weight: 500; }

/* Toast */
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 5; padding: 4px 4px 4px 16px; display: flex; align-items: center; gap: 8px; border-radius: var(--radius); background: var(--foreground); color: var(--background); font-size: 14px; box-shadow: 0 8px 24px var(--shadow); }
.toast[hidden] { display: none; }
.toast span { flex: 1; }
.toast button { width: 44px; height: 44px; padding: 0; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--background); display: flex; align-items: center; justify-content: center; }

footer { border-top: 1px solid var(--border); }
footer .col { padding-block: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 12px; color: var(--muted-foreground); }
footer .tmdb { font-weight: 700; letter-spacing: 0.04em; }

/* Bottom tab bar, phone only */
.tabs { position: sticky; bottom: 0; z-index: 4; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--card); border-top: 1px solid var(--border); }
.tabs a { padding: 2px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--muted-foreground); }
.tabs a span { width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
.tabs a[aria-current] { font-weight: 600; color: var(--primary-strong); }
.tabs a[aria-current] span { background: var(--primary-soft); }

@media (min-width: 768px) {
  .sections { display: flex; }
  .account { width: auto; height: 40px; padding: 0 10px 0 4px; }
  .account .avatar { width: 32px; height: 32px; }
  .account .name { display: inline; }
  main .col { padding-block: 24px 32px; gap: 14px; }
  .search { height: 44px; }
  .search input { font-size: 15px; }
  .result { padding: 12px 14px; gap: 0 14px; align-items: center; grid-template-columns: 48px minmax(0, 1fr) auto; grid-template-areas: "poster info actions"; }
  .poster { width: 48px; height: 72px; border-radius: 4px; }
  .actions { margin-top: 0; gap: 8px; }
  .btn { height: 36px; font-size: 14px; }
  .btn-watch { width: 150px; padding: 0 8px; white-space: nowrap; }
  .btn-icon { width: 36px; }
  .btn-sm { height: 32px; }
  .tabs { display: none; }
  .toast { left: 50%; right: auto; bottom: 24px; transform: translateX(-50%); padding: 2px 2px 2px 14px; }
  .toast button { width: 36px; height: 36px; }
}
</style>
</head>
<body>
<header class="top">
<div class="col">
<a href="#" class="brand">TasteTrack</a>
<nav class="sections" aria-label="Main">
<a href="#" aria-current="page">Home</a>
<a href="#">Log</a>
<a href="#">Up next</a>
<a href="#">Lists</a>
</nav>
<button type="button" class="account" aria-label="Account"><span class="avatar"><svg class="i" width="18" height="18" viewBox="0 0 24 24" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span><span class="name">Yura</span></button>
</div>
</header>

<main>
<div class="col">
<div class="search">
<svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" aria-label="Search films" placeholder="Search films" value="paris" autocomplete="off">
<button type="button" class="clear" aria-label="Clear search"><span><svg class="i" width="12" height="12" viewBox="0 0 24 24" stroke-width="3" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></button>
</div>

<ul class="results" aria-label="Search results"></ul>

<div class="manual-add">
<span class="muted">Can't find it?</span>
<button type="button" class="btn-sm">Add manually</button>
</div>
</div>
</main>

<footer>
<div class="col">
<span class="tmdb">TMDB</span>
<span>This product uses the TMDB API but is not endorsed or certified by TMDB.</span>
</div>
</footer>

<nav class="tabs" aria-label="Main">
<a href="#" aria-current="page"><span><svg class="i" width="22" height="22" viewBox="0 0 24 24" stroke-width="1.9" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg></span>Home</a>
<a href="#"><span><svg class="i" width="22" height="22" viewBox="0 0 24 24" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>Log</a>
<a href="#"><span><svg class="i" width="22" height="22" viewBox="0 0 24 24" stroke-width="1.75" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></span>Up next</a>
<a href="#"><span><svg class="i" width="22" height="22" viewBox="0 0 24 24" stroke-width="1.75" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></span>Lists</a>
</nav>

<div class="toast" role="status" hidden><span></span><button type="button" aria-label="Dismiss"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>

<template id="result">
<li class="result">
<span class="poster"><svg class="i" width="20" height="20" viewBox="0 0 24 24" stroke-width="1.75" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="1.5"></rect><path d="M3 9l1.5-5h16L19 9M9 4l-1.5 5M14 4l-1.5 5M19 4l-1.5 5"></path></svg></span>
<div class="info">
<span class="title"></span>
<span class="meta"><a href="#" class="mark rating" title="See your viewings" hidden><svg class="i" width="13" height="13" viewBox="0 0 24 24" style="fill: currentColor; stroke: none" role="img" aria-label="Rating"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.3L12 17.5l-5.6 3 1.1-6.3L3 9.7l6.2-.9z"></path></svg><span></span></a><span class="mark manual" hidden>Added by you</span></span>
<span class="lists" hidden><svg class="i" width="14" height="14" viewBox="0 0 24 24" role="img" aria-label="Lists"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></span>
</div>
<div class="actions">
<button type="button" class="btn btn-watch watched"><svg class="i" width="16" height="16" viewBox="0 0 24 24" stroke-width="2.25" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg><span>Mark watched</span></button>
<button type="button" class="btn btn-icon plan" aria-label="Want to watch" title="Want to watch"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></button>
<button type="button" class="btn btn-icon" aria-label="Add to list" title="Add to list"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 12H3M16 6H3M16 18H3M18 9v6M21 12h-6"></path></svg></button>
</div>
</li>
</template>

<script>
// The results: a Manual Media Item first, then TMDB. A result whose film has a Media Item
// links to its page; the last two aren't in the catalog yet, so their titles are plain text.
const results = [
  { title: "Paris at Dawn (2019)", manual: true, href: "#" },
  { title: "Paris, Texas (1984)", rating: "4", viewings: "2 viewings", lists: ["Road movies"], href: "#" },
  { title: "Paris, 13th District (2021)", href: "film-page-unwatched-a.html" },
  { title: "Midnight in Paris (2011)", watchlist: true, lists: ["Date night", "Comedy", "+1"], href: "#" },
  { title: "Paris Is Burning (1990)", rating: "4.5", viewings: "1 viewing", watchlist: true },
  { title: "Last Tango in Paris (1972)" },
];
const list = document.querySelector(".results");
const template = document.getElementById("result");
const toast = document.querySelector(".toast");
function say(message) {
  toast.querySelector("span").textContent = message;
  toast.hidden = false;
}
toast.querySelector("button").addEventListener("click", () => { toast.hidden = true; });
document.querySelector(".clear").addEventListener("click", () => {
  const input = document.querySelector(".search input");
  input.value = "";
  input.focus();
});
for (const film of results) {
  const row = template.content.firstElementChild.cloneNode(true);
  const title = row.querySelector(".title");
  if (film.href) {
    const link = document.createElement("a");
    link.className = "title";
    link.href = film.href;
    title.replaceWith(link);
    link.textContent = film.title;
  } else {
    title.textContent = film.title;
  }
  const meta = row.querySelector(".meta");
  const rating = row.querySelector(".rating");
  const watched = row.querySelector(".watched");
  const setLogged = (viewings) => {
    const logged = !!viewings;
    rating.hidden = !logged;
    if (logged) rating.querySelector("span").textContent = `${film.rating ?? "4"} · ${viewings}`;
    meta.hidden = !logged && !film.manual;
    watched.classList.toggle("done", logged);
    watched.querySelector("span").textContent = logged ? "Watched again" : "Mark watched";
  };
  setLogged(film.viewings);
  row.querySelector(".manual").hidden = !film.manual;
  const lists = row.querySelector(".lists");
  lists.hidden = !film.lists;
  for (const name of film.lists ?? []) {
    const chip = document.createElement("a");
    chip.href = "#";
    chip.textContent = name;
    lists.append(chip);
  }
  const plan = row.querySelector(".plan");
  const setPlanned = (on) => plan.setAttribute("aria-pressed", String(on));
  setPlanned(!!film.watchlist);
  plan.addEventListener("click", () => {
    const on = plan.getAttribute("aria-pressed") !== "true";
    setPlanned(on);
    say(on ? `Put ${film.title} on your Watchlist.` : `Took ${film.title} off your Watchlist.`);
  });
  watched.addEventListener("click", () => {
    setPlanned(false);
    setLogged(film.viewings ?? "1 viewing");
    say(`Added ${film.title} to your Log.`);
  });
  list.append(row);
}
</script>
</body>
</html>
