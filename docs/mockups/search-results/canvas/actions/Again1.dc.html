<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watching again 1, tap Watched</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500..700&amp;display=swap">
<style>
body{margin:0}
.tt{--bg:oklch(0.97 0.012 80);--fg:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--primary:oklch(0.82 0.16 88);--pfg:oklch(0.22 0.02 60);--pstrong:oklch(0.52 0.11 80);--psoft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--mfg:oklch(0.47 0.02 60);--border:oklch(0.88 0.015 75);--ring:oklch(0.55 0.012 55);--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--logo:"Fraunces",Georgia,serif}
.tt.dark{--bg:oklch(0.18 0.01 60);--fg:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--primary:oklch(0.84 0.16 90);--pfg:oklch(0.17 0.006 50);--pstrong:oklch(0.84 0.16 90);--psoft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--mfg:oklch(0.74 0.02 70);--border:oklch(1 0 0 / 11%);--ring:oklch(0.66 0.012 60)}
.tt a{color:inherit;text-decoration:none}
.tt button{font:inherit;cursor:pointer;color:inherit}
.tt :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
</style>
</helmet>
<div class="{{theme}}" style="position: relative; width: 402px; height: 874px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased">

<header style="flex-shrink: 0; padding: 40px 16px 8px; display: flex; align-items: center; background: var(--card); border-bottom: 1px solid var(--border)">
<a href="#" style="font-family: var(--logo); font-style: italic; font-size: 21px; font-weight: 600; letter-spacing: -0.01em">TasteTrack</a>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Search films</h1>
<div style="height: 48px; padding: 0 14px; display: flex; align-items: center; border: 1px solid var(--border); border-radius: 10px; font-size: 16px">wa</div>

<ul aria-label="Search results" style="margin: 0; padding: 0; list-style: none; border: 1px solid var(--border); border-radius: 14px; background: var(--card)">
<sc-for list="{{films}}" as="f" hint-placeholder-count="4">
<li style="padding: 12px; display: flex; gap: 12px; border-top: {{f.bt}}">
<span style="width: 56px; height: 84px; flex-shrink: 0; border-radius: 6px; background: var(--muted); color: var(--mfg); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="1.5"></rect><path d="M3 9l1.5-5h16L19 9"></path></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<a href="#" style="align-self: flex-start; font-size: 16px; font-weight: 600; line-height: 1.3">{{f.title}}</a>
<sc-if value="{{f.hasLists}}" hint-placeholder-val="{{false}}">
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--mfg)">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" role="img" aria-label="Lists" style="flex-shrink: 0; margin-right: 2px"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
<sc-for list="{{f.lists}}" as="l" hint-placeholder-count="1"><a href="#" style="padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px">{{l.name}}</a></sc-for>
</span>
</sc-if>
<div style="margin-top: 6px; display: flex; gap: 8px">
<a href="AgainSheet.dc.html" style="height: 44px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 6px; border: 1px solid {{f.wBorder}}; border-radius: 10px; background: {{f.wBg}}; color: {{f.wFg}}; font-size: 15px; font-weight: 600">
<sc-if value="{{f.logged}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
{{f.wLabel}}
</a>
<button type="button" aria-label="Want to watch" title="Want to watch" aria-pressed="{{f.plannedAttr}}" onClick="{{f.plan}}" style="width: 44px; height: 44px; flex-shrink: 0; border: 1px solid {{f.bBorder}}; border-radius: 10px; background: {{f.bBg}}; color: {{f.bFg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{f.bFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></button>
<button type="button" aria-label="Add to list" title="Add to list" style="width: 44px; height: 44px; flex-shrink: 0; border: 1px solid var(--border); border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 12H3M16 6H3M16 18H3M18 9v6M21 12h-6"></path></svg></button>
</div>
</div>
</li>
</sc-for>
</ul>
</main>

<nav aria-label="Main" style="flex-shrink: 0; padding: 8px 8px 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); text-align: center; font-size: 12px; font-weight: 500; color: var(--mfg); background: var(--card); border-top: 1px solid var(--border)">
<a href="#" aria-current="page" style="font-weight: 700; color: var(--pstrong)">Home</a><a href="#">Log</a><a href="#">Watchlist</a><a href="#">Lists</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { planned: { meetin: true, waking: true } };
  }
  togglePlanned(id) {
    const next = { ...this.state.planned };
    next[id] = !next[id];
    this.setState({ planned: next });
  }
  renderVals() {
    const films = [
      { id: "meetin", title: "Meetin' WA (1986)", lists: ["Godard"], logged: true },
      { id: "bezango", title: "Bezango, WA (2015)", lists: [], logged: true },
      { id: "anacortes", title: "Anacortes, WA (2026)", lists: [], logged: false },
      { id: "waking", title: "Waking Life (2001)", lists: ["Weird nights", "Animation", "+1"], logged: false },
    ];
    return {
      theme: "tt" + ((this.props.dark ?? true) ? " dark" : ""),
      films: films.map((film, index) => {
        const planned = !!this.state.planned[film.id];
        return {
          title: film.title,
          bt: index === 0 ? "0" : "1px solid var(--border)",
          hasLists: film.lists.length > 0,
          lists: film.lists.map((name) => ({ name })),
          logged: film.logged,
          plannedAttr: String(planned),
          wLabel: film.logged ? "Watched" : "Mark watched",
          wBorder: film.logged ? "var(--pstrong)" : "var(--border)",
          wBg: film.logged ? "var(--psoft)" : "transparent",
          wFg: film.logged ? "var(--pstrong)" : "var(--fg)",
          bBorder: planned ? "var(--pstrong)" : "var(--border)",
          bBg: planned ? "var(--psoft)" : "transparent",
          bFg: planned ? "var(--pstrong)" : "var(--fg)",
          bFill: planned ? "currentColor" : "none",
          plan: () => this.togglePlanned(film.id),
        };
      }),
    };
  }
}
</script>
</body>
</html>
