<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watched again, the sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500..700&amp;display=swap">
<style>
body{margin:0}
.tt{--bg:oklch(0.97 0.012 80);--fg:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--primary:oklch(0.82 0.16 88);--pfg:oklch(0.22 0.02 60);--pstrong:oklch(0.52 0.11 80);--psoft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--mfg:oklch(0.47 0.02 60);--border:oklch(0.88 0.015 75);--ring:oklch(0.55 0.012 55);--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--logo:"Fraunces",Georgia,serif}
.tt.dark{--bg:oklch(0.18 0.01 60);--fg:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--primary:oklch(0.84 0.16 90);--pfg:oklch(0.17 0.006 50);--pstrong:oklch(0.84 0.16 90);--psoft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--mfg:oklch(0.74 0.02 70);--border:oklch(1 0 0 / 11%);--ring:oklch(0.66 0.012 60)}
.tt a{color:inherit;text-decoration:none}
.tt button{font:inherit;cursor:pointer;color:inherit}
.tt textarea{font:inherit;color:inherit}
.tt :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
</style>
</helmet>
<div class="{{theme}}" style="position: relative; width: 402px; height: 874px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; background: oklch(0 0 0 / 55%); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased">

<section aria-label="Watched again" style="max-height: 826px; display: flex; flex-direction: column; background: var(--card); border-radius: 28px 28px 0 0">
<div style="padding: 16px 16px 8px; display: flex; align-items: center; gap: 12px">
<span style="width: 36px; height: 54px; flex-shrink: 0; border-radius: 4px; background: var(--muted)"></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 600; color: var(--pstrong)">Watched again</span>
<h2 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2">Meetin' WA</h2>
<span style="font-size: 14px; color: var(--mfg)">1986 · 26 min</span>
</div>
<a href="Again1.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div style="padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 16px">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<legend style="padding: 0; font-size: 14px; font-weight: 600">Rating</legend>
<span style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--mfg)">Last time <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.3L12 17.5l-5.6 3 1.1-6.3L3 9.7l6.2-.9z"></path></svg> 4 · 12 Mar 2024</span>
</div>
<div style="display: flex; align-items: center; gap: 2px">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
<button type="button" aria-label="{{s.name}}" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: {{s.color}}; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="{{s.fill}}" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.3L12 17.5l-5.6 3 1.1-6.3L3 9.7l6.2-.9z"></path></svg></button>
</sc-for>
<span style="margin-left: 8px; font-size: 16px; font-weight: 600">{{ratingText}}</span>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600">Date <span style="font-weight: 400; color: var(--mfg)">(optional)</span></span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<button type="button" aria-pressed="true" style="height: 44px; padding: 0 12px; border: 1px solid var(--pstrong); border-radius: 999px; background: var(--psoft); font-size: 14px; font-weight: 600">Today</button>
<button type="button" aria-pressed="false" style="height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 999px; background: transparent; font-size: 14px">Yesterday</button>
<button type="button" aria-pressed="false" style="height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 999px; background: transparent; font-size: 14px">Other date</button>
</div>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">
<span>Review <span style="font-weight: 400; color: var(--mfg)">(optional)</span></span>
<textarea rows="3" placeholder="What stayed with you?" style="box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: transparent; font-size: 16px; font-weight: 400; resize: none"></textarea>
</label>

<div style="padding-top: 12px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--border)">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600">Rewatch</span>
<span style="font-size: 13px; color: var(--mfg)">You've watched it before</span>
</div>
<button type="button" role="switch" aria-checked="{{rewatchAttr}}" aria-label="Rewatch" onClick="{{toggleRewatch}}" style="width: 44px; height: 26px; padding: 2px; border: 0; border-radius: 999px; background: {{trackBg}}; display: flex; justify-content: {{thumbSide}}"><span style="width: 22px; height: 22px; border-radius: 999px; background: var(--card)"></span></button>
</div>
</div>

<div style="padding: 8px 16px 28px; border-top: 1px solid var(--border)">
<a href="Again1.dc.html" style="height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: var(--primary); color: var(--pfg); font-size: 16px; font-weight: 600">Save</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rating: 0, rewatch: true };
  }
  renderVals() {
    const { rating, rewatch } = this.state;
    return {
      theme: "tt" + ((this.props.dark ?? true) ? " dark" : ""),
      ratingText: rating === 0 ? "–" : String(rating),
      rewatchAttr: String(rewatch),
      trackBg: rewatch ? "var(--primary)" : "var(--mfg)",
      thumbSide: rewatch ? "flex-end" : "flex-start",
      toggleRewatch: () => this.setState({ rewatch: !rewatch }),
      stars: [1, 2, 3, 4, 5].map((value) => ({
        name: value === 1 ? "1 star" : value + " stars",
        pressed: String(rating === value),
        color: value <= rating ? "var(--pstrong)" : "var(--mfg)",
        fill: value <= rating ? "currentColor" : "none",
        pick: () => this.setState({ rating: value }),
      })),
    };
  }
}
</script>
</body>
</html>
