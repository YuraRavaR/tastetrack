<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search results A, button row, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500..700&amp;display=swap">
<style>
body{margin:0}
.tt{--bg:oklch(0.97 0.012 80);--fg:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--primary:oklch(0.82 0.16 88);--pfg:oklch(0.22 0.02 60);--pstrong:oklch(0.52 0.11 80);--psoft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--mfg:oklch(0.47 0.02 60);--destructive:oklch(0.46 0.18 25);--border:oklch(0.88 0.015 75);--input:oklch(0.85 0.015 75);--ring:oklch(0.55 0.012 55);--shadow:oklch(0.2 0.01 50 / 16%);--logo:'Fraunces',Georgia,serif;--sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.tt.dark{--bg:oklch(0.18 0.01 60);--fg:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--primary:oklch(0.84 0.16 90);--pfg:oklch(0.17 0.006 50);--pstrong:oklch(0.84 0.16 90);--psoft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--mfg:oklch(0.74 0.02 70);--destructive:oklch(0.66 0.2 22);--border:oklch(1 0 0 / 11%);--input:oklch(1 0 0 / 15%);--ring:oklch(0.66 0.012 60);--shadow:oklch(0 0 0 / 45%)}
.tt a{color:inherit;text-decoration:none}
.tt a.ttl:hover{text-decoration:underline;text-underline-offset:4px}
.tt button{font:inherit;cursor:pointer;color:inherit}
.tt input{font:inherit}
.tt :focus-visible{outline:2px solid var(--ring);outline-offset:2px}
</style>
</helmet>
<div class="{{theme}}" style="position: relative; width: 402px; height: 874px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased">

<header style="flex-shrink: 0; padding: 62px 16px 8px; display: flex; align-items: center; justify-content: space-between; background: var(--card); border-bottom: 1px solid var(--border)">
<a href="#" style="font-family: var(--logo); font-style: italic; font-size: 21px; font-weight: 600; letter-spacing: -0.01em">TasteTrack</a>
<button type="button" aria-label="Account" style="width: 44px; height: 44px; margin-right: -4px; border: 0; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 34px; height: 34px; border-radius: 999px; background: var(--muted); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span></button>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="height: 48px; padding: 0 4px 0 14px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--ring); border-radius: 10px; background: var(--card); box-shadow: 0 0 0 3px var(--muted)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; color: var(--mfg)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" aria-label="Search films" placeholder="Search films" value="paris" style="flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; background: transparent; color: var(--fg); font-size: 16px; outline: none">
<button type="button" aria-label="Clear search" style="width: 40px; height: 40px; flex-shrink: 0; border: 0; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 24px; height: 24px; border-radius: 999px; background: var(--muted); color: var(--mfg); display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></button>
</div>

<ul aria-label="Search results" style="margin: 0; padding: 0; list-style: none; border: 1px solid var(--border); border-radius: 14px; background: var(--card)">
<sc-for list="{{results}}" as="r" hint-placeholder-count="6">
<li style="padding: 12px; display: flex; flex-direction: column; gap: 12px; border-top: {{r.bt}}">
<div style="display: flex; gap: 12px">
<span style="width: 48px; height: 72px; flex-shrink: 0; border-radius: 4px; background: var(--muted); color: var(--mfg); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="1.5"></rect><path d="M3 9l1.5-5h16L19 9M9 4l-1.5 5M14 4l-1.5 5M19 4l-1.5 5"></path></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px">
<sc-if value="{{r.linked}}" hint-placeholder-val="{{true}}"><a href="{{r.href}}" class="ttl" style="font-size: 16px; font-weight: 600; line-height: 1.3">{{r.title}}</a></sc-if>
<sc-if value="{{r.plain}}" hint-placeholder-val="{{false}}"><span style="font-size: 16px; font-weight: 600; line-height: 1.3">{{r.title}}</span></sc-if>
<span style="font-size: 13px; color: var(--mfg)">{{r.meta}}</span>
<sc-if value="{{r.isLog}}" hint-placeholder-val="{{false}}"><span style="padding: 2px 8px; display: flex; align-items: center; gap: 4px; border-radius: 999px; background: var(--psoft); color: var(--pstrong); font-size: 12px; font-weight: 600"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>In your Log</span></sc-if>
<sc-if value="{{r.isWl}}" hint-placeholder-val="{{false}}"><span style="padding: 2px 8px; display: flex; align-items: center; gap: 4px; border-radius: 999px; background: var(--psoft); color: var(--pstrong); font-size: 12px; font-weight: 600"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>On your Watchlist</span></sc-if>
<sc-if value="{{r.isManual}}" hint-placeholder-val="{{false}}"><span style="padding: 2px 8px; border-radius: 999px; background: var(--muted); color: var(--mfg); font-size: 12px; font-weight: 500">Added by you</span></sc-if>
</div>
</div>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{r.watch}}" style="height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 6px; border: 0; border-radius: 10px; background: var(--primary); color: var(--pfg); font-size: 15px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Watched</button>
<sc-if value="{{r.showPlan}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{r.plan}}" style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-size: 15px; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Want to watch</button></sc-if>
<button type="button" aria-label="Add to list" style="width: 44px; height: 44px; flex-shrink: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--card); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 12H3M16 6H3M16 18H3M18 9v6M21 12h-6"></path></svg></button>
</div>
</li>
</sc-for>
</ul>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px">
<span style="color: var(--mfg)">Can't find it?</span>
<button type="button" style="height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-size: 14px; font-weight: 500">Add manually</button>
</div>
</main>

<sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 104px; padding: 4px 4px 4px 16px; display: flex; align-items: center; gap: 8px; border-radius: 14px; background: var(--fg); color: var(--bg); font-size: 14px; box-shadow: 0 8px 24px var(--shadow)">
<span style="flex: 1">{{toast}}</span>
<button type="button" aria-label="Dismiss" onClick="{{dismiss}}" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--bg); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-if>

<nav aria-label="Main" style="flex-shrink: 0; padding: 6px 8px 34px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--card); border-top: 1px solid var(--border)">
<a href="#" aria-current="page" style="padding: 2px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--pstrong); font-size: 11px; font-weight: 600"><span style="width: 56px; height: 30px; border-radius: 999px; background: var(--psoft); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg></span>Home</a>
<a href="#" style="padding: 2px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--mfg); font-size: 11px; font-weight: 500"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>Log</a>
<a href="#" style="padding: 2px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--mfg); font-size: 11px; font-weight: 500"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></span>Up next</a>
<a href="#" style="padding: 2px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--mfg); font-size: 11px; font-weight: 500"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></span>Lists</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const planned = st.planned || {};
const R = [
{ id: 'dawn', title: 'Paris at Dawn', meta: '2019', manual: true, href: '#' },
{ id: 'texas', title: 'Paris, Texas', meta: '1984 · 145 min', log: true, href: '#' },
{ id: 'p13', title: 'Paris, 13th District', meta: '2021 · 105 min', href: 'AFilm.dc.html' },
{ id: 'midnight', title: 'Midnight in Paris', meta: '2011 · 94 min', wl: true, href: '#' },
{ id: 'burning', title: 'Paris Is Burning', meta: '1990 · 71 min', href: null },
{ id: 'tango', title: 'Last Tango in Paris', meta: '1972 · 129 min', href: null }
];
return {
theme: this.props.dark ? 'tt dark' : 'tt',
results: R.map((r, i) => {
const onWl = r.id in planned ? planned[r.id] : !!r.wl;
return {
title: r.title,
meta: r.meta,
href: r.href || '#',
linked: !!r.href,
plain: !r.href,
isLog: !!r.log,
isWl: onWl,
isManual: !!r.manual,
showPlan: !onWl,
bt: i === 0 ? 'none' : '1px solid var(--border)',
plan: () => this.setState({ planned: Object.assign({}, planned, { [r.id]: true }), toast: 'Put ' + r.title + ' on your Watchlist.' }),
watch: () => this.setState({ planned: Object.assign({}, planned, { [r.id]: false }), toast: 'Added ' + r.title + ' to your Log.' })
};
}),
toast: st.toast || '',
dismiss: () => this.setState({ toast: '' })
};
}
}
</script>
</body>
</html>
