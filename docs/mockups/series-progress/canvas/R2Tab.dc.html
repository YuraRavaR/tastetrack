<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Series · the Watching tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.tt{--background:oklch(0.18 0.01 60);--foreground:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--primary:oklch(0.84 0.16 90);--primary-foreground:oklch(0.17 0.006 50);--primary-strong:oklch(0.84 0.16 90);--primary-soft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--muted-foreground:oklch(0.74 0.02 70);--border:oklch(1 0 0 / 11%);--ink:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--foreground)}
.tt[data-theme=light]{--background:oklch(0.97 0.012 80);--foreground:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--primary:oklch(0.82 0.16 88);--primary-foreground:oklch(0.22 0.02 60);--primary-strong:oklch(0.52 0.11 80);--primary-soft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--muted-foreground:oklch(0.47 0.02 60);--border:oklch(0.88 0.015 75);--ink:oklch(0.22 0.02 60)}
.cap{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:600;color:#8a8378;height:24px}
.ph{width:390px;height:844px;background:var(--background);border:1px solid var(--border);border-radius:20px;overflow:hidden;position:relative;box-sizing:border-box}
.web{width:1280px;height:844px;background:var(--background);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-sizing:border-box}
.hd{height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px}
.hdw{height:64px;background:var(--card);border-bottom:1px solid var(--border)}
.hb{max-width:1152px;margin:0 auto;height:64px;display:flex;align-items:center;gap:28px;padding:0 24px;box-sizing:border-box}
.nav{display:flex;gap:4px}
.nav a{height:36px;display:flex;align-items:center;padding:0 14px;border-radius:14px;color:var(--muted-foreground);font-weight:500;font-size:15px;text-decoration:none}
.nav a.on{background:var(--primary-soft);color:var(--foreground)}
.wm{font-family:Sora,sans-serif;font-weight:700;font-size:16px;line-height:0.93;letter-spacing:-0.04em}
.av{margin-left:auto;width:36px;height:36px;border-radius:999px;background:var(--muted);display:grid;place-items:center}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic22{width:22px;height:22px}
.pc{padding:12px 16px 96px;display:flex;flex-direction:column;gap:14px}
.ct{max-width:1152px;margin:0 auto;padding:24px 24px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:18px}
.back{display:flex;align-items:center;gap:4px;font-size:15px;color:var(--muted-foreground);text-decoration:none;height:32px}
.h1{margin:-6px 0 0;font-size:28px;font-weight:700;letter-spacing:-0.01em}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--muted);border-radius:14px;padding:4px}
.tab{height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:14px;font-weight:500;border:0;background:none;color:var(--foreground);font-family:inherit;white-space:nowrap}
.tab span{color:var(--muted-foreground);font-weight:500}
.tab.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px oklch(0 0 0 / 18%)}
.rows{display:flex;flex-direction:column;gap:10px}
.rows2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.now{display:flex;align-items:stretch;border:1px solid var(--border);background:var(--card);border-radius:16px;overflow:hidden}
.nl{display:flex;gap:12px;align-items:center;padding:10px 6px 10px 10px;flex:1;min-width:0;text-decoration:none}
.po{width:48px;height:72px;border-radius:6px;object-fit:cover;border:1px solid var(--border);flex:none;box-sizing:border-box}
.np{background:var(--primary-soft);color:var(--primary-strong);display:grid;place-items:center}
.tx{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ti{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{font-size:13px;line-height:1.3;color:var(--muted-foreground)}
.me b{color:var(--foreground);font-weight:600}
.br{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-foreground);white-space:nowrap;max-width:340px}
.bar{flex:1;height:5px;border-radius:999px;background:var(--muted);overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--primary-strong);border-radius:999px}
.act{flex:none;display:flex;align-items:center;justify-content:center;background:none;border:0;border-left:1px solid var(--border);color:inherit;font:inherit;min-width:64px;padding:0 10px;cursor:pointer}
.ck{width:40px;height:40px;border-radius:999px;border:1.5px solid var(--primary-strong);color:var(--primary-strong);display:grid;place-items:center;box-sizing:border-box}
.pill{height:36px;padding:0 14px;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-size:14px;font-weight:600;display:flex;align-items:center}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px 10px;box-sizing:border-box;gap:6px}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--muted-foreground);border-radius:16px;text-decoration:none}
.tb.on{background:var(--primary-soft);color:var(--primary-strong);font-weight:600}
</style>
</helmet>
<div style="width: 1730px; display: flex; gap: 60px; align-items: flex-start">

<div style="display: flex; flex-direction: column; gap: 10px">
<div class="cap">Phone</div>
<div class="tt ph" data-theme="{{theme}}">
<header class="hd"><svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" style="color: var(--ink)"><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(-14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" style="fill: var(--primary); stroke: currentColor; stroke-width: 1.75"></rect><path d="M16 11.5L16.94 14.21L19.8 14.26L17.52 15.99L18.35 18.74L16 17.1L13.65 18.74L14.48 15.99L12.2 14.26L15.06 14.21Z" style="fill: var(--primary-foreground)"></path></svg><span class="wm">Taste<br>Track</span><span class="av"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></span></header>
<div class="pc">
<a href="#" class="back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Saved</a>
<h1 class="h1">Series</h1>
<div class="tabs" role="tablist" aria-label="Status"><button class="tab" role="tab">Watchlist<span>3</span></button><button class="tab on" role="tab" aria-selected="true">Watching<span>5</span></button><button class="tab" role="tab">Watched<span>9</span></button></div>
<div class="rows">
<sc-for list="{{rows}}" as="i" hint-placeholder-count="5">
<div class="now">
<a href="#" class="nl">
<sc-if value="{{i.src}}" hint-placeholder-val="{{true}}"><img class="po" src="{{i.src}}" alt=""></sc-if>
<sc-if value="{{i.noPoster}}" hint-placeholder-val="{{false}}"><span class="po np" role="img" aria-label="No poster"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="15" x="2" y="7" rx="2"></rect><path d="m17 2-5 5-5-5"></path></svg></span></sc-if>
<span class="tx"><span class="ti">{{i.title}}</span>
<sc-if value="{{i.next}}" hint-placeholder-val="{{true}}"><span class="me">Next: <b>{{i.ep}}</b></span></sc-if>
<sc-if value="{{i.caughtAir}}" hint-placeholder-val="{{false}}"><span class="me"><b>Caught up</b> · {{i.air}}</span></sc-if>
<sc-if value="{{i.caughtNoAir}}" hint-placeholder-val="{{false}}"><span class="me"><b>Caught up</b></span></sc-if>
<sc-if value="{{i.bar}}" hint-placeholder-val="{{true}}"><span class="br"><span class="bar"><i style="width: {{i.pct}}"></i></span>{{i.count}}</span></sc-if>
</span>
</a>
<sc-if value="{{i.next}}" hint-placeholder-val="{{true}}"><button class="act" aria-label="{{i.label}}"><span class="ck"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></button></sc-if>
<sc-if value="{{i.caught}}" hint-placeholder-val="{{false}}"><button class="act"><span class="pill">Finished</span></button></sc-if>
</div>
</sc-for>
</div>
</div>
<nav class="tabbar" aria-label="Sections"><a href="#" class="tb on" aria-current="page"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>Saved</a><a href="#" class="tb"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg>Collections</a><a href="#" class="tb"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>Search</a></nav>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div class="cap">Web</div>
<div class="tt web" data-theme="{{webTheme}}">
<header class="hdw"><div class="hb"><span style="display: flex; align-items: center; gap: 7px"><svg viewBox="0 0 32 32" width="36" height="36" aria-hidden="true" style="color: var(--ink)"><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(-14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" style="fill: var(--primary); stroke: currentColor; stroke-width: 1.75"></rect><path d="M16 11.5L16.94 14.21L19.8 14.26L17.52 15.99L18.35 18.74L16 17.1L13.65 18.74L14.48 15.99L12.2 14.26L15.06 14.21Z" style="fill: var(--primary-foreground)"></path></svg><span class="wm" style="font-size: 17px">Taste<br>Track</span></span><nav class="nav" aria-label="Sections"><a href="#" class="on" aria-current="page">Saved</a><a href="#">Collections</a><a href="#">Search</a></nav><span class="av" style="width: 40px; height: 40px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></span></div></header>
<div class="ct">
<a href="#" class="back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Saved</a>
<h1 class="h1" style="font-size: 36px; margin-top: -12px">Series</h1>
<div class="tabs" role="tablist" aria-label="Status" style="max-width: 480px"><button class="tab" role="tab">Watchlist<span>3</span></button><button class="tab on" role="tab" aria-selected="true">Watching<span>5</span></button><button class="tab" role="tab">Watched<span>9</span></button></div>
<div class="rows2">
<sc-for list="{{rows}}" as="i" hint-placeholder-count="5">
<div class="now">
<a href="#" class="nl">
<sc-if value="{{i.src}}" hint-placeholder-val="{{true}}"><img class="po" src="{{i.src}}" alt=""></sc-if>
<sc-if value="{{i.noPoster}}" hint-placeholder-val="{{false}}"><span class="po np" role="img" aria-label="No poster"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="15" x="2" y="7" rx="2"></rect><path d="m17 2-5 5-5-5"></path></svg></span></sc-if>
<span class="tx"><span class="ti">{{i.title}}</span>
<sc-if value="{{i.next}}" hint-placeholder-val="{{true}}"><span class="me" style="font-size: 14px">Next: <b>{{i.ep}}</b></span></sc-if>
<sc-if value="{{i.caughtAir}}" hint-placeholder-val="{{false}}"><span class="me" style="font-size: 14px"><b>Caught up</b> · {{i.air}}</span></sc-if>
<sc-if value="{{i.caughtNoAir}}" hint-placeholder-val="{{false}}"><span class="me" style="font-size: 14px"><b>Caught up</b></span></sc-if>
<sc-if value="{{i.bar}}" hint-placeholder-val="{{true}}"><span class="br" style="font-size: 13px"><span class="bar"><i style="width: {{i.pct}}"></i></span>{{i.count}}</span></sc-if>
</span>
</a>
<sc-if value="{{i.next}}" hint-placeholder-val="{{true}}"><button class="act" aria-label="{{i.label}}"><span class="ck"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></button></sc-if>
<sc-if value="{{i.caught}}" hint-placeholder-val="{{false}}"><button class="act"><span class="pill">Finished</span></button></sc-if>
</div>
</sc-for>
</div>
</div>
</div>
</div>

</div>
</x-dc>

</body>
</html>
