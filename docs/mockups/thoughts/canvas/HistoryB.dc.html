<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History · phone · B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.tt{--background:oklch(0.18 0.01 60);--foreground:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--primary:oklch(0.84 0.16 90);--primary-foreground:oklch(0.17 0.006 50);--primary-strong:oklch(0.84 0.16 90);--primary-soft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--muted-foreground:oklch(0.74 0.02 70);--border:oklch(1 0 0 / 11%);--input:oklch(1 0 0 / 15%);--ring:oklch(0.66 0.012 60);--destructive:oklch(0.66 0.2 22);--ink:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--foreground)}
.tt[data-theme=light]{--background:oklch(0.97 0.012 80);--foreground:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--primary:oklch(0.82 0.16 88);--primary-foreground:oklch(0.22 0.02 60);--primary-strong:oklch(0.52 0.11 80);--primary-soft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--muted-foreground:oklch(0.47 0.02 60);--border:oklch(0.88 0.015 75);--input:oklch(0.85 0.015 75);--ring:oklch(0.55 0.012 55);--destructive:oklch(0.46 0.18 25);--ink:oklch(0.22 0.02 60)}
.cap{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:600;color:#8a8378;height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:390px}
.ph{width:390px;height:844px;background:var(--background);border:1px solid var(--border);border-radius:20px;overflow:hidden;position:relative;box-sizing:border-box}
.hd{height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px;box-sizing:border-box}
.wm{font-family:Sora,sans-serif;font-weight:700;font-size:16px;line-height:0.93;letter-spacing:-0.04em}
.av{margin-left:auto;width:36px;height:36px;border-radius:999px;background:var(--muted);display:grid;place-items:center}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic12{width:12px;height:12px}.ic14{width:14px;height:14px}.ic16{width:16px;height:16px}.ic22{width:22px;height:22px}
.strip{display:flex;gap:12px;align-items:center;padding:14px 16px 0}
.th{width:40px;height:60px;border-radius:6px;object-fit:cover;border:1px solid var(--border);flex:none;box-sizing:border-box}
.ts{width:40px;height:60px;border-radius:6px;border:1px solid var(--border);background:var(--primary-soft);color:var(--foreground);flex:none;box-sizing:border-box;font-size:7px;font-weight:700;line-height:1.15;padding:5px 4px;overflow:hidden}
.np{width:40px;height:60px;border-radius:6px;border:1px solid var(--border);background:var(--muted);color:var(--muted-foreground);flex:none;box-sizing:border-box;display:grid;place-items:center}
.ti{margin:0;font-size:17px;font-weight:700;letter-spacing:-0.01em}
.fa{margin:2px 0 0;font-size:13px;color:var(--muted-foreground)}
.skip{margin:12px 16px 0;height:40px;border:1px dashed var(--input);border-radius:12px;display:grid;place-items:center;font-size:13px;color:var(--muted-foreground)}
.sec{display:flex;flex-direction:column;gap:12px;padding:18px 16px 0}
.h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-0.01em}
.comp{height:48px;border:1px solid var(--input);border-radius:12px;background:var(--card);display:flex;align-items:center;gap:10px;padding:0 14px;font:inherit;font-size:15px;color:var(--muted-foreground);text-align:left;width:100%;box-sizing:border-box;cursor:text}
.tl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.li{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding-bottom:14px}
.li.line::before{content:"";position:absolute;left:13px;top:32px;bottom:2px;width:2px;border-radius:2px;background:var(--border)}
.mk{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;box-sizing:border-box}
.mk.lg{background:var(--primary);color:var(--primary-foreground)}
.mk.tp{background:var(--card);border:1px solid var(--border);color:var(--muted-foreground)}
.mk.tq{background:var(--primary-soft);color:var(--primary-strong)}
.it{display:flex;flex-direction:column;gap:4px;min-height:44px;padding:3px 0 0;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;min-width:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.dt{font-size:13px;font-weight:500;color:var(--muted-foreground);margin-right:2px}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--muted);display:inline-flex;align-items:center;gap:4px}
.chip.pg{background:var(--primary-soft);font-variant-numeric:tabular-nums}
.lt{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.rv{margin:0;font-size:14px;line-height:1.4;color:var(--muted-foreground);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tx{margin:0;font-size:15px;line-height:1.45}
.tx.q{font-style:italic}
.stars{display:inline-flex;gap:1px;color:var(--primary)}
.st{position:relative;width:14px;height:14px;display:inline-block}
.st svg{position:absolute;inset:0;width:14px;height:14px}
.st .o{fill:none;stroke:var(--input);stroke-width:2}
.st .f{fill:currentColor;stroke:none}
.st .hf{position:absolute;inset:0;width:7px;overflow:hidden}
.empty{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;border:1px dashed var(--input);border-radius:12px;padding:20px 16px}
.empty p{margin:0}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted-foreground);text-decoration:none}
.tb.on{color:var(--foreground)}
.tb.on svg{background:var(--primary-soft);border-radius:999px;padding:2px 12px;box-sizing:content-box}
</style>
</helmet>
<div style="width: 2110px; display: flex; gap: 40px; align-items: flex-start">
<sc-for list="{{phones}}" as="p" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="cap">{{p.cap}}</div>
<div class="tt ph" data-theme="{{theme}}">
<header class="hd"><svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" style="color: var(--ink)"><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(-14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" style="fill: var(--primary); stroke: currentColor; stroke-width: 1.75"></rect><path d="M16 11.5L16.94 14.21L19.8 14.26L17.52 15.99L18.35 18.74L16 17.1L13.65 18.74L14.48 15.99L12.2 14.26L15.06 14.21Z" style="fill: var(--primary-foreground)"></path></svg><span class="wm">Taste<br>Track</span><span class="av"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></span></header>
<div class="strip">
<sc-if value="{{p.img}}" hint-placeholder-val="{{true}}"><img class="th" src="{{p.img}}" alt=""></sc-if>
<sc-if value="{{p.typeset}}" hint-placeholder-val="{{false}}"><div class="ts" aria-hidden="true">{{p.typeset}}</div></sc-if>
<sc-if value="{{p.noPoster}}" hint-placeholder-val="{{false}}"><div class="np" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M7 3v18"></path><path d="M3 7.5h4"></path><path d="M3 12h18"></path><path d="M3 16.5h4"></path><path d="M17 3v18"></path><path d="M17 7.5h4"></path><path d="M17 16.5h4"></path></svg></div></sc-if>
<div style="min-width: 0"><h1 class="ti">{{p.title}}</h1><p class="fa">{{p.facts}}</p></div>
</div>
<div class="skip">{{p.skip}}</div>
<section class="sec" aria-label="History">
<h2 class="h2">History</h2>
<button class="comp"><svg class="ic ic16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"></path></svg>Write a thought…</button>

<sc-if value="{{p.hasItems}}" hint-placeholder-val="{{true}}">
<ul class="tl">
<sc-for list="{{p.items}}" as="it" hint-placeholder-count="4">
<li class="{{it.liClass}}">

<sc-if value="{{it.log}}" hint-placeholder-val="{{false}}">
<span class="mk lg" aria-hidden="true"><svg class="ic ic14" viewBox="0 0 24 24" style="stroke-width: 3"><path d="M20 6 9 17l-5-5"></path></svg></span>
<button class="it" aria-label="{{it.label}}">
<span class="dt">{{it.date}}</span>
<span class="lt">{{it.verb}}
<span class="stars" role="img" aria-label="{{it.ratingLabel}}"><sc-for list="{{it.stars}}" as="s" hint-placeholder-count="5"><span class="st"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="o" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"></path></svg><sc-if value="{{s.full}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"></path></svg></sc-if><sc-if value="{{s.half}}" hint-placeholder-val="{{false}}"><span class="hf"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path class="f" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"></path></svg></span></sc-if></span></sc-for></span>
<sc-if value="{{it.rewatch}}" hint-placeholder-val="{{false}}"><span class="chip">Rewatch</span></sc-if>
</span>
<sc-if value="{{it.review}}" hint-placeholder-val="{{false}}"><span class="rv">{{it.review}}</span></sc-if>
</button>
</sc-if>

<sc-if value="{{it.thought}}" hint-placeholder-val="{{true}}">
<sc-if value="{{it.quote}}" hint-placeholder-val="{{false}}"><span class="mk tq" aria-hidden="true"><svg class="ic ic14" viewBox="0 0 24 24"><path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"></path><path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"></path></svg></span></sc-if>
<sc-if value="{{it.plain}}" hint-placeholder-val="{{true}}"><span class="mk tp" aria-hidden="true"><svg class="ic ic14" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"></path></svg></span></sc-if>
<button class="it" aria-label="{{it.label}}">
<span class="meta"><span class="dt">{{it.date}}</span>
<sc-if value="{{it.state}}" hint-placeholder-val="{{true}}"><span class="chip">{{it.state}}</span></sc-if>
<sc-if value="{{it.progress}}" hint-placeholder-val="{{false}}"><span class="chip pg"><svg class="ic ic12" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>{{it.progress}}</span></sc-if>
</span>
<span class="{{it.textClass}}">{{it.text}}</span>
</button>
</sc-if>

</li>
</sc-for>
</ul>
</sc-if>

<sc-if value="{{p.empty}}" hint-placeholder-val="{{false}}">
<div class="empty">
<p style="font-weight: 600">Nothing here yet</p>
<p class="fa" style="font-size: 14px; margin: 0">Mark it Watched to keep the date, Rating and Review here, or write a thought at any time, even before you watch.</p>
</div>
</sc-if>
</section>
<nav class="tabbar" aria-label="Sections"><a href="#" class="tb on" aria-current="page"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>Saved</a><a href="#" class="tb"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg>Collections</a><a href="#" class="tb"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>Search</a></nav>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":2110,"height":880}}'>
class Component extends DCLogic {
renderVals() {
const stars = (r) => [1, 2, 3, 4, 5].map((n) => ({ full: r >= n, half: r < n && r >= n - 0.5 }));
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
const log = (date, verb, rating, review, rewatch) => ({ log: true, date, verb, stars: stars(rating), ratingLabel: "Rating " + rating + " of 5", review, rewatch, label: "Edit your entry for " + date });
const th = (date, state, progress, text, quote) => ({ thought: true, date, state: cap(state), progress, quote: !!quote, plain: !quote, text: quote ? "“" + text + "”" : text, textClass: quote ? "tx q" : "tx", label: "Edit your thought of " + date });
const rows = (items) => items.map((it, i) => ({ ...it, liClass: i < items.length - 1 ? "li line" : "li" }));
const phone = (p) => ({ ...p, hasItems: !!p.items, empty: !p.items, items: p.items ? rows(p.items) : [] });
return {
theme: this.props.theme ?? "dark",
phones: [
phone({ cap: "B · A series while watching: Progress, a quote, a Backlog Note kept", img: "/_blob/860f7beb13c4eee65a17878165d3e569", title: "Severance", facts: "2022 · Apple TV+ · Watching S2 · E5", skip: "Banner, About, the Watching card, actions", items: [
th("16 Nov 2026", "while watching", "S2 · E5", "Season 2 drags until episode 5. From there it's the best thing on TV this year."),
th("2 Nov 2026", "while watching", "S2 · E1", "The work is mysterious and important.", true),
th("28 Sep 2026", "while on your Watchlist", "", "Olena says season 1 is perfect and the finale is worth the wait.")
] }),
phone({ cap: "B · A book read again: while reading wins over after reading", img: "/_blob/67b56f1faf3786bd88d99498d1d3a59b", title: "Piranesi", facts: "2020 · Susanna Clarke · Reading, p. 168", skip: "Banner, About, the Reading card, actions", items: [
th("15 Nov 2026", "while reading", "p. 142", "The Beauty of the House is immeasurable; its Kindness infinite.", true),
th("20 Oct 2026", "while reading", "p. 34", "Took me thirty pages to stop fighting the capital letters. Now I like them."),
th("4 Feb 2024", "after reading", "", "Still thinking about the statues. Read it again in winter."),
log("2 Feb 2024", "Read", 5, "Read it in two evenings. Strange and very kind.", false),
th("10 Jan 2024", "while on your Reading list", "", "Marta: read it in one go if you can.")
] }),
phone({ cap: "B · A film: Thoughts between Log Entries, the undated one last", img: "/_blob/a7105c3481e72306053592373ae7eb4b", title: "Spirit: Stallion of the Cimarron", facts: "2002 · 1h 24m · Watched twice", skip: "Banner, stats, About, actions", items: [
th("14 Nov 2026", "after watching", "", "No talking horse, just Bryan Adams. Somehow that's why it works."),
log("9 Nov 2026", "Watched", 3.5, "Better than I remembered. The train sequence still holds up.", true),
th("21 Oct 2026", "while on your Watchlist", "", "Olena says it's her favourite."),
log("No date", "Watched", 4, "", false)
] }),
phone({ cap: "B · Not in Saved: a Thought with no state", typeset: "Kafka on the Shore", title: "Kafka on the Shore", facts: "2002 · Haruki Murakami", skip: "Banner, About, Want to read, actions", items: [
th("16 Nov 2026", "", "", "Sometimes fate is like a small sandstorm that keeps changing directions.", true)
] }),
phone({ cap: "B · Nothing here yet", noPoster: true, title: "Perfect Days", facts: "2023 · 2h 4m", skip: "Banner, About, Watched, actions" })
]
};
}
}
</script>
</body>
</html>
