<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saved with Albums · web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.tt{--background:oklch(0.18 0.01 60);--foreground:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--primary:oklch(0.84 0.16 90);--primary-foreground:oklch(0.17 0.006 50);--primary-strong:oklch(0.84 0.16 90);--primary-soft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--muted-foreground:oklch(0.74 0.02 70);--border:oklch(1 0 0 / 11%);--ink:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--foreground)}
.tt[data-theme=light]{--background:oklch(0.97 0.012 80);--foreground:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--primary:oklch(0.82 0.16 88);--primary-foreground:oklch(0.22 0.02 60);--primary-strong:oklch(0.52 0.11 80);--primary-soft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--muted-foreground:oklch(0.47 0.02 60);--border:oklch(0.88 0.015 75);--ink:oklch(0.22 0.02 60)}
.cap{font-family:ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:600;color:#8a8378;height:24px}
.web{width:1280px;background:var(--background);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-sizing:border-box}
.hd{height:64px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 32px;gap:10px}
.wm{font-family:Sora,sans-serif;font-weight:700;font-size:17px;line-height:0.93;letter-spacing:-0.04em}
.nav{display:flex;gap:4px;margin-left:28px}
.nav a{height:40px;padding:0 14px;border-radius:12px;display:flex;align-items:center;font-size:15px;font-weight:500;text-decoration:none;color:var(--muted-foreground)}
.nav a.on{background:var(--primary-soft);color:var(--primary-strong);font-weight:600}
.av{margin-left:auto;width:36px;height:36px;border-radius:999px;background:var(--muted);display:grid;place-items:center}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic22{width:22px;height:22px}
.pc{max-width:1040px;margin:0 auto;padding:28px 0 40px;display:flex;flex-direction:column;gap:20px}
.h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-0.01em}
.tic{width:44px;height:44px;border-radius:13px;background:var(--primary-soft);color:var(--primary-strong);display:grid;place-items:center;flex:none}
.tile{position:relative;border:1px solid var(--border);background:var(--card);border-radius:20px;box-sizing:border-box;overflow:hidden;text-decoration:none;display:flex;flex-direction:column}
.big{height:220px;padding:24px}
.tn{font-size:30px;font-weight:700;letter-spacing:-0.01em}
.tn24{font-size:24px}
.tn20{font-size:20px}
.tc{font-size:15px;line-height:1.4;color:var(--muted-foreground)}
.tc13{font-size:13px;line-height:1.35}
.fan{position:absolute;display:block}
.fan img{position:absolute;object-fit:cover;box-shadow:0 8px 18px oklch(0 0 0 / 35%)}
.fanin{position:relative;display:block}
.fanin img{position:absolute;object-fit:cover;box-shadow:0 6px 14px oklch(0 0 0 / 35%)}
</style>
</helmet>
<div style="width: 1280px; display: flex; flex-direction: column; gap: 40px">
<sc-for list="{{variants}}" as="v" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="cap">{{v.cap}}</div>
<div class="tt web" data-theme="{{theme}}">
<header class="hd"><svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" style="color: var(--ink)"><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(-14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" style="fill: var(--primary); stroke: currentColor; stroke-width: 1.75"></rect><path d="M16 11.5L16.94 14.21L19.8 14.26L17.52 15.99L18.35 18.74L16 17.1L13.65 18.74L14.48 15.99L12.2 14.26L15.06 14.21Z" style="fill: var(--primary-foreground)"></path></svg><span class="wm">Taste<br>Track</span><nav class="nav" aria-label="Sections"><a href="#" class="on" aria-current="page">Saved</a><a href="#">Collections</a><a href="#">Search</a></nav><span class="av"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></span></header>
<div class="pc">
<h1 class="h1">Saved</h1>

<sc-if value="{{v.a}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{four}}" as="t" hint-placeholder-count="4">
<a href="#" class="tile big">
<span class="tic"><sc-if value="{{t.film}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"></path><path d="m6.2 5.3 3.1 3.9"></path><path d="m12.4 3.4 3.1 4"></path><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path></svg></sc-if><sc-if value="{{t.book}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></sc-if><sc-if value="{{t.series}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="15" x="2" y="7" rx="2"></rect><path d="m17 2-5 5-5-5"></path></svg></sc-if><sc-if value="{{t.game}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" x2="10" y1="11" y2="11"></line><line x1="8" x2="8" y1="9" y2="13"></line><line x1="15" x2="15.01" y1="12" y2="12"></line><line x1="18" x2="18.01" y1="10" y2="10"></line><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"></path></svg></sc-if><sc-if value="{{t.album}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="12" cy="12" r="5"></circle><path d="M12 12h.01"></path></svg></sc-if></span>
<span style="margin-top: auto" class="tn">{{t.name}}</span>
<span class="tc" style="max-width: 240px">{{t.counts}}</span>
<span class="fan" aria-hidden="true" style="right: 20px; top: 22px; width: 210px; height: 176px"><sc-for list="{{t.fanBig}}" as="f" hint-placeholder-count="3"><img src="{{f.src}}" alt="" style="{{f.style}}"></sc-for></span>
</a>
</sc-for>
</div>
<a href="#" class="tile big">
<span class="tic"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="12" cy="12" r="5"></circle><path d="M12 12h.01"></path></svg></span>
<span style="margin-top: auto" class="tn">Albums</span>
<span class="tc">{{album.counts}}</span>
<span class="fan" aria-hidden="true" style="right: 28px; top: 22px; width: 300px; height: 176px"><sc-for list="{{album.fanWide}}" as="f" hint-placeholder-count="3"><img src="{{f.src}}" alt="" style="{{f.style}}"></sc-for></span>
</a>
</sc-if>

<sc-if value="{{v.b}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{three}}" as="t" hint-placeholder-count="3">
<a href="#" class="tile big">
<span class="tic"><sc-if value="{{t.film}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"></path><path d="m6.2 5.3 3.1 3.9"></path><path d="m12.4 3.4 3.1 4"></path><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path></svg></sc-if><sc-if value="{{t.book}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></sc-if><sc-if value="{{t.series}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="15" x="2" y="7" rx="2"></rect><path d="m17 2-5 5-5-5"></path></svg></sc-if><sc-if value="{{t.game}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" x2="10" y1="11" y2="11"></line><line x1="8" x2="8" y1="9" y2="13"></line><line x1="15" x2="15.01" y1="12" y2="12"></line><line x1="18" x2="18.01" y1="10" y2="10"></line><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"></path></svg></sc-if><sc-if value="{{t.album}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="12" cy="12" r="5"></circle><path d="M12 12h.01"></path></svg></sc-if></span>
<span style="margin-top: auto" class="tn tn24">{{t.name}}</span>
<span class="tc tc13" style="max-width: 150px">{{t.counts}}</span>
<span class="fan" aria-hidden="true" style="right: 14px; top: 20px; width: 150px; height: 130px"><sc-for list="{{t.fanMid}}" as="f" hint-placeholder-count="3"><img src="{{f.src}}" alt="" style="{{f.style}}"></sc-for></span>
</a>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{two}}" as="t" hint-placeholder-count="2">
<a href="#" class="tile big">
<span class="tic"><sc-if value="{{t.film}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"></path><path d="m6.2 5.3 3.1 3.9"></path><path d="m12.4 3.4 3.1 4"></path><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path></svg></sc-if><sc-if value="{{t.book}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></sc-if><sc-if value="{{t.series}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="15" x="2" y="7" rx="2"></rect><path d="m17 2-5 5-5-5"></path></svg></sc-if><sc-if value="{{t.game}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" x2="10" y1="11" y2="11"></line><line x1="8" x2="8" y1="9" y2="13"></line><line x1="15" x2="15.01" y1="12" y2="12"></line><line x1="18" x2="18.01" y1="10" y2="10"></line><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"></path></svg></sc-if><sc-if value="{{t.album}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="12" cy="12" r="5"></circle><path d="M12 12h.01"></path></svg></sc-if></span>
<span style="margin-top: auto" class="tn">{{t.name}}</span>
<span class="tc" style="max-width: 240px">{{t.counts}}</span>
<span class="fan" aria-hidden="true" style="right: 20px; top: 22px; width: 210px; height: 176px"><sc-for list="{{t.fanBig}}" as="f" hint-placeholder-count="3"><img src="{{f.src}}" alt="" style="{{f.style}}"></sc-for></span>
</a>
</sc-for>
</div>
</sc-if>

<sc-if value="{{v.c}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{five}}" as="t" hint-placeholder-count="5">
<a href="#" class="tile" style="height: 280px; padding: 18px">
<span class="fanin" aria-hidden="true" style="height: 150px; margin-bottom: 14px"><sc-for list="{{t.fanTop}}" as="f" hint-placeholder-count="3"><img src="{{f.src}}" alt="" style="{{f.style}}"></sc-for></span>
<span class="tn tn20">{{t.name}}</span>
<span class="tc tc13">{{t.counts}}</span>
</a>
</sc-for>
</div>
</sc-if>

</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":1900}}'>
class Component extends DCLogic {
renderVals() {
// A fan of three, the front one last so it paints on top. Posters are 2:3, album covers square.
const fanOf = (srcs, square, pw, w, front) => {
const ph = square ? pw : Math.round(pw * 1.5);
const fw = Math.round(pw * (front || 1.13)), fh = square ? fw : Math.round(fw * 1.5);
const off = Math.round(pw * 0.72);
const mid = (w - pw) / 2;
const slots = [
'left: ' + (mid - off) + 'px; top: 14px; transform: rotate(-9deg); width: ' + pw + 'px; height: ' + ph + 'px',
'left: ' + (mid + off) + 'px; top: 14px; transform: rotate(9deg); width: ' + pw + 'px; height: ' + ph + 'px',
'left: ' + ((w - fw) / 2) + 'px; top: 0; width: ' + fw + 'px; height: ' + fh + 'px'
];
return srcs.map((src, i) => ({ src, style: slots[i] + '; border-radius: ' + (square ? 5 : 7) + 'px' }));
};
const types = [
{ name: 'Films', film: true, counts: '12 to watch · 14 watched', src: ['/_blob/d73f94dd7825e548dbb4129302fcf672', '/_blob/2794d88174675b71153e4172b33f58da', '/_blob/e10b4b654d75dfca2d652d9000ca4707'] },
{ name: 'Books', book: true, counts: '8 to read · 1 reading · 23 read', src: ['/_blob/2794d88174675b71153e4172b33f58da', '/_blob/d73f94dd7825e548dbb4129302fcf672', '/_blob/6b02528223b3d6870df2f7442af93944'] },
{ name: 'Series', series: true, counts: '3 to watch · 1 watching · 9 watched', src: ['/_blob/e10b4b654d75dfca2d652d9000ca4707', '/_blob/d73f94dd7825e548dbb4129302fcf672', '/_blob/2794d88174675b71153e4172b33f58da'] },
{ name: 'Games', game: true, counts: '5 to play · 1 playing · 12 played', src: ['/_blob/e618e496f5c9c07aea66bb782c575cd7', '/_blob/b070bcfd070e2585bad22f10947eb98a', '/_blob/abaa8a2738ae1f5f121009196dc3cbca'] },
{ name: 'Albums', album: true, square: true, counts: '7 to listen · 14 listened', src: ['/_blob/f2455baa325ca42efbb676891ba1f08d', '/_blob/f9a582126866df7430ed2418537e4276', '/_blob/8a2be7a620670db54eb4d970f9aaef61'] }
];
const all = types.map((t) => ({
...t,
fanBig: fanOf(t.src, t.square, t.square ? 116 : 92, 210),
fanMid: fanOf(t.src, t.square, t.square ? 84 : 66, 150),
fanTop: fanOf(t.src, t.square, t.square ? 74 : 60, 160)
}));
return {
theme: this.props.theme ?? 'dark',
four: all.slice(0, 4),
three: all.slice(0, 3),
two: all.slice(3),
five: all,
album: { counts: all[4].counts, fanWide: fanOf(all[4].src, true, 120, 300, 1.2) },
variants: [
{ cap: 'A · 2×2, then Albums the full width', a: true },
{ cap: 'B · Three, then two', b: true },
{ cap: 'C · Five in a row', c: true }
]
};
}
}
</script>
</body>
</html>
