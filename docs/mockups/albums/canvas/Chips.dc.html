.h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-0.01em}
.lab{font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted-foreground)}
.field{height:48px;border:1px solid var(--border);background:var(--card);border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:16px;color:var(--muted-foreground)}
.btn{height:40px;padding:0 14px;border-radius:12px;border:0;background:var(--primary);color:var(--primary-foreground);font:inherit;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.seg{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;gap:2px;background:var(--muted);border-radius:14px;padding:4px;border:0;margin:0;min-width:0}

.sg.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px oklch(0 0 0 / 18%)}
.sg.on svg{color:var(--primary-strong)}
.pills{display:flex;gap:8px;overflow:hidden;border:0;padding:0;margin:0 -16px 0 0;min-width:0}
.pill{height:40px;flex:none;padding:0 14px 0 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:inherit;font:inherit;font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px}
.pill.on{background:var(--primary-soft);border-color:var(--primary-strong);color:var(--primary-strong);font-weight:600}
.icoseg{display:flex;gap:2px;background:var(--muted);border-radius:14px;padding:4px;border:0;margin:0}
.is{height:48px;flex:1;border:0;background:none;color:var(--muted-foreground);font:inherit;font-size:14px;font-weight:600;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1290,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const types = [
{ name: 'Films', film: true }, { name: 'Books', book: true }, { name: 'Series', series: true },
{ name: 'Games', game: true }, { name: 'Albums', album: true }
];
const chipsFor = (current) => types.map((t) => {
const on = t.name === current;
return { ...t, pressed: on, segClass: on ? 'sg on' : 'sg', pillClass: on ? 'pill on' : 'pill', isClass: on ? 'is on' : 'is' };
});
return {
theme: this.props.theme ?? 'dark',
chips: chipsFor('Albums'),
chipsBooks: chipsFor('Films'),
variants: [
{ cap: 'A · Five equal segments, icon over label', a: true },
{ cap: 'B · A scrolling row of pills', b: true },
{ cap: 'C · Icons, the pressed one named', c: true }
]
};
}
}
</script>
