<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Albums icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tt{--background:oklch(0.18 0.01 60);--foreground:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--primary-strong:oklch(0.84 0.16 90);--primary-soft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--muted-foreground:oklch(0.74 0.02 70);--border:oklch(1 0 0 / 11%);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--foreground)}
.tt[data-theme=light]{--background:oklch(0.97 0.012 80);--foreground:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--primary-strong:oklch(0.52 0.11 80);--primary-soft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--muted-foreground:oklch(0.47 0.02 60);--border:oklch(0.88 0.015 75)}
.cap{font-size:15px;font-weight:600;color:#8a8378;height:24px;font-family:ui-sans-serif,system-ui,sans-serif}
.ph{width:390px;background:var(--background);border:1px solid var(--border);border-radius:20px;box-sizing:border-box;padding:16px;display:flex;flex-direction:column;gap:14px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic22{width:22px;height:22px}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;background:var(--muted);border-radius:14px;padding:4px;border:0;margin:0}
.sg{height:56px;border:0;background:none;color:inherit;font:inherit;font-size:13px;font-weight:500;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0}
.sg.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px oklch(0 0 0 / 18%)}
.sg.on svg{color:var(--primary-strong)}
.tile{border:1px solid var(--border);background:var(--card);border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.tic{width:44px;height:44px;border-radius:13px;background:var(--primary-soft);color:var(--primary-strong);display:grid;place-items:center;flex:none}
.tn{font-size:20px;font-weight:700}
.tc{font-size:13px;color:var(--muted-foreground)}
.why{font-size:14px;line-height:1.45;color:var(--muted-foreground);margin:0}
</style>
</helmet>
<div style="width: 1720px; display: flex; gap: 40px; align-items: flex-start">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="cap">{{o.cap}}</div>
<div class="tt ph" data-theme="{{theme}}">
<fieldset class="seg" aria-label="Media Type">
<button class="sg" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"></path><path d="m6.2 5.3 3.1 3.9"></path><path d="m12.4 3.4 3.1 4"></path><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path></svg>Films</button>
<button class="sg" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg>Books</button>
<button class="sg" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="15" x="2" y="7" rx="2"></rect><path d="m17 2-5 5-5-5"></path></svg>Series</button>
<button class="sg" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="6" x2="10" y1="11" y2="11"></line><line x1="8" x2="8" y1="9" y2="13"></line><line x1="15" x2="15.01" y1="12" y2="12"></line><line x1="18" x2="18.01" y1="10" y2="10"></line><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"></path></svg>Games</button>
<button class="sg on" aria-pressed="true">
<sc-if value="{{o.disc}}" hint-placeholder-val="{{true}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M6 12c0-1.7.7-3.2 1.8-4.2"></path><circle cx="12" cy="12" r="2"></circle><path d="M18 12c0 1.7-.7 3.2-1.8 4.2"></path></svg></sc-if>
<sc-if value="{{o.note}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></sc-if>
<sc-if value="{{o.phones}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"></path></svg></sc-if>
<sc-if value="{{o.lines}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10v3"></path><path d="M6 6v11"></path><path d="M10 3v18"></path><path d="M14 8v7"></path><path d="M18 5v13"></path><path d="M22 10v3"></path></svg></sc-if>
Albums</button>
</fieldset>
<div class="tile">
<span class="tic">
<sc-if value="{{o.disc}}" hint-placeholder-val="{{true}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M6 12c0-1.7.7-3.2 1.8-4.2"></path><circle cx="12" cy="12" r="2"></circle><path d="M18 12c0 1.7-.7 3.2-1.8 4.2"></path></svg></sc-if>
<sc-if value="{{o.note}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></sc-if>
<sc-if value="{{o.phones}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"></path></svg></sc-if>
<sc-if value="{{o.lines}}" hint-placeholder-val="{{false}}"><svg class="ic ic22" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10v3"></path><path d="M6 6v11"></path><path d="M10 3v18"></path><path d="M14 8v7"></path><path d="M18 5v13"></path><path d="M22 10v3"></path></svg></sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 2px"><span class="tn">Albums</span><span class="tc">7 to listen · 14 listened</span></span>
</div>
<p class="why">{{o.why}}</p>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1720,"height":420}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.theme ?? 'dark',
opts: [
{ cap: '1 · A record (Lucide disc-3)', disc: true, why: 'An album is a record. Leaves the note for Songs, the next music spec.' },
{ cap: '2 · A note (Lucide music)', note: true, why: 'The plainest sign of music. Songs would then need another icon.' },
{ cap: '3 · Headphones (Lucide headphones)', phones: true, why: 'Listening, as the verbs are: Want to listen, Listened.' },
{ cap: '4 · A sound wave (Lucide audio-lines)', lines: true, why: 'Sound itself; reads as audio more than as an album.' }
]
};
}
}
</script>
</body>
</html>
