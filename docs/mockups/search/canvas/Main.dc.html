<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search A, poster strip, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tt{--bg:oklch(0.97 0.012 80);--fg:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--muted:oklch(0.935 0.016 75);--mfg:oklch(0.47 0.02 60);--pri:oklch(0.82 0.16 88);--pfg:oklch(0.22 0.02 60);--pstrong:oklch(0.52 0.11 80);--psoft:oklch(0.96 0.037 87);--border:oklch(0.88 0.015 75);--shadow:oklch(0.2 0.01 50 / 14%)}
.tt.dark{--bg:oklch(0.18 0.01 60);--fg:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--muted:oklch(0.28 0.014 60);--mfg:oklch(0.74 0.02 70);--pri:oklch(0.84 0.16 90);--pfg:oklch(0.17 0.006 50);--pstrong:oklch(0.84 0.16 90);--psoft:oklch(0.31 0.034 85);--border:oklch(1 0 0 / 11%);--shadow:oklch(0 0 0 / 50%)}
.tt a{color:var(--fg)}
.tt button{font:inherit;cursor:pointer;color:inherit}
.tt button:disabled{cursor:not-allowed}
.tt input{font:inherit;color:var(--fg)}
.tt input::placeholder{color:var(--mfg)}
.tt input:focus{outline:2px solid var(--pri);outline-offset:1px}
.tt input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
</style>
</helmet>
<div class="tt {{themeClass}}" style="position: relative; width: 402px; height: 874px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased">

<header style="flex-shrink: 0; padding: 62px 16px 8px; display: flex; align-items: center; justify-content: space-between; background: var(--card); border-bottom: 1px solid var(--border)">
<a href="#" style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 600; font-size: 22px; text-decoration: none">TasteTrack</a>
<button type="button" aria-label="Account: Invites, Settings, Log out" style="width: 44px; height: 44px; margin-right: -4px; border: 0; border-radius: 999px; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 34px; height: 34px; border-radius: 999px; background: var(--muted); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span></button>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em"><label for="search-a">Search</label></h1>
<div style="position: relative">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--mfg)" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 15px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input id="search-a" type="search" placeholder="Title in English or Ukrainian" value="{{q}}" onChange="{{onQ}}" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 48px 0 42px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); font-size: 16px">
<sc-if value="{{hasQ}}" hint-placeholder-val="{{true}}">
<button type="button" aria-label="Clear search" title="Clear search" onClick="{{clear}}" style="position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 999px; background: var(--muted); color: var(--mfg); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></span></button>
</sc-if>
</div>
<div role="group" aria-label="Category" style="display: flex; gap: 8px">
<button type="button" aria-pressed="true" style="height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center"><span style="height: 36px; padding: 0 14px 0 12px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--pstrong); border-radius: 999px; background: var(--psoft); font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="1.5"></rect><path d="M3 9l1.5-5h16L19 9M9 4l-1.5 5M14 4l-1.5 5M19 4l-1.5 5"></path></svg>Films</span></button>
<button type="button" disabled aria-describedby="books-soon-a" style="height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; color: var(--mfg)"><span style="height: 36px; padding: 0 6px 0 12px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; border: 1.5px dashed var(--border); border-radius: 999px; font-size: 14px; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>Books<span id="books-soon-a" style="padding: 3px 8px; border-radius: 999px; background: var(--muted); font-size: 11px; font-weight: 600">Coming soon</span></span></button>
</div>
</div>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<div style="padding: 32px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; color: var(--mfg)">
<span style="width: 48px; height: 48px; border-radius: 14px; background: var(--muted); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></span>
<p style="margin: 0; font-size: 15px; line-height: 1.45; max-width: 280px">Type a title. Films in your Saved show first, then more from TMDB.</p>
</div>
</sc-if>

<sc-if value="{{hasSv}}" hint-placeholder-val="{{true}}">
<section aria-labelledby="saved-a" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="saved-a" style="margin: 0; display: flex; align-items: baseline; gap: 6px; font-size: 16px; font-weight: 700">In your Saved <span style="font-size: 14px; font-weight: 500; color: var(--mfg)">{{svCount}}</span></h2>
<ul style="margin: 0 -16px; padding: 0 16px 4px; list-style: none; display: flex; gap: 12px; overflow-x: auto">
<sc-for list="{{sv}}" as="f" hint-placeholder-count="4">
<li style="flex-shrink: 0; width: 104px">
<a href="#" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none">
<span style="position: relative; width: 104px; height: 156px; border-radius: 8px; background: {{f.tone}}; overflow: hidden; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box">
<span aria-hidden="true" style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 600; font-size: 13px; line-height: 1.15; color: oklch(0.97 0.01 80)">{{f.t}}</span>
</span>
<span style="font-size: 13px; font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{f.t}}</span>
<span style="margin-top: -3px; display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: {{f.stWeight}}; color: {{f.stColor}}">
<sc-if value="{{f.isStar}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Rating" style="flex-shrink: 0"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.3L12 17.5l-5.6 3 1.1-6.3L3 9.7l6.2-.9z"></path></svg></sc-if>
<sc-if value="{{f.isMark}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></sc-if>
<sc-if value="{{f.isList}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" role="img" aria-label="Collections" style="flex-shrink: 0"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></sc-if>
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.stText}}</span>
</span>
</a>
</li>
</sc-for>
</ul>
</section>
</sc-if>

<sc-if value="{{hasTm}}" hint-placeholder-val="{{true}}">
<section aria-labelledby="tmdb-a" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="tmdb-a" style="margin: 0; display: flex; align-items: baseline; gap: 6px; font-size: 16px; font-weight: 700">From TMDB <span style="font-size: 14px; font-weight: 500; color: var(--mfg)">{{tmCount}}</span></h2>
<ul aria-label="Search results from TMDB" style="margin: 0; padding: 0; list-style: none; border: 1px solid var(--border); border-radius: 14px; background: var(--card)">
<sc-for list="{{tm}}" as="f" hint-placeholder-count="4">
<li style="padding: 12px; display: flex; align-items: flex-start; gap: 12px; border-top: {{f.bt}}">
<span aria-hidden="true" style="width: 72px; height: 108px; flex-shrink: 0; border-radius: 6px; background: {{f.tone}}; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; overflow: hidden"><span style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 600; font-size: 11px; line-height: 1.15; color: oklch(0.97 0.01 80)">{{f.t}}</span></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 600; line-height: 1.3">{{f.t}}</span>
<span style="font-size: 13px; color: var(--mfg)">{{f.year}}</span>
<div style="margin-top: 6px; display: flex; gap: 6px">
<button type="button" style="height: 44px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 10px; background: transparent; font-size: 14px; font-weight: 600; white-space: nowrap">Mark watched</button>
<button type="button" aria-label="Want to watch" title="Want to watch" aria-pressed="{{f.plannedAttr}}" onClick="{{f.plan}}" style="width: 44px; height: 44px; flex-shrink: 0; border: 1px solid {{f.bBorder}}; border-radius: 10px; background: {{f.bBg}}; color: {{f.bFg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{f.bFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></button>
<button type="button" aria-label="Add to collection" title="Add to collection" style="width: 44px; height: 44px; flex-shrink: 0; border: 1px solid var(--border); border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 12H3M16 6H3M16 18H3M18 9v6M21 12h-6"></path></svg></button>
</div>
</div>
</li>
</sc-for>
</ul>
</section>
</sc-if>

<sc-if value="{{noMatch}}" hint-placeholder-val="{{false}}">
<p style="margin: 8px 0 0; font-size: 15px; color: var(--mfg)">No films found.</p>
</sc-if>

<sc-if value="{{hasTerm}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 14px">
<span style="color: var(--mfg)">Can't find it?</span>
<button type="button" style="height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center"><span style="height: 36px; padding: 0 12px; display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--card); font-size: 14px; font-weight: 600">Add manually</span></button>
</div>
</sc-if>
</main>

<div aria-live="polite" style="position: absolute; left: 16px; right: 16px; bottom: 96px; z-index: 20">
<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div style="padding: 4px 4px 4px 14px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); box-shadow: 0 10px 28px var(--shadow); font-size: 14px">
<span style="flex: 1">{{toast}}</span>
<button type="button" aria-label="Dismiss" onClick="{{dismiss}}" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: var(--mfg)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
</div>
</sc-if>
</div>

<nav aria-label="Main" style="flex-shrink: 0; padding: 6px 12px 34px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; background: var(--card); border-top: 1px solid var(--border)">
<a href="#" style="padding: 5px 0; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--mfg); font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Saved</a>
<a href="#" style="padding: 5px 0; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--mfg); font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Collections</a>
<a href="#" aria-current="page" onClick="{{clear}}" style="padding: 5px 0; display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 12px; background: var(--psoft); text-decoration: none; color: var(--pstrong); font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"startOn":{"editor":"enum","options":["empty","results","noMatch"],"default":"results"},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const start = this.props.startOn || 'results';
const startQ = start === 'empty' ? '' : (start === 'noMatch' ? 'prasite' : 'par');
const q = st.q !== undefined ? st.q : startQ;
const planned = st.planned || {};
const tone = (h) => 'oklch(0.42 0.075 ' + h + ')';
const SAVED = [
{ t: 'Parasite', y: 2019, h: 95, r: '5', v: 2, pl: true, lists: ['Korean cinema', 'Favourites', 'Oscar winners'] },
{ t: 'Paris, 13th District', y: 2021, h: 280, pl: true, lists: ['Weekend picks'] },
{ t: 'Paris, Texas', y: 1984, h: 30, lists: ['Road movies'] },
{ t: 'Dune: Part Two', y: 2024, h: 60, r: '4.5', v: 1, lists: [] },
{ t: 'Past Lives', y: 2023, h: 250, pl: true, lists: [] },
{ t: 'Perfect Days', y: 2023, h: 150, pl: true, lists: [] },
{ t: 'Spirited Away', y: 2001, h: 175, r: '4.5', v: 3, lists: ['Favourites'] }
];
const TMDB = [
{ t: 'Paranormal Activity', y: 2007, h: 220 }, { t: 'Paris Is Burning', y: 1990, h: 335 },
{ t: 'The Parallax View', y: 1974, h: 185 }, { t: 'Paranoid Park', y: 2007, h: 140 },
{ t: 'Paris, je t’aime', y: 2006, h: 15 }, { t: 'Jurassic Park', y: 1993, h: 120 }
];
const term = q.trim().toLowerCase();
const hit = (f) => { const s = f.t.toLowerCase(); return term !== '' && (s.indexOf(term) === 0 || s.split(/[^a-z0-9]+/).some((w) => w !== '' && w.indexOf(term) === 0) || (term.indexOf(' ') > 0 && s.indexOf(term) >= 0)); };
const sv = SAVED.filter(hit).map((f) => {
const logged = !!f.r;
let kind = 'list'; let text = f.lists[0] || '';
if (logged) { kind = 'star'; text = f.r + (f.pl ? ' · On Watchlist' : ' · Watched'); }
else if (f.pl) { kind = 'mark'; text = 'On Watchlist'; }
return Object.assign({}, f, { tone: tone(f.h), isStar: kind === 'star', isMark: kind === 'mark', isList: kind === 'list', stText: text, stColor: kind === 'star' ? 'var(--pstrong)' : 'var(--mfg)', stWeight: kind === 'star' ? '600' : '500' });
});
const tm = TMDB.filter(hit).map((f, i) => {
const on = !!planned[f.t];
return Object.assign({}, f, {
tone: tone(f.h), year: String(f.y), bt: i === 0 ? '0' : '1px solid var(--border)',
plannedAttr: on ? 'true' : 'false', bBorder: on ? 'var(--pstrong)' : 'var(--border)', bBg: on ? 'var(--psoft)' : 'transparent', bFg: on ? 'var(--pstrong)' : 'var(--fg)', bFill: on ? 'currentColor' : 'none',
plan: () => { const p = Object.assign({}, planned); p[f.t] = !on; this.setState({ planned: p, toast: on ? 'Took ' + f.t + ' off your Watchlist.' : 'Put ' + f.t + ' on your Watchlist.' }); }
});
});
return {
themeClass: this.props.dark ? 'dark' : '',
q, hasQ: q !== '', hasTerm: term !== '', isEmpty: term === '',
onQ: (e) => this.setState({ q: e.target.value, toast: null }),
clear: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ q: '', toast: null }); },
sv, hasSv: sv.length > 0, svCount: sv.length,
tm, hasTm: tm.length > 0, tmCount: tm.length,
noMatch: term !== '' && sv.length === 0 && tm.length === 0,
toast: st.toast || '', hasToast: !!st.toast, dismiss: () => this.setState({ toast: null })
};
}
}
</script>
</body>
</html>
