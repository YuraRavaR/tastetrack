<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo B, monogram: link card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tt{--bg:oklch(0.97 0.012 80);--fg:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--mfg:oklch(0.47 0.02 60);--pri:oklch(0.82 0.16 88);--pfg:oklch(0.22 0.02 60);--pstrong:oklch(0.52 0.11 80);--border:oklch(0.88 0.015 75)}
</style>
</helmet>
<div class="tt" style="width: 1200px; height: 630px; box-sizing: border-box; padding: 88px 96px; display: flex; flex-direction: column; justify-content: center; gap: 40px; background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased">
<div style="display: flex; align-items: center; gap: 40px">
<svg width="168" height="168" viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="8" style="fill: var(--pri)"></rect><text x="15.4" y="24.2" text-anchor="middle" style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 600; font-size: 23px; fill: var(--pfg)">T</text></svg>
<span style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 600; font-size: 120px; letter-spacing: -0.02em; line-height: 1">Taste<span style="color: var(--pstrong)">Track</span></span>
</div>
<p style="margin: 0; padding-left: 208px; font-size: 36px; line-height: 1.3; color: var(--mfg)">Your Watchlist, your Ratings, your Collections.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":630}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
