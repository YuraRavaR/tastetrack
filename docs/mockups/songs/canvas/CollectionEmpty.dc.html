<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collections of songs and their empty states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.tt{--bg:oklch(0.18 0.01 60);--fg:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--pri:oklch(0.84 0.16 90);--prif:oklch(0.17 0.006 50);--strong:oklch(0.84 0.16 90);--soft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--mf:oklch(0.74 0.02 70);--bd:oklch(1 0 0 / 11%);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.tt.light{--bg:oklch(0.97 0.012 80);--fg:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--pri:oklch(0.82 0.16 88);--prif:oklch(0.22 0.02 60);--strong:oklch(0.52 0.11 80);--soft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--mf:oklch(0.47 0.02 60);--bd:oklch(0.88 0.015 75)}
.tt *{box-sizing:border-box}
.col{width:1290px;display:flex;flex-wrap:wrap;gap:40px 60px;align-items:flex-start}
.cap{font:600 15px ui-sans-serif,system-ui,sans-serif;color:#8a8378;height:26px}
.scr{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:16px}
.phone{width:390px;min-height:700px}.web{width:615px;padding:20px 24px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.01em}
.small{font-size:24px;font-weight:600}
.back{height:36px;display:flex;align-items:center;gap:4px;color:var(--mf);font-size:14px;text-decoration:none}
.new{height:44px;flex:none;padding:0 18px;border:0;border-radius:999px;background:var(--pri);color:var(--prif);font:inherit;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.new.out{border:1px solid var(--bd);background:var(--card);color:inherit}
.seg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;background:var(--muted);border:0;border-radius:14px;padding:4px;margin:0;min-width:0}
.chip{height:56px;min-width:0;padding:0;border:0;border-radius:10px;background:none;color:inherit;font:inherit;font-size:13px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.chip.on{background:var(--card);font-weight:600}
.chip.on svg{color:var(--strong)}
.empty{display:flex;flex-direction:column;align-items:center;gap:16px;padding:72px 16px 40px;text-align:center}
.circle{width:56px;height:56px;border-radius:999px;background:var(--soft);color:var(--strong);display:flex;align-items:center;justify-content:center}
.circle svg{width:24px;height:24px}
.msg{margin:0;max-width:300px;font-size:16px;line-height:1.4}
.web .msg{max-width:none;font-size:17px}
.act{height:48px;padding:0 22px;border:0;border-radius:12px;background:var(--pri);color:var(--prif);font:inherit;font-size:15px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
.lc{display:flex;flex-direction:column;gap:8px;text-decoration:none}
.collage{aspect-ratio:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:2px;border-radius:18px;overflow:hidden}
.collage>span{min-height:0;position:relative;background:var(--muted);display:flex;align-items:center;justify-content:center}
.collage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.collage .ph{background:var(--soft);color:var(--strong)}
.collage .ph::after{content:"";position:absolute;inset:5px;border:1px solid color-mix(in oklch,var(--strong) 45%,transparent);border-radius:3px}
.collage .ph svg{width:26px;height:26px}
.lc b{font-size:16px;font-weight:600;line-height:1.35}
.lm{font-size:14px;color:var(--mf);display:flex;align-items:center;gap:6px}
.lm svg{width:14px;height:14px}
</style>
</helmet>
<div style="width: 2660px; display: flex; gap: 80px; align-items: flex-start">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="{{th.cls}}">
<div class="col">
<sc-for list="{{screens}}" as="s" hint-placeholder-count="5">
<div>
<div class="cap">{{s.cap}}</div>
<div class="{{s.box}}">
<sc-if value="{{s.inside}}" hint-placeholder-val="{{false}}">
<a class="back" href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>All Collections</a>
<div class="top"><h1 class="h1 small">For the road</h1><button class="new out"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>Add songs</button></div>
</sc-if>
<sc-if value="{{s.index}}" hint-placeholder-val="{{true}}">
<div class="top"><h1 class="h1">Collections</h1><button class="{{s.newCls}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>New collection</button></div>
<fieldset class="seg" aria-label="Category">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6"><button class="{{c.cls}}" aria-pressed="{{c.on}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{c.d}}"></path></svg>{{c.name}}</button></sc-for>
</fieldset>
</sc-if>
<sc-if value="{{s.msg}}" hint-placeholder-val="{{true}}">
<div class="empty">
<span class="circle"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{s.icon}}"></path></svg></span>
<p class="msg">{{s.msg}}</p>
<button class="act">{{s.act}}</button>
</div>
</sc-if>
<sc-if value="{{s.cards}}" hint-placeholder-val="{{false}}">
<div class="cards">
<sc-for list="{{lists}}" as="l" hint-placeholder-count="2">
<a class="lc" href="#">
<span class="collage" aria-hidden="true">
<sc-for list="{{l.cells}}" as="c" hint-placeholder-count="4"><span class="{{c.cls}}"><sc-if value="{{c.src}}" hint-placeholder-val="{{true}}"><img src="{{c.src}}" alt=""></sc-if><sc-if value="{{c.none}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{note}}"></path></svg></sc-if></span></sc-for>
</span>
<b>{{l.name}}</b>
<span class="lm"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{note}}"></path></svg>{{l.count}}</span>
</a>
</sc-for>
</div>
</sc-if>
</div>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2660,"height":1650}}'>

['Games', 'M6 11h4M8 9v4M15 12h.01M18 10h.01M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z'],

{ name: 'For the road', count: '8 songs', cells: cells('/_blob/06ca7ed40865217f26999bbfe64e6747', '/_blob/58597f3a9c4f1c1fb2e8d4b05165edcd', '/_blob/c98f1491c4ad4c8b74293faec19f3c6e', '') }

</script>
</body>
</html>
