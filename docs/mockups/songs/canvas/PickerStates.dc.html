<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The picker, making a Collection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.tt{--bg:oklch(0.18 0.01 60);--fg:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--pri:oklch(0.84 0.16 90);--prif:oklch(0.17 0.006 50);--strong:oklch(0.84 0.16 90);--soft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--mf:oklch(0.74 0.02 70);--bd:oklch(1 0 0 / 11%);--inp:oklch(1 0 0 / 15%);--over:oklch(0 0 0 / 60%);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.tt.light{--bg:oklch(0.97 0.012 80);--fg:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--pri:oklch(0.82 0.16 88);--prif:oklch(0.22 0.02 60);--strong:oklch(0.52 0.11 80);--soft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--mf:oklch(0.47 0.02 60);--bd:oklch(0.88 0.015 75);--inp:oklch(0.85 0.015 75);--over:oklch(0.2 0.01 50 / 50%)}
.tt *{box-sizing:border-box}
.col{width:1290px;display:flex;flex-wrap:wrap;gap:36px 60px;align-items:flex-start}
.cap{font:600 15px ui-sans-serif,system-ui,sans-serif;color:#8a8378;height:26px}
.scr{position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:20px;background:var(--bg)}
.phone{width:390px;height:690px}
.web{width:560px;height:430px}
.dim{position:absolute;inset:0;background:var(--over)}
.dlg{position:absolute;background:var(--bg);border:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.phone .dlg{left:16px;right:16px;top:128px;border-radius:14px}
.web .dlg{width:480px;left:40px;top:24px;border-radius:14px}
.hd{display:flex;gap:8px;align-items:flex-start;padding:18px 10px 8px 20px}
.hd div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-top:4px}
.hd h2{margin:0;font-size:20px;line-height:1.2;font-weight:700}
.hd p{margin:0;font-size:14px;color:var(--mf);line-height:1.35}
.x{width:44px;height:44px;border:0;border-radius:999px;background:none;color:var(--mf);display:flex;align-items:center;justify-content:center}
.back{margin-left:-12px;color:inherit}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bd{padding:8px 20px 18px;display:flex;flex-direction:column;gap:12px}
.intro{margin:0;font-size:15px;line-height:1.4}
.lb{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:500}
.lb input{height:44px;border:1px solid var(--inp);outline:3px solid color-mix(in oklch,var(--strong) 35%,transparent);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;font-size:16px;padding:0 12px}
.lb input::placeholder{color:var(--mf)}
.pick{min-height:48px;width:100%;padding:4px 0;border:0;background:none;color:inherit;font:inherit;font-size:15px;text-align:left;display:flex;align-items:center;gap:12px}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-weight:600}
.ck{width:20px;height:20px;flex:none;border:1px solid var(--mf);border-radius:6px;display:flex;align-items:center;justify-content:center}
.ck.on{background:var(--pri);border-color:var(--pri);color:var(--prif)}
.ck svg{width:14px;height:14px}
.off svg{display:none}
.err{margin:0;font-size:14px;line-height:1.35;color:oklch(0.66 0.2 22)}
.light .err{color:oklch(0.46 0.18 25)}
.ft{border-top:1px solid var(--bd);padding:12px 20px;display:flex;justify-content:flex-end}
.main{height:50px;width:100%;border:0;border-radius:12px;background:var(--pri);color:var(--prif);font:inherit;font-size:16px;font-weight:600}
.web .main{height:40px;width:auto;padding:0 18px;font-size:14px}
</style>
</helmet>
<div style="width: 2660px; display: flex; gap: 80px; align-items: flex-start">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="{{th.cls}}">
<div class="col">
<sc-for list="{{screens}}" as="s" hint-placeholder-count="5">
<div>
<div class="cap">{{s.cap}}</div>
<div class="{{s.box}}">
<div class="dim"></div>
<section class="dlg" aria-label="{{s.title}}">
<header class="hd">
<sc-if value="{{s.back}}" hint-placeholder-val="{{false}}"><button class="x back" aria-label="Back to your Collections"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button></sc-if>
<div><h2>{{s.title}}</h2><p>{{s.sub}}</p></div>
<button class="x" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</header>
<div class="bd">
<sc-if value="{{s.first}}" hint-placeholder-val="{{false}}"><p class="intro">You have no Collections of songs yet. Make one, and this song goes into it.</p></sc-if>
<sc-if value="{{s.form}}" hint-placeholder-val="{{true}}"><label class="lb">Name<input value="{{s.value}}" placeholder="Favourite songs"></label></sc-if>
<sc-if value="{{s.error}}" hint-placeholder-val="{{false}}"><p class="err" role="alert">{{s.error}}</p></sc-if>
<sc-if value="{{s.list}}" hint-placeholder-val="{{false}}">
<sc-for list="{{lists}}" as="l" hint-placeholder-count="3"><button class="pick" role="checkbox" aria-checked="{{l.on}}"><span class="{{l.ck}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span class="nm">{{l.name}}</span></button></sc-for>
<button class="pick" style="color: var(--strong); font-weight: 600"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>New collection</button>
</sc-if>
</div>
<footer class="ft"><button class="main">{{s.act}}</button></footer>
</section>
</div>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2660,"height":1400}}'>
class Component extends DCLogic {
renderVals() {
const list = (name, on) => ({ name, on: !!on, ck: on ? 'ck on' : 'ck off' });
const title = 'Collections for Шум (2021)';
const first = { title, sub: '', first: true, form: true, value: '', act: 'Create and add' };
const inside = { title: 'New collection', sub: '', back: true, form: true, value: 'Late night', act: 'Create and add' };
const made = { title, sub: 'Tick a Collection to add the song, untick it to take the song off.', list: true, act: 'Done' };
return {
themes: [{ cls: 'tt dark' }, { cls: 'tt light' }],
lists: [
list('Late night', true),
list('For the road'),
list('Favourite songs'),
list('Songs to show a friend')
],
screens: [
{ ...first, cap: 'None yet · offered at once', box: 'scr phone' },
{ ...inside, cap: 'New collection, inside the picker', box: 'scr phone' },
{ ...made, cap: 'Made: first, and already ticked', box: 'scr phone' },
{ ...first, cap: 'None yet · web', box: 'scr web' },
{ ...inside, cap: 'The name is taken by a Collection of albums · web', box: 'scr web', value: 'Ukrainian rock', error: 'You already have a Collection of albums with this name.' }
]
};
}
}
</script>
</body>
</html>
