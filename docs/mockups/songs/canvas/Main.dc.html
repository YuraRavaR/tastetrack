<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Six Media Type chips</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.tt{--bg:oklch(0.18 0.01 60);--fg:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--pri:oklch(0.84 0.16 90);--prif:oklch(0.17 0.006 50);--strong:oklch(0.84 0.16 90);--soft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--mf:oklch(0.74 0.02 70);--bd:oklch(1 0 0 / 11%);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.tt.light{--bg:oklch(0.97 0.012 80);--fg:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--pri:oklch(0.82 0.16 88);--prif:oklch(0.22 0.02 60);--strong:oklch(0.52 0.11 80);--soft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--mf:oklch(0.47 0.02 60);--bd:oklch(0.88 0.015 75)}
.tt *{box-sizing:border-box}
.col{width:1290px;display:flex;flex-wrap:wrap;gap:40px 60px;align-content:flex-start}
.cap{font:600 15px ui-sans-serif,system-ui,sans-serif;color:#8a8378;height:26px}
.box{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.phone{width:390px}.narrow{width:320px}.wide{width:816px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;justify-content:space-between}
.h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em}
.field{height:48px;border:1px solid var(--bd);background:var(--card);border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:16px;color:var(--mf)}
.new{height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--pri);color:var(--prif);font:inherit;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.chips{border:0;margin:0;min-width:0}
.seg,.two{display:grid;gap:2px;background:var(--muted);border-radius:14px;padding:4px}
.seg{grid-template-columns:repeat(6,minmax(0,1fr))}
.two{grid-template-columns:repeat(3,minmax(0,1fr))}
.wide .two{grid-template-columns:repeat(6,minmax(0,1fr))}
.chip{border:0;background:none;color:inherit;font:inherit;font-weight:500;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.seg .chip,.two .chip{height:56px;min-width:0;padding:0;flex-direction:column;gap:3px;font-size:13px;border-radius:10px}
.narrow .seg .chip{font-size:12px}
.seg .on,.two .on{background:var(--card);font-weight:600;box-shadow:0 1px 3px oklch(0 0 0 / 18%)}
.seg .on svg,.two .on svg{color:var(--strong)}
.pills{display:flex;gap:8px;padding:0;overflow:hidden;margin-right:-16px}
.pills .chip{height:44px;flex:none;padding:0 14px;gap:7px;font-size:14px;border:1px solid var(--bd);background:var(--card);border-radius:999px}
.pills .on{background:var(--soft);border-color:var(--strong);color:var(--strong);font-weight:600}
</style>
</helmet>
<div style="width: 2660px; display: flex; gap: 80px; align-items: flex-start">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="{{th.cls}}">
<div class="col">
<sc-for list="{{screens}}" as="s" hint-placeholder-count="10">
<div>
<div class="cap">{{s.cap}}</div>
<div class="{{s.box}}">
<sc-if value="{{s.search}}" hint-placeholder-val="{{true}}">
<h1 class="h1">Search</h1>
<label class="field"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16zM21 21l-4.3-4.3"></path></svg><span>Song and artist</span></label>
<fieldset class="{{s.kind}}" aria-label="Category">
<sc-for list="{{onSongs}}" as="c" hint-placeholder-count="6"><button class="{{c.cls}}" aria-pressed="{{c.on}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{c.d}}"></path></svg>{{c.name}}</button></sc-for>
</fieldset>
</sc-if>
<sc-if value="{{s.collections}}" hint-placeholder-val="{{true}}">
<div class="top"><h1 class="h1">Collections</h1><button class="new"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>New collection</button></div>
<fieldset class="{{s.kind}}" aria-label="Category">
<sc-for list="{{onFilms}}" as="c" hint-placeholder-count="6"><button class="{{c.cls}}" aria-pressed="{{c.on}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{c.d}}"></path></svg>{{c.name}}</button></sc-for>
</fieldset>
</sc-if>
</div>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2660,"height":1600}}'>
class Component extends DCLogic {
renderVals() {
const types = [
['Films', 'M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3ZM6.2 5.3l3.1 3.9M12.4 3.4l3.1 4M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z'],
['Books', 'M12 7v14M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z'],
['Series', 'M4 7h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM17 2l-5 5-5-5'],
['Games', 'M6 11h4M8 9v4M15 12h.01M18 10h.01M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z'],
['Albums', 'M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20zM12 10a2 2 0 1 0 0 4a2 2 0 1 0 0-4zM6 12c0-1.7.7-3.2 1.8-4.2M18 12c0 1.7-.7 3.2-1.8 4.2'],
['Songs', 'M9 18V5l12-2v13M6 15a3 3 0 1 0 0 6a3 3 0 1 0 0-6zM18 13a3 3 0 1 0 0 6a3 3 0 1 0 0-6z']
];
const chips = (current) => types.map(([name, d]) => ({ name, d, on: name === current, cls: name === current ? 'chip on' : 'chip' }));
const variants = [['A · six equal segments', 'chips seg'], ['B · two rows of three', 'chips two'], ['C · a scrolling row of pills', 'chips pills']];
return {
themes: [{ cls: 'tt dark' }, { cls: 'tt light' }],
onSongs: chips('Songs'),
onFilms: chips('Films'),
screens: [
...variants.map(([cap, kind]) => ({ cap, kind, box: 'box phone', search: true, collections: true })),
{ cap: 'A at 320 px · 12 px labels', kind: 'chips seg', box: 'box narrow', search: true },
{ cap: 'A and B on the web · one row, the 784 px Search column', kind: 'chips two', box: 'box wide', search: true },
{ cap: 'C on the web', kind: 'chips pills', box: 'box wide', search: true },
{ cap: 'A and B on the web · Collections', kind: 'chips seg', box: 'box wide', collections: true }
]
};
}
}
</script>
</body>
</html>
