<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>No-poster placeholder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="No poster" style="box-sizing: border-box; width: {{w}}px; height: {{h}}px; border-radius: {{r}}px; padding: 10px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; background: oklch(0.95 0.006 60); color: oklch(0.5 0.015 50); font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">

<sc-if value="{{k1}}" hint-placeholder-val="{{false}}">
<svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14l-1.5 12h-11z"></path><path d="M9.5 9l.5 12M14.5 9l-.5 12"></path><circle cx="9" cy="5.5" r="1.2"></circle><circle cx="15.5" cy="4.5" r="1"></circle></svg>
<sc-if value="{{caption}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 12px; line-height: 16px">Eaten with the popcorn.</p></sc-if>
</sc-if>

<sc-if value="{{k2}}" hint-placeholder-val="{{false}}">
<svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20V10a6 6 0 0 1 12 0v10l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5z"></path><circle cx="10" cy="10.5" r="0.9" fill="currentColor"></circle><circle cx="14" cy="10.5" r="0.9" fill="currentColor"></circle><path d="M10.5 14.5q1.5-1.2 3 0"></path></svg>
<sc-if value="{{caption}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 12px; line-height: 16px">This poster is a ghost.</p></sc-if>
</sc-if>

<sc-if value="{{k3}}" hint-placeholder-val="{{false}}">
<svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="1.5"></rect><path d="M3 9l1.5-5h16L19 9"></path><path d="M9 4l-1.5 5M14 4l-1.5 5M19 4l-1.5 5"></path></svg>
<sc-if value="{{caption}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 12px; line-height: 16px">Still in makeup.</p></sc-if>
</sc-if>

<sc-if value="{{k4}}" hint-placeholder-val="{{false}}">
<svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="11" r="7"></circle><circle cx="10" cy="7.5" r="1.4"></circle><circle cx="10" cy="14.5" r="1.4"></circle><circle cx="6.5" cy="11" r="1.4"></circle><circle cx="13.5" cy="11" r="1.4"></circle><path d="M10 18c4 0 6 2.5 11 2"></path></svg>
<sc-if value="{{caption}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 12px; line-height: 16px">Lost in the projector.</p></sc-if>
</sc-if>

<sc-if value="{{k5}}" hint-placeholder-val="{{false}}">
<svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"></circle><path d="M15 15l5.5 5.5"></path><path d="M8.4 8.4a1.7 1.7 0 1 1 2.4 1.5c-.5.3-.8.6-.8 1.2"></path><circle cx="10" cy="13" r="0.5" fill="currentColor"></circle></svg>
<sc-if value="{{caption}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 12px; line-height: 16px">404: poster not found.</p></sc-if>
</sc-if>

<sc-if value="{{k6}}" hint-placeholder-val="{{false}}">
<svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="13" r="8"></circle><path d="M7 12q1.5 1.5 3 0M12 12q1.5 1.5 3 0"></path><path d="M9.5 16.5h3"></path><path d="M17 2.5h3.5l-3.5 3.5h3.5"></path></svg>
<sc-if value="{{caption}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 12px; line-height: 16px">The poster is napping.</p></sc-if>
</sc-if>

<sc-if value="{{k7}}" hint-placeholder-val="{{false}}">
<svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-9L4 4l4.5 3.5h7L20 4l-1 7v9z"></path><circle cx="9.5" cy="13" r="0.9" fill="currentColor"></circle><circle cx="14.5" cy="13" r="0.9" fill="currentColor"></circle><path d="M11.3 16h1.4M2 15.5h4M2 18h4M18 15.5h4M18 18h4"></path></svg>
<sc-if value="{{caption}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 12px; line-height: 16px">The cat knocked it down.</p></sc-if>
</sc-if>

<sc-if value="{{k8}}" hint-placeholder-val="{{false}}">
<svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg>
<sc-if value="{{caption}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 12px; line-height: 16px">Flew off to Cannes.</p></sc-if>
</sc-if>

<sc-if value="{{k9}}" hint-placeholder-val="{{false}}">
<svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"></path></svg>
<sc-if value="{{caption}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 12px; line-height: 16px">Imagine something great.</p></sc-if>
</sc-if>

<sc-if value="{{k10}}" hint-placeholder-val="{{false}}">
<svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9h20"></path><path d="M3 9l1 5a2 2 0 0 0 2 1.6h2.5a2 2 0 0 0 2-1.6L11 9M13 9l.5 5a2 2 0 0 0 2 1.6H18a2 2 0 0 0 2-1.6L21 9"></path><path d="M10 19.5q2 1.5 4 0"></path></svg>
<sc-if value="{{caption}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 12px; line-height: 16px">Poster went incognito.</p></sc-if>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"n":{"editor":"int","default":1,"min":1,"max":10},"w":{"editor":null,"default":112},"h":{"editor":null,"default":168},"r":{"editor":null,"default":6},"$preview":{"width":112,"height":168}}'>
class Component extends DCLogic {
renderVals() {
const raw = Math.round(Number(this.props.n ?? 1));
const n = raw >= 1 && raw <= 10 ? raw : 1;
const w = Number(this.props.w ?? 112);
const h = Number(this.props.h ?? 168);
const vals = {
w: w, h: h, r: Number(this.props.r ?? 6),
icon: Math.max(20, Math.min(56, Math.round(Math.min(w, h) * 0.34))),
caption: h >= 140 || w >= 240
};
for (let i = 1; i <= 10; i++) vals['k' + i] = i === n;
return vals;
}
}
</script>
</body>
</html>
