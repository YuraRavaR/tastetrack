.tl{font-size:12px;color:var(--muted-foreground)}

.btn.p{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tab{min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:18px;font-size:12px;font-weight:500;color:var(--muted-foreground);text-decoration:none}
.tab .ic{width:24px;height:24px}
.wm{font-family:Sora,sans-serif;font-weight:700;font-size:16px;line-height:0.93;letter-spacing:-0.04em}
