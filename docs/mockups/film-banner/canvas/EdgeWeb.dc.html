<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · web · edge cases</title>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.tt{--background:oklch(0.18 0.01 60);--foreground:oklch(0.96 0.004 75);--card:oklch(0.22 0.012 60);--primary:oklch(0.84 0.16 90);--primary-foreground:oklch(0.17 0.006 50);--primary-soft:oklch(0.31 0.034 85);--muted:oklch(0.28 0.014 60);--muted-foreground:oklch(0.74 0.02 70);--border:oklch(1 0 0 / 11%);--ink:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--foreground)}
.tt[data-theme=light]{--background:oklch(0.97 0.012 80);--foreground:oklch(0.2 0.01 50);--card:oklch(0.995 0.006 85);--primary:oklch(0.82 0.16 88);--primary-foreground:oklch(0.22 0.02 60);--primary-soft:oklch(0.96 0.037 87);--muted:oklch(0.935 0.016 75);--muted-foreground:oklch(0.47 0.02 60);--border:oklch(0.88 0.015 75);--ink:oklch(0.22 0.02 60)}
.cap{height:28px;font-size:13px;font-weight:600;color:oklch(0.6 0.02 70)}
.tile{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tl{font-size:13px;color:var(--muted-foreground)}
.tv{font-size:20px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn{height:44px;padding:0 16px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:15px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--foreground)}
.btn.p{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nl{height:36px;display:flex;align-items:center;padding:0 14px;border-radius:14px;color:var(--muted-foreground);text-decoration:none;font-weight:500;font-size:15px}
.wm{font-family:Sora,sans-serif;font-weight:700;font-size:17px;line-height:0.93;letter-spacing:-0.04em}
.vrow{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:6px 6px 6px 18px;display:flex;align-items:center;gap:12px;font-size:15px}
.ph{width:176px;height:264px;border-radius:14px;border:1px solid var(--border);background:var(--muted);color:var(--muted-foreground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;flex:none;box-shadow:0 12px 32px oklch(0 0 0 / 25%);text-align:center;padding:0 16px;box-sizing:border-box}
.fade{-webkit-mask-image:linear-gradient(to right,rgba(0,0,0,0) 0%,rgba(0,0,0,0.08) 3%,rgba(0,0,0,0.25) 6%,rgba(0,0,0,0.5) 9%,rgba(0,0,0,0.75) 12%,rgba(0,0,0,0.92) 15%,#000 18%,#000 82%,rgba(0,0,0,0.92) 85%,rgba(0,0,0,0.75) 88%,rgba(0,0,0,0.5) 91%,rgba(0,0,0,0.25) 94%,rgba(0,0,0,0.08) 97%,rgba(0,0,0,0) 100%),linear-gradient(to bottom,rgba(0,0,0,0.6) 0%,rgba(0,0,0,0.9) 4%,#000 8%,#000 45%,rgba(0,0,0,0.95) 54%,rgba(0,0,0,0.82) 63%,rgba(0,0,0,0.62) 72%,rgba(0,0,0,0.4) 81%,rgba(0,0,0,0.18) 90%,rgba(0,0,0,0.05) 96%,rgba(0,0,0,0) 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,rgba(0,0,0,0) 0%,rgba(0,0,0,0.08) 3%,rgba(0,0,0,0.25) 6%,rgba(0,0,0,0.5) 9%,rgba(0,0,0,0.75) 12%,rgba(0,0,0,0.92) 15%,#000 18%,#000 82%,rgba(0,0,0,0.92) 85%,rgba(0,0,0,0.75) 88%,rgba(0,0,0,0.5) 91%,rgba(0,0,0,0.25) 94%,rgba(0,0,0,0.08) 97%,rgba(0,0,0,0) 100%),linear-gradient(to bottom,rgba(0,0,0,0.6) 0%,rgba(0,0,0,0.9) 4%,#000 8%,#000 45%,rgba(0,0,0,0.95) 54%,rgba(0,0,0,0.82) 63%,rgba(0,0,0,0.62) 72%,rgba(0,0,0,0.4) 81%,rgba(0,0,0,0.18) 90%,rgba(0,0,0,0.05) 96%,rgba(0,0,0,0) 100%);mask-composite:intersect}
</style>
</helmet>
<div class="tt" data-theme="dark" style="width: 2600px; height: 3344px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; align-content: start">
<sc-for list="{{cases}}" as="c" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column">
<div class="cap">{{c.label}}</div>
<div class="tt" data-theme="{{c.theme}}" style="width: 1280px; height: 1060px; position: relative; overflow: hidden; background: var(--background)">
<header style="background: var(--card); border-bottom: 1px solid var(--border)">
<div style="max-width: 1152px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; gap: 28px">
<a href="#" aria-label="TasteTrack" style="display: flex; align-items: center; gap: 8px; text-decoration: none">
<svg viewBox="0 0 32 32" width="36" height="36" aria-hidden="true" style="color: var(--ink)"><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(-14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" transform="rotate(14 16 25.5)" style="fill: var(--primary-soft); stroke: currentColor; stroke-width: 1.75"></rect><rect x="9.5" y="6.5" width="13" height="19" rx="2.5" style="fill: var(--primary); stroke: currentColor; stroke-width: 1.75"></rect><path d="M16 11.5L16.94 14.21L19.8 14.26L17.52 15.99L18.35 18.74L16 17.1L13.65 18.74L14.48 15.99L12.2 14.26L15.06 14.21Z" style="fill: var(--primary-foreground)"></path></svg>
<span class="wm">Taste<br>Track</span>
</a>
<nav aria-label="Sections" style="display: flex; gap: 4px"><a href="#" class="nl">Saved</a><a href="#" class="nl">Collections</a><a href="#" class="nl">Search</a></nav>
<button aria-label="Account menu" style="margin-left: auto; display: flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--foreground); font: inherit; font-size: 15px; font-weight: 500"><span style="width: 36px; height: 36px; border-radius: 999px; background: var(--muted); display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></span>admin<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
</header>

<main style="width: 100%; max-width: 1008px; margin: 0 auto; padding: 24px 24px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<sc-if value="{{c.heroImg}}" hint-placeholder-val="{{true}}">
<div class="fade" style="position: relative; aspect-ratio: 16 / 9; overflow: hidden">
<img src="{{c.heroSrc}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block; {{c.heroExtra}}">
</div>
</sc-if>

<div style="display: flex; align-items: flex-end; gap: 28px; margin-top: {{c.rowMargin}}; position: relative; padding: 0 24px">
<sc-if value="{{c.hasPoster}}" hint-placeholder-val="{{true}}">
<img src="/_blob/e0e99a22a9e1031304e9477fd260f70b" alt="Spirit: Stallion of the Cimarron poster" style="width: 176px; height: 264px; object-fit: cover; border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 12px 32px oklch(0 0 0 / 35%); flex: none">
</sc-if>
<sc-if value="{{c.noPoster}}" hint-placeholder-val="{{false}}">
<div class="ph" role="img" aria-label="No poster"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 56px; height: 56px; stroke-width: 1.5"><path d="M18 8a2 2 0 0 0 0-4 2 2 0 0 0-4 0 2 2 0 0 0-4 0 2 2 0 0 0-4 0 2 2 0 0 0 0 4"></path><path d="M10 22 9 8"></path><path d="m14 22 1-14"></path><path d="M20 8c.5 0 .9.4.8 1l-2.6 12c-.1.5-.7 1-1.2 1H7c-.6 0-1.1-.4-1.2-1L3.2 9c-.1-.6.3-1 .8-1Z"></path></svg><span aria-hidden="true" style="font-size: 12px">Eaten with the popcorn.</span></div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; padding-bottom: 4px">
<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.12">Spirit: Stallion of the Cimarron (2002)</h1>
<p style="margin: 2px 0 0; font-size: 15px; font-weight: 600; color: var(--muted-foreground)">Спіріт – душа прерій</p>
<p style="margin: 4px 0 0; font-size: 15px; color: var(--muted-foreground)">83 min · Adventure, Animation, Drama, Family, Western</p>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 20px; padding: 0 24px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<div class="tile"><span class="tl">Watched</span><span class="tv">Once</span></div>
<div class="tile"><span class="tl">Your rating</span><span class="tv"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill: var(--primary)"><path d="M11.5 2.3a.53.53 0 0 1 .95 0l2.3 4.7a2.1 2.1 0 0 0 1.6 1.16l5.17.75a.53.53 0 0 1 .3.9l-3.74 3.64a2.1 2.1 0 0 0-.61 1.88l.88 5.14a.53.53 0 0 1-.77.56l-4.62-2.43a2.1 2.1 0 0 0-1.97 0L6.4 21a.53.53 0 0 1-.77-.56l.88-5.14a2.1 2.1 0 0 0-.61-1.88L2.16 9.8a.53.53 0 0 1 .3-.9l5.16-.76A2.1 2.1 0 0 0 9.2 7z"></path></svg>3.5</span></div>
<div class="tile"><span class="tl">First watched</span><span class="tv">–</span></div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button class="btn p"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Watched again</button>
<button class="btn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>Want to watch</button>
<button class="btn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 12H3"></path><path d="M16 6H3"></path><path d="M16 18H3"></path><path d="M18 9v6"></path><path d="M21 12h-6"></path></svg>Add to collection</button>
</div>

<h2 style="margin: 8px 0 -8px; font-size: 20px; font-weight: 600">Viewings</h2>
<div class="vrow"><span style="font-weight: 500">No date</span><span style="display: flex; align-items: center; gap: 4px; color: var(--muted-foreground)"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill: var(--primary)"><path d="M11.5 2.3a.53.53 0 0 1 .95 0l2.3 4.7a2.1 2.1 0 0 0 1.6 1.16l5.17.75a.53.53 0 0 1 .3.9l-3.74 3.64a2.1 2.1 0 0 0-.61 1.88l.88 5.14a.53.53 0 0 1-.77.56l-4.62-2.43a2.1 2.1 0 0 0-1.97 0L6.4 21a.53.53 0 0 1-.77-.56l.88-5.14a2.1 2.1 0 0 0-.61-1.88L2.16 9.8a.53.53 0 0 1 .3-.9l5.16-.76A2.1 2.1 0 0 0 9.2 7z"></path></svg>3.5</span><button aria-label="Actions for No date" style="margin-left: auto; width: 44px; height: 44px; border: 0; border-radius: 10px; background: none; color: var(--muted-foreground); display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg></button></div>
</div>
</main>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2600,"height":3344}}'>
class Component extends DCLogic {

const backdrop = '/_blob/ba66c1e0f0011df063ce2f712a157ff0';
const poster = '/_blob/e0e99a22a9e1031304e9477fd260f70b';
const blur = 'filter: blur(36px) saturate(1.3); transform: scale(1.25);';
return {
cases: [
{ label: 'Light theme', theme: 'light', heroImg: true, heroSrc: backdrop, heroExtra: '', rowMargin: '-172px', hasPoster: true, noPoster: false },

{ label: 'No backdrop, no poster', theme: 'dark', heroImg: false, heroSrc: '', heroExtra: '', rowMargin: '8px', hasPoster: false, noPoster: true }
]
};
}
}
</script>
