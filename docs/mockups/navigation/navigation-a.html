<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Navigation, variant A</title>
<!--
  Static mockup of home and the app's navigation once there is more than one Media Type,
  variant A "by section". Colours copy the tokens in src/client/styles.css; dark mode follows
  the system setting. Below md the sections sit in a bottom tab bar; from md they move into
  the header. The type picker, the Up next tabs and the account menu work.
-->
<style>
:root {
  --background: oklch(0.985 0.002 75);
  --foreground: oklch(0.2 0.01 50);
  --card: oklch(1 0 0);
  --primary: oklch(0.5 0.17 25);
  --secondary-foreground: oklch(0.25 0.01 50);
  --muted: oklch(0.95 0.006 60);
  --muted-foreground: oklch(0.5 0.015 50);
  --border: oklch(0.9 0.008 60);
  --shadow: oklch(0.2 0.01 50 / 14%);
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: oklch(0.17 0.006 50);
    --foreground: oklch(0.96 0.004 75);
    --card: oklch(0.21 0.007 50);
    --primary: oklch(0.68 0.16 25);
    --secondary-foreground: oklch(0.96 0.004 75);
    --muted: oklch(0.27 0.008 50);
    --muted-foreground: oklch(0.72 0.012 60);
    --border: oklch(1 0 0 / 12%);
    --shadow: oklch(0 0 0 / 40%);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100svh; display: flex; flex-direction: column;
  background: var(--background); color: var(--foreground);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
h2, p, ul { margin: 0; }
svg.i { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.wrap { width: 100%; max-width: 70rem; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted-foreground); }

/* Header: brand and account on a phone; the section nav joins them from md. */
header { background: var(--card); border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top); }
header .wrap { min-height: 56px; display: flex; align-items: center; gap: 28px; }
.brand { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.top-nav { display: none; flex: 1; gap: 4px; font-size: 14px; font-weight: 500; }
.top-nav a { padding: 8px 12px; border-radius: 8px; color: var(--muted-foreground); }
.top-nav a[aria-current] { background: var(--muted); color: var(--foreground); }
.account { position: relative; margin-left: auto; }
.account > button { height: 44px; padding: 0 4px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; background: transparent; font-size: 14px; font-weight: 500; }
.avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--muted); color: var(--secondary-foreground); display: flex; align-items: center; justify-content: center; }
.account .name, .account .chev { display: none; }

.menu { position: absolute; z-index: 10; min-width: 190px; padding: 4px; display: none; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px var(--shadow); }
.menu.open { display: flex; }
.menu a, .menu button { height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 6px; background: transparent; font-size: 15px; text-align: left; }
.menu hr { height: 1px; margin: 4px 0; border: 0; background: var(--border); }
.account .menu { top: 48px; right: 0; }

main { flex: 1; }
main .wrap { padding-block: 16px 24px; display: flex; flex-direction: column; gap: 24px; }

/* Search with the Media Type picker. */
.search { position: relative; max-width: 45rem; }
.field { height: 46px; display: flex; align-items: center; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
.field > button { height: 100%; padding: 0 10px 0 14px; display: flex; align-items: center; gap: 4px; border: 0; border-right: 1px solid var(--border); background: transparent; font-size: 14px; font-weight: 500; }
.field input { flex: 1; min-width: 0; height: 100%; padding: 0 12px 0 8px; border: 0; background: transparent; color: inherit; font: inherit; font-size: 15px; outline: none; }
.field input::placeholder { color: var(--muted-foreground); }
.search .menu { top: 50px; left: 0; }

.columns { display: flex; flex-direction: column; gap: 24px; }
section { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.section-head { min-height: 36px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.section-head > a { font-size: 14px; color: var(--muted-foreground); white-space: nowrap; }

.tabs { order: 3; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 10px; background: var(--muted); width: 100%; }
.tabs button { height: 34px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--muted-foreground); font-size: 13px; font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px var(--shadow); }

.rows { padding: 0 12px; list-style: none; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
.row { padding: 10px 0; display: flex; align-items: center; gap: 12px; }
.row + .row { border-top: 1px solid var(--border); }
.cover { flex-shrink: 0; border-radius: 4px; background: var(--muted); color: var(--muted-foreground); display: flex; align-items: center; justify-content: center; }
.text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.text a { font-size: 15px; font-weight: 600; }
.text a, .text p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.text p { font-size: 13px; color: var(--muted-foreground); }
.meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-foreground); }
.stars { display: flex; }
.star { position: relative; display: inline-block; }
.star svg { display: block; }
.star .fill { position: absolute; top: 0; left: 0; overflow: hidden; }

/* Bottom tab bar: phones only. */
.tabbar { position: sticky; bottom: 0; z-index: 5; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--card); border-top: 1px solid var(--border); }
.tabbar a { padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted-foreground); font-size: 11px; font-weight: 500; }
.tabbar a[aria-current] { color: var(--primary); font-weight: 600; }

footer { border-top: 1px solid var(--border); }
footer .wrap { padding-block: 16px; font-size: 12px; color: var(--muted-foreground); }

@media (min-width: 768px) {
  .wrap { padding: 0 24px; }
  header .wrap { min-height: 60px; }
  .top-nav { display: flex; }
  .account .name, .account .chev { display: inline; }
  .tabbar { display: none; }
  main .wrap { padding-block: 32px 48px; gap: 32px; }
  .columns { flex-direction: row; align-items: flex-start; gap: 32px; }
  .section-head { justify-content: flex-start; column-gap: 16px; }
  .section-head > a { margin-left: auto; }
  .tabs { order: 1; display: flex; width: auto; }
  .section-head > a { order: 2; }
  .tabs button { height: 30px; }
  .rows { padding: 0 14px; }
  .row { padding: 12px 0; gap: 14px; }
}
</style>
</head>
<body>

<header>
<div class="wrap">
<a href="#" class="brand">TasteTrack</a>
<nav class="top-nav" aria-label="Main">
<a href="#" aria-current="page">Home</a>
<a href="#">Log</a>
<a href="#">Up next</a>
<a href="#">Lists</a>
</nav>
<div class="account">
<button type="button" aria-label="Account" aria-expanded="false" data-menu="account-menu">
<span class="avatar"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>
<span class="name">[Display name]</span>
<svg class="i chev" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<div class="menu" id="account-menu" role="menu">
<a href="#" role="menuitem">Invites</a>
<a href="#" role="menuitem">Settings</a>
<hr>
<button type="button" role="menuitem">Log out</button>
</div>
</div>
</div>
</header>

<main>
<div class="wrap">

<div class="search">
<div class="field">
<button type="button" aria-label="Search in" aria-expanded="false" data-menu="type-menu"><span id="search-type">Films</span><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<svg class="i muted" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="margin-left: 12px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" id="search-input" aria-label="Search films" placeholder="Search films">
</div>
<div class="menu" id="type-menu" role="menu"></div>
</div>

<div class="columns">
<section aria-labelledby="latest">
<div class="section-head">
<h2 id="latest">Latest in your Log</h2>
<a href="#">All 24 in your Log</a>
</div>
<ul class="rows" id="latest-rows"></ul>
</section>

<section aria-labelledby="upnext">
<div class="section-head">
<h2 id="upnext">Up next</h2>
<a href="#" id="backlog-link"></a>
<div class="tabs" role="tablist" aria-label="Type" id="tabs"></div>
</div>
<ul class="rows" id="upnext-rows"></ul>
</section>
</div>

</div>
</main>

<footer>
<div class="wrap">Film data from TMDB · Book data from Open Library · Music data from MusicBrainz · Game data from IGDB</div>
</footer>

<nav class="tabbar" aria-label="Main">
<a href="#" aria-current="page"><svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>Home</a>
<a href="#"><svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Log</a>
<a href="#"><svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Up next</a>
<a href="#"><svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>Lists</a>
</nav>

<script>
// Mockup data and the few interactions: the type picker, the Up next tabs and the account menu.
const TYPES = {
  film: { label: "Films", one: "Film", verb: "Watched", backlog: "Watchlist", search: "Search films", count: 12,
    icon: '<rect x="3" y="9" width="18" height="12" rx="1.5"></rect><path d="M3 9l1.5-5h16L19 9M9 4l-1.5 5M14 4l-1.5 5M19 4l-1.5 5"></path>', w: 40, h: 60 },
  book: { label: "Books", one: "Book", verb: "Read", backlog: "Reading list", search: "Search books", count: 7,
    icon: '<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path>', w: 40, h: 60 },
  music: { label: "Music", one: "Album", verb: "Listened", backlog: "Listen later", search: "Search albums", count: 9,
    icon: '<circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle>', w: 50, h: 50 },
  game: { label: "Games", one: "Game", verb: "Played", backlog: "Play next", search: "Search games", count: 4,
    icon: '<rect x="2" y="7" width="20" height="11" rx="4"></rect><path d="M6 12.5h4M8 10.5v4"></path><circle cx="15.5" cy="11.5" r="0.9" fill="currentColor"></circle><circle cx="17.5" cy="13.5" r="0.9" fill="currentColor"></circle>', w: 45, h: 60 },
};
const LATEST = [
  ["music", "Kid A", "Radiohead, 2000", 4.5, "Oct 25"],
  ["book", "Dune", "Frank Herbert, 1965", 4, "Oct 20"],
  ["game", "Outer Wilds", "Mobius Digital, 2019", 5, "Oct 16"],
  ["film", "Amélie", "2001, 122 min", 5, "Oct 11"],
  ["music", "Blonde", "Frank Ocean, 2016", 5, "Oct 7"],
];
const UP_NEXT = {
  film: [["The Matrix", "1999, 136 min"], ["Perfect Days", "2023, 124 min"], ["Aftersun", "2022, 102 min"], ["Fallen Leaves", "2023, 81 min"]],
  book: [["Piranesi", "Susanna Clarke, 2020"], ["The Left Hand of Darkness", "Ursula K. Le Guin, 1969"], ["Lincoln in the Bardo", "George Saunders, 2017"], ["The Remains of the Day", "Kazuo Ishiguro, 1989"]],
  music: [["Promises", "Floating Points & Pharoah Sanders, 2021"], ["Titanic Rising", "Weyes Blood, 2019"], ["SOS", "SZA, 2022"], ["Ants From Up There", "Black Country, New Road, 2022"]],
  game: [["Hollow Knight: Silksong", "Team Cherry, 2025"], ["Celeste", "Maddy Makes Games, 2018"], ["Return of the Obra Dinn", "Lucas Pope, 2018"], ["Pentiment", "Obsidian Entertainment, 2022"]],
};

const STAR = "12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26";
const starSvg = (filled) =>
  `<svg width="12" height="12" viewBox="0 0 24 24" fill="${filled ? "var(--primary)" : "none"}" stroke="${filled ? "var(--primary)" : "var(--muted-foreground)"}" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><polygon points="${STAR}"></polygon></svg>`;
const stars = (rating) =>
  `<span class="stars" role="img" aria-label="${rating} stars">${[1, 2, 3, 4, 5]
    .map((s) => {
      const fill = rating >= s ? 1 : rating >= s - 0.5 ? 0.5 : 0;
      return `<span class="star" style="width:12px;height:12px">${starSvg(false)}${fill ? `<span class="fill" style="width:${fill * 12}px;height:12px">${starSvg(true)}</span>` : ""}</span>`;
    })
    .join("")}</span>`;
const icon = (type, size) => `<svg class="i" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${TYPES[type].icon}</svg>`;
const cover = (type) => `<div class="cover" style="width:${TYPES[type].w}px;height:${TYPES[type].h}px">${icon(type, 18)}</div>`;

document.getElementById("latest-rows").innerHTML = LATEST.map(
  ([type, title, by, rating, date]) => `
  <li class="row">${cover(type)}
    <div class="text"><a href="#">${title}</a><p>${TYPES[type].one} · ${by}</p>
      <div class="meta">${stars(rating)}<span>${TYPES[type].verb} ${date}</span></div></div>
  </li>`,
).join("");

let tab = "film";
function renderUpNext() {
  document.getElementById("tabs").innerHTML = Object.entries(TYPES)
    .map(([key, t]) => `<button type="button" role="tab" aria-selected="${key === tab}" data-tab="${key}">${t.label}</button>`)
    .join("");
  document.getElementById("backlog-link").textContent = `All ${TYPES[tab].count} in your ${TYPES[tab].backlog}`;
  document.getElementById("upnext-rows").innerHTML = UP_NEXT[tab]
    .map(([title, by]) => `<li class="row">${cover(tab)}<div class="text"><a href="#">${title}</a><p>${by}</p></div></li>`)
    .join("");
}
renderUpNext();
document.getElementById("tabs").addEventListener("click", (event) => {
  const button = event.target.closest("[data-tab]");
  if (!button) return;
  tab = button.dataset.tab;
  renderUpNext();
});

document.getElementById("type-menu").innerHTML = Object.entries(TYPES)
  .map(([key, t]) => `<button type="button" role="menuitemradio" data-type="${key}">${icon(key, 18)}${t.label}</button>`)
  .join("");
document.getElementById("type-menu").addEventListener("click", (event) => {
  const button = event.target.closest("[data-type]");
  if (!button) return;
  const t = TYPES[button.dataset.type];
  document.getElementById("search-type").textContent = t.label;
  const input = document.getElementById("search-input");
  input.placeholder = t.search;
  input.setAttribute("aria-label", t.search);
  closeMenus();
});

function closeMenus() {
  for (const menu of document.querySelectorAll(".menu.open")) menu.classList.remove("open");
  for (const b of document.querySelectorAll("[data-menu]")) b.setAttribute("aria-expanded", "false");
}
for (const button of document.querySelectorAll("[data-menu]")) {
  button.addEventListener("click", (event) => {
    event.stopPropagation();
    const menu = document.getElementById(button.dataset.menu);
    const opening = !menu.classList.contains("open");
    closeMenus();
    menu.classList.toggle("open", opening);
    button.setAttribute("aria-expanded", String(opening));
  });
}
document.addEventListener("click", (event) => {
  if (!event.target.closest(".menu")) closeMenus();
});
</script>
</body>
</html>
