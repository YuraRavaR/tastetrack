name: Set up
description: Install Node from .nvmrc, pnpm from package.json, and the locked dependencies.

inputs:
  playwright:
    description: Also install Chromium for the Playwright tests.
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Chromium
      if: inputs.playwright == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
